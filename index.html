<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>游戏来了 · 经典益智小游戏合集</title>
  <meta name="description" content="游戏来了：免费在线玩经典益智休闲小游戏，2048、数独、扫雷、俄罗斯方块、贪吃蛇、华容道、五子棋、记忆翻牌，无需下载，手机电脑都能玩。">
  <meta name="theme-color" content="#ffd23f">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js"></script>
  <style>
    body { --theme: #ff7a45; --theme-2: #ffd23f; --theme-soft: #fff4d6; }
    .hero h1, .resume-text b, .section-title, .card-name { font-weight: 700 !important; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0 4px;
    }

    /* 大标题 */
    .hero {
      position: relative;
      margin: 14px 0 20px;
      padding: 22px 20px 20px;
      border: var(--outline);
      border-radius: 28px;
      background: #ffd23f;
      color: #2d2a4a;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.55) 2.5px, transparent 3px);
      background-size: 22px 22px;
      pointer-events: none;
    }
    .hero h1 {
      position: relative;
      margin: 0;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(44px, 13vw, 76px);
      line-height: 1;
      letter-spacing: 0.02em;
      color: #fff;
      -webkit-text-stroke: 3px #2d2a4a;
      paint-order: stroke fill;
      text-shadow: 0 5px 0 #2d2a4a;
    }
    .hero h1 span { display: inline-block; }
    .hero h1 .c1 { color: #ff5f6d; transform: rotate(-6deg); }
    .hero h1 .c2 { color: #4b7bff; transform: rotate(4deg) translateY(4px); }
    .hero h1 .c3 { color: #27b36b; transform: rotate(-3deg); }
    .hero h1 .c4 { color: #ff5fa2; transform: rotate(7deg) translateY(2px); }
    .hero h1 .c5 { color: #fff; transform: rotate(-4deg); }
    .hero p {
      position: relative;
      margin: 14px 0 0;
      display: inline-block;
      padding: 4px 14px 5px;
      border: 2.5px solid #2d2a4a;
      border-radius: 999px;
      background: #fff;
      font-weight: 700;
      font-size: 15px;
    }
    .hero-art {
      position: absolute;
      right: 10px;
      bottom: 6px;
      width: clamp(96px, 30vw, 190px);
      height: auto;
      pointer-events: none;
    }

    /* 继续上次 */
    .resume {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 20px;
      padding: 10px 12px 10px 10px;
      border: var(--outline);
      border-radius: 20px;
      background: var(--paper);
      box-shadow: var(--pop);
      text-decoration: none;
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .resume:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
    .resume-icon {
      flex: none;
      width: 48px;
      height: 48px;
      border: 2.5px solid var(--ink);
      border-radius: 14px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--theme);
    }
    .resume-icon svg { width: 82%; height: 82%; }
    .resume-text { flex: 1; min-width: 0; line-height: 1.25; }
    .resume-text small { display: block; color: var(--text-dim); font-size: 12px; font-weight: 700; }
    .resume-text b { font-family: var(--font-display); font-weight: 400; font-size: 21px; }
    .resume-go {
      flex: none;
      display: inline-flex;
      align-items: center;
      height: 38px;
      padding: 0 16px;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      background: var(--theme);
      color: var(--theme-ink);
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 3px 0 var(--ink);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 24px;
    }
    .section-title::after {
      content: "";
      flex: 1;
      height: 3px;
      border-radius: 3px;
      background: repeating-linear-gradient(90deg, var(--ink) 0 10px, transparent 10px 18px);
      opacity: .25;
    }

    /* 游戏卡片 */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }
    .card {
      display: flex;
      flex-direction: column;
      border: var(--outline);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: var(--pop);
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      transition: transform .15s cubic-bezier(.2, 1.4, .4, 1), box-shadow .08s ease;
    }
    .card:nth-child(odd):hover { transform: translateY(-4px) rotate(-1.5deg); }
    .card:nth-child(even):hover { transform: translateY(-4px) rotate(1.5deg); }
    .card:active { transform: translateY(3px) !important; box-shadow: 0 1px 0 var(--ink); }
    .card:focus-visible { outline: 3px solid var(--theme); outline-offset: 3px; }

    .thumb {
      position: relative;
      aspect-ratio: 4 / 3;
      display: grid;
      place-items: center;
      background-color: var(--theme);
      background-image: radial-gradient(rgba(255, 255, 255, 0.28) 2.5px, transparent 3px);
      background-size: 18px 18px;
      border-bottom: var(--outline);
    }
    .thumb svg {
      width: 74%;
      height: 84%;
      transition: transform .25s cubic-bezier(.2, 1.4, .4, 1);
    }
    .card:hover .thumb svg { transform: scale(1.06) rotate(-2deg); }

    .card-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 9px 12px 10px 14px;
    }
    .card-name {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 21px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .card-stat {
      min-width: 0;
      padding: 1px 8px 2px;
      border-radius: 999px;
      background: var(--theme-soft);
      color: #2d2a4a;
      border: 2px solid var(--ink);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-stat:empty { display: none; }

    .footer {
      padding: 32px 0 calc(24px + env(safe-area-inset-bottom));
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .hero { margin: 10px 0 18px; padding: 18px 16px 16px; border-radius: 24px; }
      .hero p { font-size: 14px; }
      .card { border-radius: 20px; }
      .card-body { flex-direction: column; align-items: flex-start; gap: 3px; padding: 8px 10px 10px 12px; }
      .card-name { font-size: 19px; }
      .card-stat { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="./">
        <img class="brand-logo" src="assets/logo.svg" alt="">
        游戏来了
      </a>
      <button class="icon-btn theme-toggle" type="button" aria-label="切换白天/夜间模式" title="切换白天/夜间模式">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <section class="hero">
      <h1><span class="c1">游</span><span class="c2">戏</span><span class="c3">来</span><span class="c4">了</span><span class="c5">!</span></h1>
      <p>8 款经典小游戏 · 点开就玩</p>
      <svg class="hero-art" viewBox="0 0 120 90" aria-hidden="true">
        <g stroke="#2d2a4a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
          <path d="M24 30h60a20 20 0 0 1 20 20v6a18 18 0 0 1-32 11l-4-5H52l-4 5a18 18 0 0 1-32-11v-6a20 20 0 0 1 8-20z" fill="#ff7a45"/>
          <path d="M30 44h8v-8h8v8h8v8h-8v8h-8v-8h-8z" fill="#fff"/>
          <circle cx="78" cy="44" r="6" fill="#ffd23f"/>
          <circle cx="90" cy="54" r="6" fill="#4b7bff"/>
          <path d="M95 8l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fff"/>
          <path d="M10 14l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#ff5fa2"/>
        </g>

    <a class="resume" id="resume" href="#" hidden>
      <span class="resume-icon" id="resume-icon"></span>
      <span class="resume-text"><small>继续上次</small><b id="resume-name"></b></span>
      <span class="resume-go">继续 ▶</span>

    <h2 class="section-title">全部游戏</h2>

    <main class="grid" id="games">

      <a class="card" href="games/minesweeper/" data-game="minesweeper">
        <div class="thumb">
          <svg viewBox="0 0 100 80" aria-hidden="true">
            <g stroke="#2d2a4a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
              <rect x="66" y="44" width="28" height="28" rx="6" fill="#f3e6c4"/>

            </g>
            <circle cx="43" cy="40" r="5" fill="#fff"/>

      <a class="card" href="games/tetris/" data-game="tetris">

              <g fill="#ffd23f"><rect x="12" y="60" width="16" height="16" rx="3"/><rect x="28" y="60" width="16" height="16" rx="3"/><rect x="12" y="44" width="16" height="16" rx="3"/><rect x="28" y="44" width="16" height="16" rx="3"/></g>
              <g fill="#5ad1ff"><rect x="44" y="60" width="16" height="16" rx="3"/><rect x="60" y="60" width="16" height="16" rx="3"/><rect x="76" y="60" width="16" height="16" rx="3"/><rect x="76" y="44" width="16" height="16" rx="3"/></g>
            </g>
            <path d="M56 40v8M51 44l5 5 5-5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="card-body"><span class="card-name">俄罗斯方块</span><span class="card-stat"></span></div>
      </a>

      <a class="card" href="games/snake/" data-game="snake">
        <div class="thumb">
          <svg viewBox="0 0 100 80" aria-hidden="true">
            <g stroke="#2d2a4a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
              <path d="M12 64c0-14 22-14 22 0s22 14 22 0-6-26 14-30" fill="none" stroke-width="17"/>
              <path d="M12 64c0-14 22-14 22 0s22 14 22 0-6-26 14-30" fill="none" stroke="#6dd34f" stroke-width="11"/>
              <ellipse cx="74" cy="32" rx="12" ry="10" fill="#6dd34f"/>
              <circle cx="72" cy="28" r="4" fill="#fff" stroke-width="2"/>
              <circle cx="80" cy="30" r="4" fill="#fff" stroke-width="2"/>
              <path d="M85 36l6 1" stroke="#ff4d5e"/>
              <circle cx="88" cy="62" r="8" fill="#ff4d5e"/>
              <path d="M88 54q2-6 7-6" fill="none"/>

          </svg>

              <rect x="67" y="8" width="8" height="28" rx="3" fill="#ffc145"/>

          </svg>
        </div>
        <div class="card-body"><span class="card-name">华容道</span><span class="card-stat"></span></div>
      </a>

      <a class="card" href="games/gomoku/" data-game="gomoku">
        <div class="thumb">

            <g stroke="#2d2a4a" stroke-width="3" stroke-linejoin="round">

              <circle cx="38" cy="28" r="7" fill="#2d2a4a"/><circle cx="50" cy="40" r="7" fill="#2d2a4a"/><circle cx="62" cy="52" r="7" fill="#2d2a4a"/>
              <circle cx="50" cy="28" r="7" fill="#fff"/><circle cx="62" cy="40" r="7" fill="#fff"/>

            <circle cx="36" cy="26" r="2" fill="#fff" opacity=".7"/><circle cx="48" cy="38" r="2" fill="#fff" opacity=".7"/><circle cx="60" cy="50" r="2" fill="#fff" opacity=".7"/>

    </main>

    <footer class="footer">游戏来了 · 进度和成绩只保存在你的浏览器里</footer>
  </div>

  <script>
    (function () {
      var store = window.Site.store;
      var cards = document.querySelectorAll('#games .card');
      var last = store.get('gzly.last', null);

      for (var i = 0; i < cards.length; i++) {
        var card = cards[i];
        var slug = card.getAttribute('data-game');
        var stat = store.get('gzly.' + slug + '.homeStat', null);
        if (typeof stat === 'string' && stat) card.querySelector('.card-stat').textContent = stat;

        if (slug === last) {
          var resume = document.getElementById('resume');
          resume.href = card.getAttribute('href');
          resume.setAttribute('data-game', slug);
          document.getElementById('resume-name').textContent = card.querySelector('.card-name').textContent;
          document.getElementById('resume-icon').appendChild(card.querySelector('.thumb svg').cloneNode(true));
          resume.hidden = false;
        }
      }
    })();
  </script>
</body>
</html>
