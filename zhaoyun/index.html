<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>赵云与阿斗 · 长坂坡汉字塔防</title>
<meta name="description" content="长坂坡，赵云单骑救主。征兵布阵、同字合并升级、两字凑成武将，守住阿斗二十波。">
<meta name="theme-color" content="#f3e9d2">
<meta name="color-scheme" content="light">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8.1 3 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.6.8-1.4 2.3-2.6 4.4-2.6 3.6 0 5.7 3.6 4.2 7.1C19.5 16.4 12 21 12 21z" fill="#c8322d" stroke="#2b2420" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 8.2c-.9.3-1.6 1.2-1.6 2.3" stroke="#fff" stroke-opacity=".7" stroke-width="1.5" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-bun" viewBox="0 0 24 24"><path d="M3 17.5c0-6 4-10 9-10s9 4 9 10c0 1.2-1 2-2.2 2H5.2C4 19.5 3 18.7 3 17.5z" fill="#fbf3e1" stroke="#2b2420" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 11.5c1 1.5 1.2 3.4.8 5.4M14.5 11c-.6 1.8-.6 3.8.1 5.8" stroke="#c9b48a" stroke-width="1.3" fill="none" stroke-linecap="round"/><circle cx="12" cy="9.6" r="1.5" fill="#c8322d"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><path d="M5 4.5h10.5a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M5 16.5a3 3 0 0 1 3-3h10.5M9 8.5h6" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-recycle" viewBox="0 0 24 24"><path d="M5.5 9h13l-1.3 10.2a1.5 1.5 0 0 1-1.5 1.3H8.3a1.5 1.5 0 0 1-1.5-1.3z" fill="#e3c27a" stroke="#2b2420" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 12.5h8M8.6 16h6.8" stroke="#8a6a2e" stroke-width="1.3" stroke-linecap="round"/><path d="M4 9h16" stroke="#2b2420" stroke-width="1.8" stroke-linecap="round"/><path d="M9 6.5c.8-1.6 2-2.3 3-2.3s2.2.7 3 2.3" stroke="#2b2420" stroke-width="1.6" fill="none" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div id="app">
  <header id="hud">
    <div class="stat stat-hp" title="阿斗的心"><svg class="ico"><use href="#i-heart"/></svg><b id="hpV">10</b></div>
    <div class="stat stat-wave" title="波次"><span class="lbl l1">第</span><b id="waveV">1</b><span class="lbl">/20</span><span class="lbl l3">波</span></div>
    <div class="stat stat-bun" id="bunBox" title="馒头"><svg class="ico"><use href="#i-bun"/></svg><b id="bunV">0</b></div>
    <div class="hud-btns">
      <button class="hbtn speed" id="btnSpeed" aria-label="切换速度">×1</button>
      <button class="hbtn" id="btnSound" aria-label="声音"><svg class="ico"><use href="#i-sound"/></svg></button>
      <button class="hbtn" id="btnPause" aria-label="暂停"><svg class="ico"><use href="#i-pause"/></svg></button>
    </div>
  </header>

  <main id="field">
    <div id="boardWrap">
      <canvas id="cv"></canvas>
      <div id="flash"></div>
      <button id="btnNext" class="hidden"><span class="nx-t">下一波</span><span class="nx-c" id="nextCount">6</span><span class="nx-b" id="nextBonus"></span></button>
      <div id="banner" class="banner"><div class="b-main"></div><div class="b-sub"></div></div>
      <div id="skillStrip"></div>
    </div>
  </main>

  <section id="dock">
    <div id="bench">
      <div class="slot" data-i="0"><canvas></canvas></div>
      <div class="slot" data-i="1"><canvas></canvas></div>
      <div class="slot" data-i="2"><canvas></canvas></div>
      <div class="slot" data-i="3"><canvas></canvas></div>
      <div class="slot" data-i="4"><canvas></canvas></div>
    </div>
    <div id="controls">
      <div id="recycle" aria-label="回收"><svg class="ico"><use href="#i-recycle"/></svg><span class="rc-t">回收</span><span class="rc-v" id="recycleV"></span></div>
      <button id="btnSummon"><span class="sm-t">征兵</span><span class="sm-c"><svg class="ico"><use href="#i-bun"/></svg><b id="costV">10</b></span><span class="sm-why" id="summonWhy"></span></button>
      <button id="btnHelp" class="round-btn" aria-label="玩法与图鉴"><svg class="ico"><use href="#i-help"/></svg></button>
    </div>
  </section>

  <div id="tip" class="tip"></div>
  <div id="tut" class="tut"><span id="tutText"></span><i class="tut-arrow"></i></div>
  <div id="ghost"><canvas></canvas></div>
  <div id="flyLayer"></div>

  <!-- 标题页 -->
  <section id="title" class="screen show">
    <svg class="t-mount" viewBox="0 0 480 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2420" stop-opacity=".55"/><stop offset="1" stop-color="#2b2420" stop-opacity="0"/></linearGradient>
        <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2420" stop-opacity=".28"/><stop offset="1" stop-color="#2b2420" stop-opacity="0"/></linearGradient>
        <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f8a52" stop-opacity=".55"/><stop offset="1" stop-color="#5f8a52" stop-opacity=".05"/></linearGradient>
      </defs>
      <path d="M0 170 L40 130 L70 150 L120 90 L160 140 L200 112 L250 160 L300 100 L340 135 L380 95 L430 150 L480 120 L480 300 L0 300Z" fill="url(#m2)"/>
      <path d="M0 210 L50 160 L90 190 L150 130 L200 185 L240 160 L290 205 L340 150 L400 200 L440 170 L480 190 L480 300 L0 300Z" fill="url(#m1)"/>
      <path d="M0 250 C60 225 110 240 160 228 C220 214 260 245 320 232 C380 220 430 238 480 226 L480 300 L0 300Z" fill="url(#m3)"/>
    </svg>
    <svg class="t-sky" viewBox="0 0 200 120" aria-hidden="true">
      <circle cx="150" cy="52" r="30" fill="#c8322d" opacity=".82"/>
      <path d="M58 22 q7 -5 14 0 q7 -5 14 0 M92 10 q5 -4 10 0 q5 -4 10 0 M80 32 q4 -3 8 0 q4 -3 8 0" stroke="#2b2420" stroke-width="2" fill="none" stroke-linecap="round" opacity=".55"/>
    </svg>
    <div class="t-inner">
      <div class="t-kicker">长坂坡 · 汉字塔防</div>
      <h1 class="t-title"><span>赵</span><span>云</span><span class="small">与</span><span>阿</span><span>斗</span></h1>
      <div class="seal" aria-label="单骑救主"><span>单</span><span>骑</span><span>救</span><span>主</span></div>
      <div class="t-hero"><canvas id="heroCv" width="300" height="130"></canvas></div>
      <div class="t-btns">
        <button class="btn btn-red" id="btnStart">开始</button>
        <button class="btn btn-paper" id="btnRules">玩法</button>
      </div>
      <div class="t-best" id="bestLine"></div>
    </div>
  </section>

  <!-- 选择难度 -->
  <section id="sheetDiff" class="sheet-wrap">
    <div class="sheet">
      <div class="sheet-h"><h2>选择难度</h2><button class="x" data-close aria-label="关闭">×</button></div>
      <button class="continue hidden" id="btnContinue"></button>
      <div class="diffs">
        <button class="diff" data-diff="easy"><b>简单</b><span>敌军血量 ×0.8 · 初始馒头 80</span><em data-best="easy"></em></button>
        <button class="diff" data-diff="normal"><b>普通</b><span>标准长坂坡 · 初始馒头 60</span><em data-best="normal"></em></button>
        <button class="diff" data-diff="hard"><b>困难</b><span>敌军血量 ×1.35 · 初始馒头 50</span><em data-best="hard"></em></button>
      </div>
    </div>
  </section>

  <!-- 玩法与图鉴 -->
  <section id="sheetHelp" class="sheet-wrap">
    <div class="sheet tall">
      <div class="sheet-h"><h2>玩法</h2><button class="x" data-close aria-label="关闭">×</button></div>
      <div class="sheet-body">
        <ol class="tips">
          <li>点<b>「征兵」</b>花馒头招募，字牌进入下方备战栏。</li>
          <li>把字牌<b>拖到路边空地</b>布阵；<b>同字同级</b>拖到一起合并升级，最高 5 级。</li>
          <li>拖<b>「铲」</b>到草地开垦新空地；用不上的字牌拖进<b>「回收」</b>换回馒头。</li>
          <li><b>两个字凑成武将</b>，如 赵 + 云 → 赵云。武将自动放技能，并强化身边同类兵。</li>
          <li>守住阿斗 <b>20 波</b>即胜；第 5 / 10 / 15 / 20 波有敌将来袭。</li>
        </ol>
        <h3>武将图鉴 <small id="codexCount"></small></h3>
        <div class="codex" id="codexGen"></div>
        <h3>兵种</h3>
        <div class="codex units" id="codexUnit"></div>
        <h3>曹军</h3>
        <div class="codex foes" id="codexFoe"></div>
      </div>
    </div>
  </section>

  <!-- 暂停 -->
  <section id="sheetPause" class="sheet-wrap">
    <div class="sheet center">
      <div class="pause-title">暂停</div>
      <div class="pause-info" id="pauseInfo"></div>
      <div class="col-btns">
        <button class="btn btn-red" id="btnResume">继续</button>
        <button class="btn btn-paper" id="btnPauseHelp">玩法 · 图鉴</button>
        <button class="btn btn-paper" id="btnRestart">重新开始</button>
        <button class="btn btn-ghost" id="btnHome">回到主页</button>
      </div>
    </div>
  </section>

  <!-- 结算 -->
  <section id="result" class="screen">
    <svg class="t-mount" viewBox="0 0 480 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <linearGradient id="rm1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2420" stop-opacity=".55"/><stop offset="1" stop-color="#2b2420" stop-opacity="0"/></linearGradient>
        <linearGradient id="rm2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2420" stop-opacity=".28"/><stop offset="1" stop-color="#2b2420" stop-opacity="0"/></linearGradient>
        <linearGradient id="rm3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f8a52" stop-opacity=".55"/><stop offset="1" stop-color="#5f8a52" stop-opacity=".05"/></linearGradient>
      </defs>
      <path d="M0 170 L40 130 L70 150 L120 90 L160 140 L200 112 L250 160 L300 100 L340 135 L380 95 L430 150 L480 120 L480 300 L0 300Z" fill="url(#rm2)"/>
      <path d="M0 210 L50 160 L90 190 L150 130 L200 185 L240 160 L290 205 L340 150 L400 200 L440 170 L480 190 L480 300 L0 300Z" fill="url(#rm1)"/>
      <path d="M0 250 C60 225 110 240 160 228 C220 214 260 245 320 232 C380 220 430 238 480 226 L480 300 L0 300Z" fill="url(#rm3)"/>
    </svg>
    <div class="r-inner">
      <div class="r-title" id="rTitle"></div>
      <div class="r-sub" id="rSub"></div>
      <div class="r-art"><canvas id="rCv" width="320" height="120"></canvas></div>
      <div class="r-stats" id="rStats"></div>
      <div class="r-gens" id="rGens"></div>
      <div class="col-btns">
        <button class="btn btn-red" id="btnAgain">再来一局</button>
        <button class="btn btn-paper" id="btnResHome">回到主页</button>
      </div>
    </div>
  </section>
</div>

<script src="core.js"></script>
<script src="game.js"></script>
</body>
</html>
