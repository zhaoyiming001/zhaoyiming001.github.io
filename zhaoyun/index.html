<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>赵云与阿斗 · 水墨汉字塔防</title>
<meta name="description" content="字即是兵：水墨汉字塔防。「弓」字拉满放箭，「枪」的木旁化作长枪，「刀」的一撇飞出斩敌。与 AI 对手同守阿斗，十场三国战役。">
<meta name="theme-color" content="#efe6d3">
<meta name="color-scheme" content="light">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/brush.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 对战 -->
  <section id="battle" class="screen">
    <canvas id="cv"></canvas>
    <div id="flash"></div>
    <header id="topbar">
      <div class="foe" title="对手">
        <span class="seal" id="foeSeal">曹</span>
        <span class="foe-t"><span id="foeTitle"></span><b id="foeName"></b></span>
        <span class="hearts" id="foeHearts"></span>
      </div>
      <div class="lvname" id="lvName"></div>
      <span class="vs">对</span>
      <div class="me" title="你的阿斗">
        <span class="hearts" id="meHearts"></span>
        <span class="me-t">阿斗</span>
      </div>
      <button id="speedBtn" class="tb-btn" aria-label="速度">×1</button>
      <button id="btnPause" class="tb-btn" aria-label="暂停"><i class="pz"></i></button>
    </header>
    <div id="ridge">
      <div class="rg-l"><span id="waveLbl"></span><span id="waveOf"></span></div>
      <button id="btnGo" class="hidden">开战</button>
    </div>
    <button id="btnSummon"><span class="sm-t">征兵</span><span class="sm-c">五张 · <b id="costV">15</b> 馒头<i id="smHint"></i></span></button>
    <div id="bunBox" title="馒头"><i class="bun"></i><b id="bunV">0</b></div>
    <div id="banner" class="banner"><div class="b-main"></div><div class="b-sub"></div></div>
    <div id="tip" class="tip"></div>
    <div id="tut" class="tut"></div>
  </section>

  <!-- 标题 -->
  <section id="title" class="screen">
    <canvas id="titleCv"></canvas>
    <div class="t-inner">
      <div class="t-tag">字即是兵 · 水墨三国汉字塔防</div>
      <div class="t-btns">
        <button class="btn btn-red" id="btnStart">出征</button>
        <button class="btn btn-ghost" id="btnTitleSound">声音：开</button>
      </div>
      <div class="t-foot">笔画数据 Arphic PL · 与 AI 同守阿斗，先失三心者败</div>
    </div>
  </section>

  <!-- 战役 -->
  <section id="map" class="screen">
    <div class="map-head">
      <button class="back" id="btnMapBack" aria-label="返回">‹</button>
      <h2>征战天下</h2>
      <div class="map-stars"><i class="st"></i><b id="mapStars">0</b></div>
    </div>
    <div class="map-list" id="mapList"></div>
  </section>

  <!-- 战前 -->
  <section id="intro" class="sheet-wrap">
    <div class="sheet scroll">
      <button class="x" id="btnIntroClose" aria-label="关闭">×</button>
      <div class="in-kicker" id="inKicker"></div>
      <h2 class="in-title" id="inTitle"></h2>
      <p class="in-blurb" id="inBlurb"></p>
      <div class="in-rows" id="inRows"></div>
      <div class="in-new" id="inNew"></div>
      <button class="btn btn-red" id="btnGoLv">出战</button>
    </div>
  </section>

  <!-- 暂停 -->
  <section id="sheetPause" class="sheet-wrap">
    <div class="sheet center">
      <div class="pause-title">暂停</div>
      <div class="pause-info" id="pauseInfo"></div>
      <div class="col-btns">
        <button class="btn btn-red" id="btnResume">继续</button>
        <button class="btn btn-ghost" id="btnRestart">重新开始</button>
        <button class="btn btn-ghost" id="btnSound2">声音：开</button>
        <button class="btn btn-ghost" id="btnToMap">返回战役</button>
      </div>
    </div>
  </section>

  <!-- 结算 -->
  <section id="result" class="screen">
    <canvas id="resultCv"></canvas>
    <div class="r-inner">
      <div class="r-title" id="rTitle"></div>
      <div class="r-sub" id="rSub"></div>
      <div class="r-stars" id="rStars"></div>
      <div class="r-stats" id="rStats"></div>
      <div class="r-unlock" id="rUnlock"></div>
      <div class="col-btns">
        <button class="btn btn-red" id="btnNextLv">下一战</button>
        <button class="btn btn-ghost" id="btnRetry">再战</button>
        <button class="btn btn-ghost" id="btnResMap">返回战役</button>
      </div>
    </div>
  </section>
</div>

<script src="strokes.js"></script>
<script src="core.js"></script>
<script src="ink.js"></script>
<script src="sound.js"></script>
<script src="anim.js"></script>
<script src="game.js"></script>
</body>
</html>
