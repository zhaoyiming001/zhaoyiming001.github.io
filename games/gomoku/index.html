<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>五子棋 · 游戏来了</title>
  <meta name="description" content="在线玩五子棋：人机对战（简单 / 普通 / 困难）或双人同屏对弈，支持悔棋，自动保存棋局。">
  <meta name="theme-color" content="#f7f2ea">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='6' fill='%23e2b56a'/%3E%3Cpath d='M1 11h30M1 21h30M11 1v30M21 1v30' stroke='%238a5a2b' stroke-width='1.2'/%3E%3Ccircle cx='11' cy='11' r='6.5' fill='%23222'/%3E%3Ccircle cx='21' cy='21' r='6.5' fill='%23fff' stroke='%23888'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/site.css">
  <script src="../../assets/site.js"></script>
  <style>
    :root {
      --stage-max: 520px;
      --wood-a: #efcf8f;
      --wood-b: #e0b56c;
      --wood-c: #d3a35a;
      --wood-line: #6b4520;
      --wood-edge: rgba(110, 70, 25, 0.35);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --wood-a: #dcb574; --wood-b: #c99d55; --wood-c: #b98c47; --wood-line: #4f3214; --wood-edge: rgba(0, 0, 0, 0.5); }
    }
    :root[data-theme="dark"] { --wood-a: #dcb574; --wood-b: #c99d55; --wood-c: #b98c47; --wood-line: #4f3214; --wood-edge: rgba(0, 0, 0, 0.5); }

    .stage {
      width: min(100%, calc(100dvh - 216px));
      min-width: 260px;
      align-self: center;
    }
    .board {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 14px;
      background:
        radial-gradient(120% 90% at 18% 8%, rgba(255, 244, 214, 0.38), transparent 60%),
        repeating-linear-gradient(96deg, rgba(120, 72, 24, 0.06) 0 2px, transparent 2px 9px),
        repeating-linear-gradient(84deg, rgba(120, 72, 24, 0.05) 0 1px, transparent 1px 14px),
        linear-gradient(135deg, var(--wood-a), var(--wood-b) 55%, var(--wood-c));
      box-shadow: inset 0 0 0 1px var(--wood-edge), inset 0 -3px 0 rgba(110, 70, 25, 0.18), var(--shadow);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      outline: none;
      cursor: pointer;
    }
    .board:focus-visible { box-shadow: 0 0 0 3px var(--accent), var(--shadow); }
    .board.locked { cursor: default; }
    .board svg { display: block; width: 100%; height: 100%; }

    .grid line { stroke: var(--wood-line); stroke-opacity: 0.78; stroke-width: 1.5; }
    .grid .edge { stroke-width: 3; stroke-opacity: 0.9; }
    .grid circle { fill: var(--wood-line); fill-opacity: 0.9; }

    .st { transform-box: fill-box; transform-origin: center; }
    .st.new { animation: stone-in 170ms cubic-bezier(.3, 1.4, .5, 1); }
    @keyframes stone-in { from { transform: scale(1.25); opacity: 0.2; } to { transform: none; opacity: 1; } }
    .num { font: 800 15px var(--font); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .num.small { font-size: 12.5px; }
    .num.last { fill: #ff5a3c !important; }

    .ghost { opacity: 0.5; pointer-events: none; }
    .ghost.pending { opacity: 0.62; }
    .ghost .ring { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 5 4; }
    .cross line { stroke: var(--accent); stroke-opacity: 0.55; stroke-width: 2.4; }

    .winline { stroke: #ff5a3c; stroke-width: 5; stroke-linecap: round; stroke-opacity: 0.85; }
    .winring { fill: none; stroke: #ffcf3f; stroke-width: 3.5; animation: glow 1.1s ease-in-out infinite alternate; }
    @keyframes glow { from { stroke-opacity: 0.45; } to { stroke-opacity: 1; } }

    .stat-value .ic {
      display: inline-block;
      width: 0.8em;
      height: 0.8em;
      margin-right: 6px;
      border-radius: 50%;
      vertical-align: -0.06em;
    }
    .ic.b { background: radial-gradient(circle at 35% 30%, #777, #1a1a1a 55%, #000); }
    .ic.w { background: radial-gradient(circle at 35% 30%, #fff, #ece8e0 55%, #bcb6aa); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.22); }
    .thinking { color: var(--text-dim); }
    .thinking .dots::after { content: "…"; animation: blink 0.9s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0.2; } }

    .gcontrols { justify-content: center; }
    .gcontrols .btn svg { width: 16px; height: 16px; }

    .overlay h2.good { color: var(--accent); }
    .overlay { background: color-mix(in srgb, var(--bg) 74%, transparent); }

    .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .set-row:last-of-type { border-bottom: 0; }
    .set-row > span { font-weight: 800; font-size: 15px; }
    .set-row.off { opacity: 0.4; pointer-events: none; }
    .set-note { margin: 4px 0 0; font-size: 12px; color: var(--text-dim); text-align: center; }

    @media (max-width: 380px) {
      .stat-value { font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .winring { animation: none; }
    }
  </style>
</head>
<body class="game-page" data-game="gomoku">
  <header class="gbar">
    <a class="icon-btn" href="../../" aria-label="返回游戏大厅" title="返回游戏大厅">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="gbar-title">五子棋</h1>
    <div class="gbar-actions">
      <button class="icon-btn sound-toggle" type="button" aria-label="关闭声音">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
      </button>
      <button class="icon-btn" type="button" data-open="help" aria-label="玩法说明" title="玩法说明">?</button>
    </div>
  </header>

  <main class="gmain">
    <div class="stats">
      <div class="stat"><span class="stat-label">回合</span><span class="stat-value" id="turn"></span></div>
      <div class="stat"><span class="stat-label" id="rec-label">战绩</span><span class="stat-value" id="rec">胜 0 负 0</span></div>
      <div class="btns">
        <button class="btn" type="button" id="undo" title="悔棋 (Ctrl+Z)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          悔棋
        </button>
        <button class="btn primary" type="button" id="new-game">新局</button>
      </div>
    </div>

    <div class="stage">
      <div class="board" id="board" tabindex="0" aria-label="五子棋棋盘">
        <svg id="svg" viewBox="0 0 616 616" aria-hidden="true">
          <defs>
            <radialGradient id="gB" cx="0.36" cy="0.32" r="0.72">
              <stop offset="0" stop-color="#707070"/>
              <stop offset="0.38" stop-color="#2b2b2b"/>
              <stop offset="1" stop-color="#050505"/>
            </radialGradient>
            <radialGradient id="gW" cx="0.36" cy="0.32" r="0.75">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset="0.55" stop-color="#f1eee8"/>
              <stop offset="1" stop-color="#c6c0b4"/>
            </radialGradient>
            <radialGradient id="gS">
              <stop offset="0.55" stop-color="#000" stop-opacity="0.42"/>
              <stop offset="1" stop-color="#000" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <g class="grid" id="grid"></g>
          <g class="cross" id="cross"></g>
          <g id="stones"></g>
          <g id="win"></g>
          <g id="ghost"></g>
        </svg>
      </div>

      <div class="overlay" id="over" hidden>
        <h2 id="over-title">你赢了！</h2>
        <p id="over-text"></p>
        <div class="row">
          <button class="btn" type="button" id="peek">看棋盘</button>
          <button class="btn primary" type="button" id="again">再来一局</button>
        </div>
      </div>
    </div>

    <div class="gcontrols">
      <button class="btn sm" type="button" data-open="settings" id="mode-chip" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span id="mode-text">人机 · 普通 · 执黑</span>
      </button>
    </div>
  </main>

  <dialog class="sheet" id="settings">
    <div class="sheet-head">
      <h2>设置</h2>
      <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <div class="set-row"><span>模式</span>
        <div class="seg" data-key="mode"><button type="button" data-v="ai">人机</button><button type="button" data-v="pvp">双人</button></div>
      </div>
      <div class="set-row" id="row-diff"><span>难度</span>
        <div class="seg" data-key="diff"><button type="button" data-v="easy">简单</button><button type="button" data-v="normal">普通</button><button type="button" data-v="hard">困难</button></div>
      </div>
      <div class="set-row" id="row-side"><span>执子</span>
        <div class="seg" data-key="side"><button type="button" data-v="1">执黑先手</button><button type="button" data-v="2">执白后手</button></div>
      </div>
      <div class="set-row"><span>手数</span>
        <div class="seg" data-key="nums"><button type="button" data-v="0">隐藏</button><button type="button" data-v="1">显示</button></div>
      </div>
      <p class="set-note">更改模式、难度或执子会开始新局</p>
    </div>
  </dialog>

  <dialog class="sheet" id="help">
    <div class="sheet-head">
      <h2>怎么玩</h2>
      <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <ul class="tips">
        <li><b>🏆</b><span>黑先白后，横竖斜连成 <strong>五子</strong> 就赢。</span></li>
        <li><b>👆</b><span>手机上点一下预览，<strong>再点一下</strong>落子。</span></li>
        <li><b>↶</b><span>人机悔棋会同时退回你和 AI 的一步。</span></li>
        <li><b>⚙️</b><span>棋盘下方按钮切换模式和难度。</span></li>
      </ul>
      <p style="margin:18px 0 0"><button class="btn block theme-toggle" type="button">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        切换深色 / 浅色
      </button></p>
    </div>
  </dialog>

  <script>
  (function () {
    'use strict';

    var store = window.Site.store;
    var sound = window.Site.sound;
    var K_SET = 'gzly.gomoku.settings';
    var K_GAME = 'gzly.gomoku.game';
    var K_REC = 'gzly.gomoku.record';

    var N = 15, NN = 225, CENTER = 112;
    var now = (window.performance && performance.now) ? function () { return performance.now(); } : Date.now;

    // ================= 引擎：棋型表 =================
    // 一条线上以落子点为中心取 9 格（两侧各 4 格），编码为 3 进制：0 空，1 己方，2 对方/出界
    // 棋型：0 无，1 眠二，2 活二，3 眠三，4 活三，5 冲四，6 活四，7 成五
    var POW3 = [1, 3, 9, 27, 81, 243, 729, 2187];
    var SH = new Int8Array(6561).fill(-1);

    function isFive(l) {
      for (var s = 0; s <= 4; s++) {
        if (l[s] === 1 && l[s + 1] === 1 && l[s + 2] === 1 && l[s + 3] === 1 && l[s + 4] === 1) return true;
      }
      return false;
    }

    function shapeOf(code) {
      if (SH[code] >= 0) return SH[code];
      var l = new Int8Array(9), c = code, t, p, res;
      for (t = 0; t < 8; t++) { l[t < 4 ? t : t + 1] = c % 3; c = (c / 3) | 0; }
      l[4] = 1;
      if (isFive(l)) res = 7;
      else {
        var fp = 0;
        for (p = 0; p < 9; p++) {
          if (p !== 4 && l[p] === 0) { l[p] = 1; if (isFive(l)) fp++; l[p] = 0; }
        }
        if (fp >= 2) res = 6;
        else if (fp === 1) res = 5;
        else {
          // 再下一子能形成的最好棋型，降两级
          var best = 0;
          for (t = 0; t < 8; t++) {
            if (l[t < 4 ? t : t + 1] === 0) { var s = shapeOf(code + POW3[t]); if (s > best) best = s; }
          }
          res = best > 2 ? best - 2 : 0;
        }
      }
      SH[code] = res;
      return res;
    }
    for (var ci = 0; ci < 6561; ci++) shapeOf(ci);

    // 每个点每个方向两侧各 4 格的下标
    var DR = [0, 1, 1, 1], DC = [1, 0, 1, -1];
    var LC = new Int16Array(NN * 32);
    var NBL = [];
    (function () {
      for (var i = 0; i < NN; i++) {
        var r = (i / N) | 0, c = i % N;
        for (var d = 0; d < 4; d++) {
          for (var t = 0; t < 8; t++) {
            var k = t < 4 ? t - 4 : t - 3;
            var rr = r + k * DR[d], cc = c + k * DC[d];
            LC[i * 32 + d * 8 + t] = (rr >= 0 && rr < N && cc >= 0 && cc < N) ? rr * N + cc : -1;
          }
        }
        var list = [];
        for (var dr = -2; dr <= 2; dr++) for (var dc = -2; dc <= 2; dc++) {
          if (!dr && !dc) continue;
          var r2 = r + dr, c2 = c + dc;
          if (r2 >= 0 && r2 < N && c2 >= 0 && c2 < N) list.push(r2 * N + c2);
        }
        NBL.push(list);
      }
    })();

    // ================= 引擎：棋盘状态（增量更新） =================
    var board = new Int8Array(NN);
    var SHP = [null, new Int8Array(NN * 4), new Int8Array(NN * 4)];
    var VAL = [null, new Int32Array(NN), new Int32Array(NN)];
    var NB = new Int8Array(NN);

    var V_FIVE = 10000000, V_WIN = 1000000, V_43 = 200000, V_33 = 50000, V_FOUR = 1300;
    var SVAL = [0, 10, 80, 60, 1000, 1300, 0, 0];

    // 在空点 j 落子后，四个方向棋型合成的分值
    function cellVal(sh, b) {
      var n4 = 0, n5 = 0, n6 = 0, n7 = 0, sum = 0;
      for (var d = 0; d < 4; d++) {
        var s = sh[b + d];
        if (s === 7) n7++; else if (s === 6) n6++; else if (s === 5) n5++; else if (s === 4) n4++;
        sum += SVAL[s];
      }
      if (n7) return V_FIVE;
      if (n6 || n5 > 1) return V_WIN;
      if (n5 && n4) return V_43;
      if (n4 > 1) return V_33;
      return sum;
    }

    function refreshDir(j, d) {
      var base = j * 32 + d * 8, c1 = 0, c2 = 0;
      for (var t = 0; t < 8; t++) {
        var q = LC[base + t], P = POW3[t];
        if (q < 0) { c1 += 2 * P; c2 += 2 * P; }
        else {
          var v = board[q];
          if (v === 1) { c1 += P; c2 += 2 * P; }
          else if (v === 2) { c1 += 2 * P; c2 += P; }
        }
      }
      SHP[1][j * 4 + d] = SH[c1];
      SHP[2][j * 4 + d] = SH[c2];
    }

    function updateAround(i) {
      for (var d = 0; d < 4; d++) {
        for (var k = -4; k <= 4; k++) {
          var j = k === 0 ? i : LC[i * 32 + d * 8 + (k < 0 ? k + 4 : k + 3)];
          if (j < 0 || board[j] !== 0) continue;
          refreshDir(j, d);
          VAL[1][j] = cellVal(SHP[1], j * 4);
          VAL[2][j] = cellVal(SHP[2], j * 4);
        }
      }
    }

    function make(i, p) {
      board[i] = p;
      VAL[1][i] = 0; VAL[2][i] = 0;
      updateAround(i);
      var l = NBL[i];
      for (var k = 0; k < l.length; k++) NB[l[k]]++;
    }

    function unmake(i) {
      board[i] = 0;
      updateAround(i);
      var l = NBL[i];
      for (var k = 0; k < l.length; k++) NB[l[k]]--;
    }

    function resetBoard() {
      board.fill(0); SHP[1].fill(0); SHP[2].fill(0); VAL[1].fill(0); VAL[2].fill(0); NB.fill(0);
    }

    // 以 i 为端点的五连（含长连），返回格子列表
    function winLineAt(i) {
      var p = board[i];
      if (!p) return null;
      var r = (i / N) | 0, c = i % N;
      for (var d = 0; d < 4; d++) {
        var cells = [i], rr, cc;
        rr = r - DR[d]; cc = c - DC[d];
        while (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr * N + cc] === p) { cells.unshift(rr * N + cc); rr -= DR[d]; cc -= DC[d]; }
        rr = r + DR[d]; cc = c + DC[d];
        while (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr * N + cc] === p) { cells.push(rr * N + cc); rr += DR[d]; cc += DC[d]; }
        if (cells.length >= 5) return cells;
      }
      return null;
    }

    // ================= AI =================
    function centerBias(i) {
      var r = (i / N) | 0, c = i % N;
      return 14 - Math.abs(r - 7) - Math.abs(c - 7);
    }

    var KEY = new Float64Array(NN);

    // 候选点：先处理必胜 / 必防，其余按 攻+守 排序取前 limit 个
    function genMoves(me, limit) {
      var opp = 3 - me, va = VAL[me], vb = VAL[opp];
      var cand = [], oppFive = -1, myWin = -1, oppWin = false, i;
      for (i = 0; i < NN; i++) {
        if (board[i] || !NB[i]) continue;
        var a = va[i], b = vb[i];
        if (a >= V_FIVE) return [i];
        if (b >= V_FIVE && oppFive < 0) oppFive = i;
        if (a >= V_WIN && myWin < 0) myWin = i;
        if (b >= V_WIN) oppWin = true;
        cand.push(i);
      }
      if (oppFive >= 0) return [oppFive];
      if (myWin >= 0) return [myWin];
      if (!cand.length) {
        for (i = 0; i < NN; i++) if (!board[i]) return [board[CENTER] ? i : CENTER];
        return [];
      }
      if (oppWin) cand = cand.filter(function (j) { return va[j] >= V_FOUR || vb[j] >= V_FOUR; });
      for (i = 0; i < cand.length; i++) { var j = cand[i]; KEY[j] = va[j] + vb[j] + centerBias(j); }
      cand.sort(function (x, y) { return KEY[y] - KEY[x]; });
      return cand.length > limit ? cand.slice(0, limit) : cand;
    }

    var WIN = 1e9, CAP = 5000;
    var deadline = 0, nodes = 0, aborted = false;

    function tick() {
      if ((++nodes & 127) === 0 && now() > deadline) aborted = true;
      return aborted;
    }

    function evaluate(me, ply) {
      var opp = 3 - me, va = VAL[me], vb = VAL[opp];
      var sa = 0, sb = 0, maxA = 0, oppFive = 0;
      for (var i = 0; i < NN; i++) {
        if (board[i]) continue;
        var a = va[i], b = vb[i];
        if (a > maxA) maxA = a;
        if (b >= V_FIVE) oppFive++;
        sa += a < CAP ? a : CAP;
        sb += b < CAP ? b : CAP;
      }
      if (maxA >= V_FIVE) return WIN - ply - 1;
      if (oppFive >= 2) return -(WIN - ply - 2);
      if (!oppFive && maxA >= V_WIN) return (WIN - ply - 3) / 2;
      return sa - sb;
    }

    function negamax(depth, alpha, beta, me, ply) {
      if (tick()) return 0;
      if (depth === 0) return evaluate(me, ply);
      var moves = genMoves(me, 10);
      if (!moves.length) return 0;
      if (VAL[me][moves[0]] >= V_FIVE) return WIN - ply;
      var best = -Infinity;
      for (var k = 0; k < moves.length; k++) {
        var m = moves[k];
        make(m, me);
        var s = -negamax(depth - 1, -beta, -alpha, 3 - me, ply + 1);
        unmake(m);
        if (aborted) return 0;
        if (s > best) best = s;
        if (s > alpha) alpha = s;
        if (alpha >= beta) break;
      }
      return best;
    }

    // 连续冲四取胜（VCF）
    function hasFour(me, i) {
      var b = i * 4, s = SHP[me];
      return s[b] >= 5 || s[b + 1] >= 5 || s[b + 2] >= 5 || s[b + 3] >= 5;
    }

    function vcf(me, depth) {
      var opp = 3 - me, i;
      for (i = 0; i < NN; i++) if (!board[i] && VAL[me][i] >= V_FIVE) return i;
      if (depth <= 0 || tick()) return -1;
      for (i = 0; i < NN; i++) if (!board[i] && VAL[opp][i] >= V_FIVE) return -1;
      var fours = [];
      for (i = 0; i < NN; i++) {
        if (!board[i] && NB[i] && hasFour(me, i)) {
          if (VAL[me][i] >= V_WIN) return i;
          fours.push(i);
        }
      }
      fours.sort(function (x, y) { return VAL[me][y] - VAL[me][x]; });
      for (var k = 0; k < fours.length; k++) {
        var m = fours[k];
        make(m, me);
        // 对方唯一的防点
        var f = -1;
        for (var d = 0; d < 4 && f < 0; d++) {
          for (var t = 0; t < 8; t++) {
            var q = LC[m * 32 + d * 8 + t];
            if (q >= 0 && !board[q] && VAL[me][q] >= V_FIVE) { f = q; break; }
          }
        }
        var r = -1;
        if (f >= 0) {
          make(f, opp);
          r = vcf(me, depth - 1);
          unmake(f);
        }
        unmake(m);
        if (r >= 0) return m;
        if (aborted) return -1;
      }
      return -1;
    }

    function rootSearch(me, moves, depth) {
      var alpha = -Infinity, bestM = moves[0], bestS = -Infinity;
      for (var k = 0; k < moves.length; k++) {
        var m = moves[k];
        make(m, me);
        var s = -negamax(depth - 1, -Infinity, -alpha, 3 - me, 1);
        unmake(m);
        if (aborted) return null;
        if (s > bestS) { bestS = s; bestM = m; }
        if (s > alpha) alpha = s;
      }
      return { move: bestM, score: bestS };
    }

    function hardMove(me) {
      var t0 = now();
      var moves = genMoves(me, 14);
      if (moves.length <= 1) return moves[0];
      aborted = false; nodes = 0;
      deadline = t0 + 140;
      var v = vcf(me, 12);
      if (v >= 0) return v;
      aborted = false;
      deadline = t0 + 480;
      var best = moves[0];
      for (var depth = 2; depth <= 8; depth += 2) {
        var res = rootSearch(me, moves, depth);
        if (!res) break;
        best = res.move;
        lastDepth = depth;
        if (res.score >= WIN / 4 || res.score <= -WIN / 4) break;
        moves.splice(moves.indexOf(best), 1);
        moves.unshift(best);
      }
      return best;
    }
    var lastDepth = 0;

    function normalMove(me) {
      var opp = 3 - me, va = VAL[me], vb = VAL[opp];
      var moves = genMoves(me, 20);
      if (moves.length <= 1) return moves[0];
      var bestA = -1, i, m;
      for (i = 0; i < moves.length; i++) {
        m = moves[i];
        if (va[m] >= V_43 && (bestA < 0 || va[m] > va[bestA])) bestA = m;
      }
      if (bestA >= 0) return bestA;
      var best = moves[0], bk = -Infinity;
      for (i = 0; i < moves.length; i++) {
        m = moves[i];
        var k = (va[m] + vb[m] * 0.9 + centerBias(m)) * (1 + Math.random() * 0.06);
        if (k > bk) { bk = k; best = m; }
      }
      return best;
    }

    function easyMove(me) {
      var opp = 3 - me, va = VAL[me], vb = VAL[opp];
      var all = [], i;
      for (i = 0; i < NN; i++) if (!board[i] && NB[i]) all.push(i);
      if (!all.length) return genMoves(me, 1)[0];
      function pick(test) { var l = all.filter(test); return l.length ? l[(Math.random() * l.length) | 0] : -1; }
      var m = pick(function (j) { return va[j] >= V_FIVE; });
      if (m >= 0 && Math.random() < 0.9) return m;
      m = pick(function (j) { return vb[j] >= V_FIVE; });
      if (m >= 0 && Math.random() < 0.85) return m;
      m = pick(function (j) { return vb[j] >= V_WIN; });
      if (m >= 0 && Math.random() < 0.65) return m;
      // 其余情况：偏重进攻、防守只看小威胁，并加入随机
      var keys = {};
      all.forEach(function (j) {
        keys[j] = Math.min(va[j], 3000) + Math.min(vb[j], 900) * 0.5 + Math.random() * 400 + centerBias(j) * 4;
      });
      all.sort(function (x, y) { return keys[y] - keys[x]; });
      var r = Math.random();
      var idx = r < 0.5 ? 0 : r < 0.75 ? 1 : r < 0.9 ? 2 : 3;
      return all[Math.min(idx, all.length - 1)];
    }

    function chooseMove(diff, me) {
      var empty = true;
      for (var i = 0; i < NN; i++) if (board[i]) { empty = false; break; }
      if (empty) return CENTER;
      if (diff === 'easy') return easyMove(me);
      if (diff === 'hard') return hardMove(me);
      return normalMove(me);
    }

    // ================= 界面 =================
    var VB = 616, M = 28, S = 40, R = 18.5;
    var NS = 'http://www.w3.org/2000/svg';
    var DIFF_NAME = { easy: '简单', normal: '普通', hard: '困难' };
    var AI_DELAY = { easy: 380, normal: 320, hard: 120 };

    var boardEl = document.getElementById('board');
    var svg = document.getElementById('svg');
    var gGrid = document.getElementById('grid');
    var gCross = document.getElementById('cross');
    var gStones = document.getElementById('stones');
    var gWin = document.getElementById('win');
    var gGhost = document.getElementById('ghost');
    var turnEl = document.getElementById('turn');
    var recEl = document.getElementById('rec');
    var recLabel = document.getElementById('rec-label');
    var undoBtn = document.getElementById('undo');
    var overEl = document.getElementById('over');
    var modeText = document.getElementById('mode-text');

    var settings = { mode: 'ai', diff: 'normal', side: 1, nums: false };
    var moves = [];
    var winner = 0;        // 0 进行中，1 黑胜，2 白胜，3 平局
    var winCells = null;
    var peeked = false;    // 结果层被收起
    var thinking = false;
    var aiTimer = null, overTimer = null, aiToken = 0;
    var pending = -1;      // 触屏 / 键盘的预览点
    var hover = -1;        // 鼠标悬停点
    var record = { easy: { w: 0, l: 0, d: 0 }, normal: { w: 0, l: 0, d: 0 }, hard: { w: 0, l: 0, d: 0 } };

    window.Site.played('gomoku');

    function el(tag, attrs, parent) {
      var e = document.createElementNS(NS, tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e);
      return e;
    }
    function px(i) { return M + (i % N) * S; }
    function py(i) { return M + ((i / N) | 0) * S; }

    function drawGrid() {
      var end = M + 14 * S;
      for (var k = 0; k < N; k++) {
        var p = M + k * S, edge = (k === 0 || k === 14) ? 'edge' : '';
        el('line', { x1: M, y1: p, x2: end, y2: p, 'class': edge }, gGrid);
        el('line', { x1: p, y1: M, x2: p, y2: end, 'class': edge }, gGrid);
      }
      [48, 56, 112, 168, 176].forEach(function (i) { el('circle', { cx: px(i), cy: py(i), r: 5 }, gGrid); });
    }

    function turnColor() { return moves.length % 2 === 0 ? 1 : 2; }
    function aiColor() { return 3 - settings.side; }
    function isAiTurn() { return settings.mode === 'ai' && !winner && turnColor() === aiColor(); }
    function canHumanPlay() { return !winner && !thinking && !isAiTurn(); }

    function drawStone(i, color, parent, cls) {
      var g = el('g', { 'class': 'st' + (cls ? ' ' + cls : '') }, parent);
      el('circle', { cx: px(i) + 1.6, cy: py(i) + 2.6, r: R + 2, fill: 'url(#gS)' }, g);
      var c = el('circle', { cx: px(i), cy: py(i), r: R, fill: color === 1 ? 'url(#gB)' : 'url(#gW)' }, g);
      if (color === 2) { c.setAttribute('stroke', 'rgba(0,0,0,.22)'); c.setAttribute('stroke-width', '0.8'); }
      return g;
    }

    function renderStones(animateLast) {
      gStones.textContent = '';
      var last = moves.length - 1;
      for (var k = 0; k < moves.length; k++) {
        var i = moves[k], color = k % 2 === 0 ? 1 : 2;
        var g = drawStone(i, color, gStones, (animateLast && k === last) ? 'new' : '');
        if (settings.nums) {
          var t = el('text', { x: px(i), y: py(i) + 0.5, 'class': 'num' + (k >= 99 ? ' small' : '') + (k === last ? ' last' : ''), fill: color === 1 ? '#f4f0e8' : '#2a2520' }, g);
          t.textContent = k + 1;
        } else if (k === last) {
          el('circle', { cx: px(i), cy: py(i), r: 5, fill: '#ff5a3c' }, g);
        }
      }
      gWin.textContent = '';
      if (winCells) {
        var a = winCells[0], b = winCells[winCells.length - 1];
        el('line', { x1: px(a), y1: py(a), x2: px(b), y2: py(b), 'class': 'winline' }, gWin);
        winCells.forEach(function (i) { el('circle', { cx: px(i), cy: py(i), r: R + 1.5, 'class': 'winring' }, gWin); });
      }
    }

    function renderGhost() {
      gGhost.textContent = '';
      gCross.textContent = '';
      var i = pending >= 0 ? pending : hover;
      if (i < 0 || board[i] || !canHumanPlay()) return;
      var g = el('g', { 'class': 'ghost' + (pending >= 0 ? ' pending' : '') }, gGhost);
      el('circle', { cx: px(i), cy: py(i), r: R, fill: turnColor() === 1 ? 'url(#gB)' : 'url(#gW)' }, g);
      if (pending >= 0) {
        el('circle', { cx: px(i), cy: py(i), r: R + 4, 'class': 'ring' }, g);
        var end = M + 14 * S;
        el('line', { x1: M, y1: py(i), x2: end, y2: py(i) }, gCross);
        el('line', { x1: px(i), y1: M, x2: px(i), y2: end }, gCross);
      }
    }

    function recText() {
      var r = record[settings.diff];
      return '胜 ' + r.w + ' 负 ' + r.l;
    }

    function renderStatus() {
      var color = turnColor(), text, cls = '';
      if (winner === 3) { turnEl.innerHTML = '平局'; }
      else {
        if (winner) {
          color = winner;
          text = settings.mode === 'ai' ? (winner === settings.side ? '你胜' : 'AI 胜') : (winner === 1 ? '黑胜' : '白胜');
        } else if (settings.mode === 'ai') {
          if (thinking || isAiTurn()) { text = '思考中<span class="dots"></span>'; cls = 'thinking'; }
          else text = '你';
        } else {
          text = color === 1 ? '黑方' : '白方';
        }
        turnEl.innerHTML = '<span class="' + cls + '"><i class="ic ' + (color === 1 ? 'b' : 'w') + '"></i>' + text + '</span>';
      }
      if (settings.mode === 'ai') { recLabel.textContent = '战绩'; recEl.textContent = recText(); }
      else { recLabel.textContent = '手数'; recEl.textContent = moves.length; }
      modeText.textContent = settings.mode === 'ai'
        ? '人机 · ' + DIFF_NAME[settings.diff] + ' · ' + (settings.side === 1 ? '执黑' : '执白')
        : '双人对弈';
      undoBtn.disabled = !canUndo();
      boardEl.classList.toggle('locked', !canHumanPlay());
      document.querySelectorAll('#settings .seg').forEach(function (seg) {
        var key = seg.getAttribute('data-key');
        var cur = key === 'nums' ? (settings.nums ? '1' : '0') : String(settings[key]);
        seg.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-v') === cur ? 'true' : 'false'); });
      });
      document.getElementById('row-diff').classList.toggle('off', settings.mode !== 'ai');
      document.getElementById('row-side').classList.toggle('off', settings.mode !== 'ai');
    }

    function renderOverlay() {
      overEl.hidden = !winner || peeked;
      if (!winner) return;
      var title = document.getElementById('over-title');
      var good = false, t;
      if (winner === 3) t = '平局';
      else if (settings.mode === 'ai') { good = winner === settings.side; t = good ? '你赢了！' : 'AI 获胜'; }
      else { good = true; t = winner === 1 ? '黑方胜' : '白方胜'; }
      title.textContent = t;
      title.className = good ? 'good' : '';
      document.getElementById('over-text').textContent = '共 ' + moves.length + ' 手' + (settings.mode === 'ai' ? ' · ' + DIFF_NAME[settings.diff] : '');
    }

    function render(animateLast) {
      renderStones(animateLast);
      renderGhost();
      renderStatus();
    }

    // ---------- 存档 ----------
    function save() {
      store.set(K_GAME, { moves: moves.slice(), peeked: peeked });
    }
    function saveSettings() { store.set(K_SET, settings); }
    function saveRecord() {
      store.set(K_REC, record);
      var total = record.easy.w + record.normal.w + record.hard.w;
      if (total > 0) window.Site.setHomeStat('gomoku', '胜 ' + total);
    }

    // ---------- 对局流程 ----------
    function cancelAI() {
      aiToken++;
      clearTimeout(aiTimer);
      aiTimer = null;
      thinking = false;
    }

    function finish(w, animate) {
      winner = w;
      if (settings.mode === 'ai') {
        var r = record[settings.diff];
        if (w === 3) r.d++; else if (w === settings.side) r.w++; else r.l++;
        saveRecord();
      }
      if (w === 3) sound('match');
      else if (settings.mode === 'ai' && w !== settings.side) sound('lose');
      else sound('win');
      peeked = false;
      clearTimeout(overTimer);
      if (animate) {
        overEl.hidden = true;
        overTimer = setTimeout(renderOverlay, 700);
      } else renderOverlay();
    }

    function playMove(i) {
      if (winner || i < 0 || i >= NN || board[i]) return false;
      var color = turnColor();
      make(i, color);
      moves.push(i);
      pending = -1;
      hover = -1;
      sound('place');
      window.Site.vibrate(8);
      var line = winLineAt(i);
      if (line) { winCells = line; finish(color, true); }
      else if (moves.length === NN) finish(3, true);
      render(true);
      save();
      maybeAI();
      return true;
    }

    function maybeAI() {
      if (!isAiTurn() || thinking) return;
      thinking = true;
      renderStatus();
      renderGhost();
      var token = ++aiToken;
      aiTimer = setTimeout(function () {
        if (token !== aiToken) return;
        var t0 = now();
        var m = chooseMove(settings.diff, aiColor());
        var wait = Math.max(0, AI_DELAY[settings.diff] - (now() - t0));
        aiTimer = setTimeout(function () {
          if (token !== aiToken) return;
          thinking = false;
          playMove(m);
        }, wait);
      }, 40);
    }

    function humanMove(i) {
      if (!canHumanPlay() || board[i]) return;
      playMove(i);
    }

    function canUndo() {
      if (settings.mode !== 'ai') return moves.length > 0;
      return moves.length >= settings.side;
    }

    function popMove() {
      unmake(moves.pop());
    }

    function undo() {
      if (!canUndo()) return;
      cancelAI();
      clearTimeout(overTimer);
      if (settings.mode === 'ai') {
        while (moves.length && (moves.length - 1) % 2 + 1 !== settings.side) popMove();
        if (moves.length) popMove();
      } else popMove();
      winner = 0; winCells = null; peeked = false;
      pending = -1;
      sound('click');
      renderOverlay();
      render(false);
      save();
      maybeAI();
    }

    function newGame() {
      cancelAI();
      clearTimeout(overTimer);
      resetBoard();
      moves = []; winner = 0; winCells = null; peeked = false; pending = -1; hover = -1;
      renderOverlay();
      render(false);
      save();
      maybeAI();
    }

    function loadGame(list) {
      resetBoard();
      moves = []; winner = 0; winCells = null;
      for (var k = 0; k < list.length; k++) {
        var i = list[k];
        if (typeof i !== 'number' || i < 0 || i >= NN || board[i] || winner) break;
        make(i, k % 2 === 0 ? 1 : 2);
        moves.push(i);
        var line = winLineAt(i);
        if (line) { winner = k % 2 === 0 ? 1 : 2; winCells = line; }
      }
      if (!winner && moves.length === NN) winner = 3;
    }

    // ---------- 输入 ----------
    function pointAt(e) {
      var r = svg.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width * VB;
      var y = (e.clientY - r.top) / r.height * VB;
      var c = Math.min(14, Math.max(0, Math.round((x - M) / S)));
      var rr = Math.min(14, Math.max(0, Math.round((y - M) / S)));
      return { cell: rr * N + c, x: x, y: y };
    }
    function near(p, i) {
      if (i < 0) return false;
      var dx = p.x - px(i), dy = p.y - py(i);
      return dx * dx + dy * dy <= (S * 0.75) * (S * 0.75);
    }
    function setPending(i) {
      pending = (i >= 0 && !board[i]) ? i : -1;
      renderGhost();
    }

    var touch = null, mouseDown = -1;
    boardEl.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse') {
        if (e.button === 0) mouseDown = pointAt(e).cell;
        return;
      }
      if (!canHumanPlay()) return;
      e.preventDefault();
      try { boardEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      var p = pointAt(e);
      touch = { id: e.pointerId, confirm: near(p, pending) };
      if (!touch.confirm) setPending(p.cell);
    });
    boardEl.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'mouse') {
        if (!canHumanPlay()) return;
        var c = pointAt(e).cell;
        if (c !== hover) { hover = c; pending = -1; renderGhost(); }
        return;
      }
      if (!touch || e.pointerId !== touch.id) return;
      var p = pointAt(e);
      if (touch.confirm && !near(p, pending)) touch.confirm = false;
      if (!touch.confirm && p.cell !== pending) setPending(p.cell);
    });
    boardEl.addEventListener('pointerup', function (e) {
      if (e.pointerType === 'mouse') {
        var c = pointAt(e).cell;
        if (e.button === 0 && c === mouseDown) humanMove(c);
        mouseDown = -1;
        return;
      }
      if (!touch || e.pointerId !== touch.id) return;
      var confirm = touch.confirm;
      touch = null;
      if (confirm && pending >= 0) humanMove(pending);
      else if (pending >= 0) sound('select');
    });
    boardEl.addEventListener('pointercancel', function () { touch = null; });
    boardEl.addEventListener('pointerleave', function (e) {
      if (e.pointerType === 'mouse' && hover >= 0) { hover = -1; renderGhost(); }
    });
    boardEl.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    boardEl.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    document.addEventListener('keydown', function (e) {
      if (document.querySelector('dialog[open]')) return;
      if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); undo(); return; }
      if (document.activeElement !== boardEl || e.ctrlKey || e.metaKey || e.altKey) return;
      var dir = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
      if (dir) {
        e.preventDefault();
        var base = pending >= 0 ? pending : (moves.length ? moves[moves.length - 1] : CENTER);
        var r = Math.min(14, Math.max(0, ((base / N) | 0) + dir[0]));
        var c = Math.min(14, Math.max(0, base % N + dir[1]));
        pending = r * N + c;
        renderGhost();
      } else if ((e.key === 'Enter' || e.key === ' ') && pending >= 0) {
        e.preventDefault();
        humanMove(pending);
      }
    });

    undoBtn.addEventListener('click', undo);
    document.getElementById('new-game').addEventListener('click', function () { sound('start'); newGame(); });
    document.getElementById('again').addEventListener('click', function () { sound('start'); newGame(); });
    document.getElementById('peek').addEventListener('click', function () {
      sound('click'); peeked = true; renderOverlay(); save();
    });

    document.querySelectorAll('#settings .seg').forEach(function (seg) {
      seg.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        var key = seg.getAttribute('data-key'), v = b.getAttribute('data-v');
        var value = key === 'side' ? Number(v) : key === 'nums' ? v === '1' : v;
        if (settings[key] === value) return;
        sound('click');
        settings[key] = value;
        saveSettings();
        if (key === 'nums') render(false);
        else newGame();
      });
    });

    // ---------- 启动 ----------
    drawGrid();
    (function restore() {
      var s = store.get(K_SET, null);
      if (s && typeof s === 'object') {
        if (s.mode === 'ai' || s.mode === 'pvp') settings.mode = s.mode;
        if (DIFF_NAME[s.diff]) settings.diff = s.diff;
        if (s.side === 1 || s.side === 2) settings.side = s.side;
        settings.nums = !!s.nums;
      }
      var r = store.get(K_REC, null);
      if (r && typeof r === 'object') {
        ['easy', 'normal', 'hard'].forEach(function (k) {
          if (r[k]) ['w', 'l', 'd'].forEach(function (f) { record[k][f] = Math.max(0, r[k][f] | 0); });
        });
      }
      var g = store.get(K_GAME, null);
      if (g && Array.isArray(g.moves)) {
        loadGame(g.moves);
        peeked = !!g.peeked;
      }
      renderOverlay();
      render(false);
      saveRecord();
      maybeAI();
    })();

    // 测试用调试接口
    window.__gomoku = {
      state: function () {
        return { moves: moves.slice(), winner: winner, winCells: winCells && winCells.slice(), thinking: thinking, settings: JSON.parse(JSON.stringify(settings)), record: JSON.parse(JSON.stringify(record)), pending: pending };
      },
      play: humanMove,
      undo: undo,
      newGame: newGame,
      load: function (list) { cancelAI(); loadGame(list); peeked = false; renderOverlay(); render(false); save(); },
      set: function (k, v) { settings[k] = v; saveSettings(); newGame(); },
      think: function (diff, color) {
        var t0 = now();
        var m = chooseMove(diff, color || turnColor());
        return { move: m, ms: now() - t0, depth: lastDepth };
      },
      valueAt: function (i, p) { return VAL[p][i]; },
      shape: function (code) { return SH[code]; }
    };
  })();
  </script>
