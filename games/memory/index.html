<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>记忆翻牌 · 游戏来了</title>
  <meta name="description" content="在线玩记忆翻牌：翻开卡片，找出所有相同的图案。三种难度，步数越少星越多，自动保存进度。">
  <meta name="theme-color" content="#ffe6f1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg stroke='%232d2a4a' stroke-width='2.2' stroke-linejoin='round'%3E%3Crect x='2.5' y='6' width='15' height='20' rx='4' fill='%23ff5fa2' transform='rotate(-12 10 16)'/%3E%3Crect x='14.5' y='5' width='15' height='20' rx='4' fill='%23fff' transform='rotate(9 22 15)'/%3E%3Ccircle cx='21.8' cy='15' r='4.6' fill='%237cd3ff' stroke-width='1.8'/%3E%3C/g%3E%3Ccircle cx='9.6' cy='16' r='2.4' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/site.css">
  <script src="../../assets/site.js"></script>
  <style>
    :root {
      --stage-max: 520px;
      --flip: 300ms;
      /* 牌桌（托盘） */
      --tray: #ffc4dd;
      --tray-dot: rgba(255, 255, 255, 0.55);
      /* 牌背 */
      --back: #ff5fa2;
      /* 牌面上的粉彩圆底，每对牌同色 */
      --p0: #ffd3e6;
      --p1: #cdeeff;
      --p2: #fff0a8;
      --p3: #d3f5c8;
      --p4: #e4d9ff;
      --p5: #ffdcc2;
      --p6: #c4f1ea;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --tray: #4a2c56;
        --tray-dot: rgba(255, 95, 162, 0.16);
        --p0: #ffb3d3;
        --p1: #a9defc;
        --p2: #ffe27a;
        --p3: #b4e9a3;
        --p4: #cbbcff;
        --p5: #ffc49b;
        --p6: #9fe6da;
      }
    }
    :root[data-theme="dark"] {
      --tray: #4a2c56;
      --tray-dot: rgba(255, 95, 162, 0.16);
      --p0: #ffb3d3;
      --p1: #a9defc;
      --p2: #ffe27a;
      --p3: #b4e9a3;
      --p4: #cbbcff;
      --p5: #ffc49b;
      --p6: #9fe6da;
    }

    /* 连击：骑在牌桌上沿正中的小徽章 */
    .combo-pop {
      position: absolute;
      left: 50%;
      top: -12px;
      z-index: 6;
      display: inline-flex;
      align-items: center;
      height: 26px;
      padding: 0 11px;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      background: var(--theme-2);
      color: #2d2a4a;
      box-shadow: 0 2px 0 var(--ink);
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
      transform: translateX(-50%);
      animation: combo 900ms cubic-bezier(.2, 1.4, .4, 1) forwards;
    }
    @keyframes combo {
      0% { transform: translateX(-50%) scale(.4) rotate(-8deg); opacity: 0; }
      22% { transform: translateX(-50%) scale(1.08) rotate(-4deg); opacity: 1; }
      34% { transform: translateX(-50%) scale(1) rotate(-4deg); }
      75% { transform: translateX(-50%) translateY(0) rotate(-4deg); opacity: 1; }
      100% { transform: translateX(-50%) translateY(-8px) rotate(-4deg); opacity: 0; }
    }
    #pairs-box.bump .stat-value { animation: bump 260ms ease-out; }
    @keyframes bump {
      40% { transform: scale(1.18); color: var(--good); }
    }
    .stat-value { transform-origin: center; }

    /* 新游戏弹窗：进行中的难度显示“继续”小标 */
    .choice > span:nth-child(2) { flex: 1; min-width: 0; }
    .choice small { font-variant-numeric: tabular-nums; }
    .choice small { white-space: nowrap; }
    .choice .tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      vertical-align: 2px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--theme-2);
      color: #2d2a4a;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      transform: rotate(-3deg);
    }

    /* ---------- 牌桌：粗描边的粉色托盘 ---------- */
    .board {
      --cols: 4;
      --cw: 72px;
      --ch: 88px;
      --gap: 8px;
      --cb: 3px;            /* 卡片描边 */
      --lift: 4px;          /* 卡片实心投影 */
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--cols), var(--cw));
      grid-auto-rows: var(--ch);
      gap: var(--gap);
      width: max-content;
      margin: 0 auto;
      padding: var(--gap) var(--gap) calc(var(--gap) + var(--lift));
      border: var(--outline);
      border-radius: 22px;
      background-color: var(--tray);
      background-image: radial-gradient(var(--tray-dot) 2px, transparent 2.6px);
      background-size: 18px 18px;
      box-shadow: var(--shadow-lg);
      user-select: none;
      -webkit-user-select: none;
    }

    .card {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: calc(var(--cw) * 0.18);
      background: none;
      perspective: 700px;
      cursor: pointer;
      touch-action: manipulation;
      outline: none;
      transition: transform .12s ease;
    }
    .card:focus-visible { outline: 3px solid var(--theme-2); outline-offset: 3px; z-index: 3; }
    .card.up, .card.matched { cursor: default; }
    @media (hover: hover) {
      .card:not(.up):not(.matched):hover { transform: translateY(-3px) rotate(-1.5deg); }
    }
    .card:not(.up):not(.matched):active { transform: translateY(2px); }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      /* 带一点回弹的 3D 翻转 */
      transition: transform var(--flip) cubic-bezier(.3, 1.35, .5, 1);
    }
    .card.up .card-inner,
    .card.matched .card-inner { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: var(--cb) solid var(--ink);
      border-radius: calc(var(--cw) * 0.18);
      box-shadow: 0 var(--lift) 0 var(--ink);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    /* 牌背：粉色波点 + 白色缝线 + “?” 徽章 */
    .back {
      background-color: var(--back);
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.38) 22%, transparent 24%),
        radial-gradient(rgba(255, 255, 255, 0.38) 22%, transparent 24%);
      background-size: calc(var(--cw) * 0.3) calc(var(--cw) * 0.3);
      background-position: 0 0, calc(var(--cw) * 0.15) calc(var(--cw) * 0.15);
      box-shadow:
        0 var(--lift) 0 var(--ink),
        inset 0 -5px 0 rgba(0, 0, 0, 0.12),
        inset 0 4px 0 rgba(255, 255, 255, 0.4);
    }
    .back::before {
      content: "";
      position: absolute;
      inset: calc(var(--cw) * 0.07);
      border: 2px dashed rgba(255, 255, 255, 0.75);
      border-radius: calc(var(--cw) * 0.11);
    }
    .mark {
      position: relative;
      display: grid;
      place-items: center;
      width: calc(var(--cw) * 0.46);
      height: calc(var(--cw) * 0.46);
      border: max(2px, calc(var(--cb) - 0.5px)) solid var(--ink);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 0 var(--ink), inset 0 -3px 0 rgba(0, 0, 0, 0.08);
      color: var(--back);
      font-family: var(--font);
      font-weight: 700;
      font-size: calc(var(--cw) * 0.32);
      line-height: 1;
      transform: rotate(-10deg);
    }
    .mark::after { content: "?"; margin-top: calc(var(--cw) * -0.02); }

    /* 牌面：白卡 + 粉彩圆底 + 大号 emoji */
    .front {
      transform: rotateY(180deg);
      background: var(--surface);
      transition: border-color .2s ease, background-color .3s ease;
    }
    .pic {
      display: grid;
      place-items: center;
      width: calc(var(--cw) * 0.8);
      height: calc(var(--cw) * 0.8);
      border-radius: 50%;
      background: var(--pc, var(--p0));
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.08);
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", var(--font);
      font-size: var(--ef, 40px);
      line-height: 1;
      transition: opacity .3s ease, transform .3s ease;
    }
    .pc0 { --pc: var(--p0); } .pc1 { --pc: var(--p1); } .pc2 { --pc: var(--p2); }
    .pc3 { --pc: var(--p3); } .pc4 { --pc: var(--p4); } .pc5 { --pc: var(--p5); }
    .pc6 { --pc: var(--p6); }

    /* ✓ 徽章（配对后出现） */
    .ok {
      position: absolute;
      top: calc(var(--cw) * 0.04);
      right: calc(var(--cw) * 0.04);
      display: grid;
      place-items: center;
      width: max(16px, calc(var(--cw) * 0.27));
      height: max(16px, calc(var(--cw) * 0.27));
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--good);
      color: #fff;
      font-family: var(--font);
      font-weight: 700;
      font-size: max(10px, calc(var(--cw) * 0.16));
      line-height: 1;
      transform: scale(0);
      transition: transform .32s cubic-bezier(.2, 1.6, .4, 1);
    }

    /* 配对成功：绿色描边 + 星光 + 轻轻跳动，之后变淡并打勾 */
    .card.matched .front { border-color: var(--good); }
    .card.matched.done .front { background: var(--surface-2); transition-delay: .2s; }
    .card.matched.done .pic { opacity: 0.6; transform: scale(.92); transition-delay: .2s; }
    .card.matched.done .ok { transform: scale(1); transition-delay: .2s; }
    .card.just { z-index: 2; animation: bob 440ms ease-in-out calc(var(--flip) - 60ms); }
    @keyframes bob {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-7px) scale(1.08) rotate(-3deg); }
      60% { transform: translateY(0) scale(.98) rotate(2deg); }
      80% { transform: translateY(-3px) scale(1.02); }
    }

    .burst {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      z-index: 4;
      pointer-events: none;
    }
    .burst::before {
      content: "";
      position: absolute;
      left: calc(var(--cw) * -0.5);
      top: calc(var(--cw) * -0.5);
      width: var(--cw);
      height: var(--cw);
      border: 3px solid var(--good);
      border-radius: 50%;
      opacity: 0;
      animation: ring 420ms ease-out calc(var(--flip) - 60ms);
    }
    .burst i {
      position: absolute;
      left: -6px;
      top: -6px;
      width: 14px;
      height: 14px;
      margin: -1px;
      background: #ffd23f;
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      opacity: 0;
      animation: spark 500ms cubic-bezier(.2, .8, .3, 1) calc(var(--flip) - 60ms);
    }
    .burst i:nth-child(3n + 2) { background: var(--theme); }
    .burst i:nth-child(3n) { background: var(--theme-2); }
    .burst i:nth-child(1) { --a: 0deg; }
    .burst i:nth-child(2) { --a: 45deg; }
    .burst i:nth-child(3) { --a: 90deg; }
    .burst i:nth-child(4) { --a: 135deg; }
    .burst i:nth-child(5) { --a: 180deg; }
    .burst i:nth-child(6) { --a: 225deg; }
    .burst i:nth-child(7) { --a: 270deg; }
    .burst i:nth-child(8) { --a: 315deg; }
    @keyframes spark {
      0% { opacity: 1; transform: rotate(var(--a)) translateY(0) scale(.3); }
      70% { opacity: 1; }
      100% { opacity: 0; transform: rotate(var(--a)) translateY(calc(var(--ch) * -0.66)) scale(1.1) rotate(90deg); }
    }
    @keyframes ring {
      0% { opacity: .9; transform: scale(.3); }
      100% { opacity: 0; transform: scale(1.5); }
    }

    /* 配对失败：红色描边 + 摇晃 */
    .card.miss .front { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
    .card.miss { animation: wobble 320ms ease calc(var(--flip) - 40ms); }
    @keyframes wobble {
      0%, 100% { transform: none; }
      20% { transform: translateX(-5px) rotate(-5deg); }
      40% { transform: translateX(5px) rotate(4deg); }
      60% { transform: translateX(-3px) rotate(-3deg); }
      80% { transform: translateX(2px) rotate(1deg); }
    }

    .board.instant .card-inner,
    .board.instant .front,
    .board.instant .pic,
    .board.instant .ok { transition: none; }

    /* ---------- 胜利卡片 ---------- */
    .stars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      margin: 0;
      min-height: 64px;
    }
    .star { display: block; width: 50px; height: 50px; animation: star-pop 360ms cubic-bezier(.2, 1.6, .4, 1) calc(380ms + var(--d) * 130ms) backwards; }
    .star:nth-child(2) { width: 64px; height: 64px; margin-top: -14px; }
    .star svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .star path { fill: var(--surface-3); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .star.on path { fill: #ffd23f; }
    .star .shine { fill: none; stroke: rgba(255, 255, 255, 0.85); stroke-width: 1.8; stroke-linecap: round; }
    .star:not(.on) .shine { display: none; }
    @keyframes star-pop {
      0% { transform: scale(0) rotate(-40deg); opacity: 0; }
      100% { transform: none; opacity: 1; }
    }
    .overlay .rec {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 8px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--good);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      vertical-align: 1px;
      transform: rotate(-3deg);
    }
    #win-text { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    #win .overlay-card { gap: 10px; padding-top: 20px; }
    #win .row { margin-top: 4px; }

    @media (max-width: 340px) {
      .stats { gap: 6px; }
      .stat { padding-left: 4px; padding-right: 4px; }
      .stat-value { font-size: 16px; }
      .stats .btns .btn { padding: 0 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      :root { --flip: 0ms; }
      .card-inner, .front, .pic, .ok { transition: none; }
      .burst { display: none; }
    }
  </style>
</head>
<body class="game-page" data-game="memory">
  <header class="gbar">
    <a class="icon-btn" href="../../" aria-label="返回游戏大厅" title="返回游戏大厅">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="gbar-title">记忆翻牌</h1>
    <div class="gbar-actions">
      <button class="icon-btn sound-toggle" type="button" aria-label="关闭声音">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
      </button>
      <button class="icon-btn" type="button" data-open="help" aria-label="玩法说明" title="玩法说明">?</button>
    </div>
  </header>

  <main class="gmain">
    <div class="stats">
      <div class="stat"><span class="stat-label">步数</span><span class="stat-value" id="moves">0</span></div>
      <div class="stat"><span class="stat-label">时间</span><span class="stat-value" id="time">00:00</span></div>
      <div class="stat" id="pairs-box"><span class="stat-label">配对</span><span class="stat-value" id="pairs">0/8</span></div>
      <div class="btns">
        <button class="btn primary" type="button" id="new-game">新游戏</button>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="board" id="board" role="grid" aria-label="记忆翻牌牌桌">
        <div class="overlay" id="win" hidden>
          <div class="overlay-card">
            <h2>全部配对！</h2>
            <div class="stars" id="win-stars" role="img"></div>
            <p id="win-text"></p>
            <div class="row">
              <button class="btn primary" type="button" data-action="new">再来一局</button>
              <button class="btn" type="button" data-action="diff">换难度</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <span class="sr-only" id="live" aria-live="polite"></span>
  </main>

  <dialog class="sheet" id="newgame">
    <div class="sheet-head">
      <h2>新游戏</h2>
      <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <p class="sheet-label">难度</p>
      <div class="choices" id="diff-choices">
        <button class="choice" type="button" data-diff="easy"><span class="choice-icon">🐣</span><span><b>简单 4×4</b><small></small></span></button>
        <button class="choice" type="button" data-diff="normal"><span class="choice-icon">🐰</span><span><b>普通 4×5</b><small></small></span></button>
        <button class="choice" type="button" data-diff="hard"><span class="choice-icon">🦁</span><span><b>困难 6×6</b><small></small></span></button>
      </div>
    </div>
  </dialog>

  <dialog class="sheet" id="help">
    <div class="sheet-head">
      <h2>怎么玩</h2>
      <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <ul class="tips">
        <li><b>👆</b><span>每次翻两张，不同会翻回去。</span></li>
        <li><b>🎯</b><span>图案相同就<strong>配对成功</strong>。</span></li>
        <li><b>⭐</b><span>步数越少，星星越多。</span></li>
        <li><b>⌨️</b><span>方向键选牌，<kbd>Enter</kbd> 翻开。</span></li>
      </ul>
      <p style="margin:18px 0 0"><button class="btn block theme-toggle" type="button">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        切换深色 / 浅色
      </button></p>
    </div>
  </dialog>

  <script>
  (function () {
    'use strict';

    var DIFFS = {
      easy:   { cols: 4, rows: 4, name: '简单' },
      normal: { cols: 4, rows: 5, name: '普通' },
      hard:   { cols: 6, rows: 6, name: '困难' }
    };
    var ORDER = ['easy', 'normal', 'hard'];
    var POOL = [
      ['🍎', '苹果'], ['🍊', '橘子'], ['🍋', '柠檬'], ['🍉', '西瓜'], ['🍇', '葡萄'], ['🍓', '草莓'],
      ['🍑', '桃子'], ['🍒', '樱桃'], ['🥝', '猕猴桃'], ['🍍', '菠萝'], ['🥥', '椰子'], ['🥕', '胡萝卜'],
      ['🌽', '玉米'], ['🍄', '蘑菇'], ['🐶', '小狗'], ['🐱', '小猫'], ['🐼', '熊猫'], ['🦊', '狐狸'],
      ['🐸', '青蛙'], ['🐧', '企鹅'], ['🦁', '狮子'], ['🐯', '老虎'], ['🐰', '兔子'], ['🐨', '考拉'],
      ['🐷', '小猪'], ['🐵', '猴子'], ['🐙', '章鱼'], ['🦄', '独角兽'], ['🐝', '蜜蜂'], ['🦋', '蝴蝶'],
      ['🐢', '乌龟'], ['🐳', '鲸鱼']
    ];
    var PASTELS = 7;     // 牌面圆底颜色数（.pc0 ~ .pc6），同一对牌颜色相同
    var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var FLIP_MS = REDUCED ? 0 : 300;
    var MISS_MS = 800;   // 不匹配时停留多久再翻回
    var KEY_DIFF = 'gzly.memory.diff';
    var KEY_BEST = 'gzly.memory.best';
    function stateKey(d) { return 'gzly.memory.state.' + d; }

    var store = window.Site.store;
    var sound = window.Site.sound;

    var boardEl = document.getElementById('board');
    var stageEl = document.getElementById('stage');
    var winEl = document.getElementById('win');
    var movesEl = document.getElementById('moves');
    var timeEl = document.getElementById('time');
    var pairsEl = document.getElementById('pairs');
    var pairsBox = document.getElementById('pairs-box');
    var liveEl = document.getElementById('live');
    var choiceBtns = document.querySelectorAll('#diff-choices .choice');

    var diff = DIFFS[store.get(KEY_DIFF, 'easy')] ? store.get(KEY_DIFF, 'easy') : 'easy';
    var bests = store.get(KEY_BEST, null);
    if (!bests || typeof bests !== 'object') bests = {};

    // 局面
    var deck = [];       // 每张牌对应 POOL 下标
    var matched = [];
    var up = [];         // 翻开但未配对的牌
    var moves = 0;
    var elapsed = 0;     // 毫秒
    var running = false;
    var won = false;
    var combo = 0;
    var rec = null;      // 本局是否破纪录 {moves, time}
    var pending = null;  // 不匹配后待翻回的两张
    var cards = [];
    var lastTick = performance.now();
    var shownSec = -1;

    window.Site.played('memory');

    function pairsTotal() { return deck.length / 2; }
    function pairsDone() {
      var n = 0;
      for (var i = 0; i < matched.length; i++) if (matched[i]) n++;
      return n / 2;
    }

    function shuffle(a) {
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    // ---------- 渲染 ----------
    function buildBoard() {
      var cfg = DIFFS[diff];
      cards.forEach(function (c) { c.remove(); });
      cards = [];
      boardEl.style.setProperty('--cols', cfg.cols);
      boardEl.classList.add('instant');
      var frag = document.createDocumentFragment();
      for (var i = 0; i < deck.length; i++) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'card';
        b.setAttribute('data-i', i);
        b.setAttribute('role', 'gridcell');
        b.tabIndex = i === 0 ? 0 : -1;
        b.innerHTML = '<span class="card-inner" aria-hidden="true">' +
          '<span class="face back"><span class="mark"></span></span>' +
          '<span class="face front"><span class="pic pc' + (deck[i] % PASTELS) + '">' + POOL[deck[i]][0] + '</span>' +
          '<span class="ok">✓</span></span></span>';
        frag.appendChild(b);
        cards.push(b);
      }
      boardEl.insertBefore(frag, winEl);
      for (var k = 0; k < deck.length; k++) paintCard(k);
      layout();
      void boardEl.offsetWidth;
      requestAnimationFrame(function () { boardEl.classList.remove('instant'); });
    }

    function paintCard(i) {
      var el = cards[i];
      var cfg = DIFFS[diff];
      var isUp = up.indexOf(i) !== -1;
      el.classList.toggle('up', isUp);
      el.classList.toggle('matched', !!matched[i]);
      el.classList.toggle('done', !!matched[i]);
      var pos = '第' + (Math.floor(i / cfg.cols) + 1) + '行第' + (i % cfg.cols + 1) + '张';
      var name = POOL[deck[i]][1];
      el.setAttribute('aria-label', matched[i] ? pos + '，' + name + '，已配对' : isUp ? pos + '，' + name : pos + '，未翻开');
    }

    function retrigger(el, cls) {
      el.classList.remove(cls);
      void el.offsetWidth;
      el.classList.add(cls);
    }

    function updateStats() {
      movesEl.textContent = moves;
      pairsEl.textContent = pairsDone() + '/' + pairsTotal();
      renderTime(true);
    }

    function renderTime(force) {
      var s = Math.floor(elapsed / 1000);
      if (s === shownSec && !force) return;
      shownSec = s;
      timeEl.textContent = window.Site.formatTime(s);
    }

    // 新游戏弹窗：当前难度高亮，副标题显示各难度最佳成绩，未完成的其他难度标“继续”
    function updateChoices() {
      for (var i = 0; i < choiceBtns.length; i++) {
        var btn = choiceBtns[i];
        var d = btn.getAttribute('data-diff');
        var cfg = DIFFS[d];
        var b = bests[d];
        var parts = [];
        if (b && b.moves) parts.push('最少 ' + b.moves + ' 步');
        if (b && typeof b.time === 'number') parts.push('最快 ' + window.Site.formatTime(b.time));
        btn.querySelector('small').textContent = parts.length ? parts.join(' · ') : cfg.cols * cfg.rows / 2 + ' 对牌';
        btn.setAttribute('aria-pressed', d === diff ? 'true' : 'false');
        var old = btn.querySelector('.tag');
        if (old) old.remove();
        if (d !== diff) {
          var sv = store.get(stateKey(d), null);
          if (isValid(sv, d) && !sv.won && (sv.moves > 0 || sv.up.length > 0)) {
            var tag = document.createElement('span');
            tag.className = 'tag';
            tag.textContent = '继续';
            btn.querySelector('b').appendChild(tag);
          }
        }
      }
    }

    function openNewGame() {
      updateChoices();
      window.Site.openDialog('newgame');
    }

    function updateHomeStat() {
      for (var i = ORDER.length - 1; i >= 0; i--) {
        var b = bests[ORDER[i]];
        if (b && b.moves) {
          window.Site.setHomeStat('memory', DIFFS[ORDER[i]].name + ' ' + b.moves + ' 步');
          return;
        }
      }
    }

    function starCount(m, n) {
      if (m <= Math.ceil(n * 1.5) + 1) return 3;
      if (m <= Math.ceil(n * 2.25)) return 2;
      return 1;
    }

    function showWin() {
      winEl.hidden = !won;
      if (!won) return;
      var n = pairsTotal();
      var s = starCount(moves, n);
      var stars = '';
      for (var i = 0; i < 3; i++) {
        stars += '<span class="star' + (i < s ? ' on' : '') + '" style="--d:' + i + '"><svg viewBox="0 0 24 24">' +
          '<path d="M12 2.2l2.95 6.1 6.7.95-4.85 4.7 1.15 6.65L12 17.45l-5.95 3.15 1.15-6.65-4.85-4.7 6.7-.95z"/>' +
          '<path class="shine" d="M8.3 9.6l1.6-.25"/></svg></span>';
      }
      var starsEl = document.getElementById('win-stars');
      starsEl.innerHTML = stars;
      starsEl.setAttribute('aria-label', s + ' 颗星');
      var sec = Math.floor(elapsed / 1000);
      var textEl = document.getElementById('win-text');
      textEl.textContent = moves + ' 步 · ' + window.Site.formatTime(sec);
      if (rec && (rec.moves || rec.time)) {
        var tag = document.createElement('span');
        tag.className = 'rec';
        tag.textContent = '新纪录';
        textEl.appendChild(tag);
      }
    }

    // 根据可用空间计算卡片尺寸，保证整页不滚动
    function layout() {
      var cfg = DIFFS[diff];
      var bodyStyle = getComputedStyle(document.body);
      var bottom = parseFloat(bodyStyle.paddingBottom) || 16;
      boardEl.style.setProperty('--cols', cfg.cols);
      var top = stageEl.getBoundingClientRect().top + window.scrollY;
      var availW = stageEl.clientWidth;
      var availH = Math.max(200, window.innerHeight - top - bottom);
      var ratio = 1.16;    // 最矮的牌（高/宽）
      var tall = 1.4;      // 有富余高度时最高拉到扑克牌比例
      var gap = cfg.cols >= 6 ? 6 : 8;
      var cw = 0, h1 = 0;
      var BORDER = 3, LIFT = 4, SHADOW = 6; // 托盘描边、卡片投影、托盘投影
      for (var pass = 0; pass < 2; pass++) {
        var pad = 2 * (gap + BORDER);
        var w1 = (availW - pad - (cfg.cols - 1) * gap) / cfg.cols;
        h1 = (availH - pad - LIFT - SHADOW - (cfg.rows - 1) * gap) / cfg.rows;
        cw = Math.floor(Math.max(28, Math.min(w1, h1 / ratio, 124)));
        if (cw >= 88 && gap < 10) gap = 10;
        else break;
      }
      var ch = Math.max(Math.floor(cw * ratio), Math.floor(Math.min(cw * tall, h1)));
      boardEl.style.setProperty('--cw', cw + 'px');
      boardEl.style.setProperty('--ch', ch + 'px');
      boardEl.style.setProperty('--gap', gap + 'px');
      boardEl.style.setProperty('--ef', Math.round(cw * 0.5) + 'px');
      boardEl.style.setProperty('--cb', cw < 56 ? '2.5px' : '3px');
      boardEl.style.setProperty('--lift', cw < 56 ? '3px' : '4px');
    }

    function announce(text) { liveEl.textContent = text; }

    // ---------- 存档 ----------
    function save() {
      // 存档时不保留“待翻回”的两张
      store.set(stateKey(diff), {
        deck: deck,
        matched: matched,
        up: up.length === 1 ? up.slice() : [],
        moves: moves,
        elapsed: Math.round(elapsed),
        won: won,
        combo: up.length === 2 ? 0 : combo,
        rec: rec
      });
    }

    function isValid(s, d) {
      var n = DIFFS[d].cols * DIFFS[d].rows;
      if (!s || !Array.isArray(s.deck) || s.deck.length !== n) return false;
      if (!Array.isArray(s.matched) || s.matched.length !== n) return false;
      var count = {};
      for (var i = 0; i < n; i++) {
        var v = s.deck[i];
        if (typeof v !== 'number' || v < 0 || v >= POOL.length || v % 1) return false;
        count[v] = (count[v] || 0) + 1;
      }
      for (var k in count) if (count[k] !== 2) return false;
      for (var j = 0; j < n; j++) {
        if (s.matched[j]) {
          var other = s.deck.indexOf(s.deck[j]) === j ? s.deck.lastIndexOf(s.deck[j]) : s.deck.indexOf(s.deck[j]);
          if (!s.matched[other]) return false;
        }
      }
      if (!Array.isArray(s.up) || s.up.length > 1) return false;
      if (s.up.length && (typeof s.up[0] !== 'number' || s.up[0] < 0 || s.up[0] >= n || s.matched[s.up[0]])) return false;
      if (typeof s.moves !== 'number' || s.moves < 0 || typeof s.elapsed !== 'number' || s.elapsed < 0) return false;
      return true;
    }

    function load(s) {
      deck = s.deck.slice();
      matched = s.matched.map(Boolean);
      up = s.up.slice();
      moves = s.moves;
      elapsed = s.elapsed;
      won = !!s.won && matched.every(Boolean);
      combo = s.combo || 0;
      rec = s.rec || null;
      running = false; // 下次翻牌时继续计时
    }

    // ---------- 规则 ----------
    function newGame() {
      clearPending(false);
      var cfg = DIFFS[diff];
      var n = cfg.cols * cfg.rows / 2;
      var picks = shuffle(POOL.map(function (_, i) { return i; })).slice(0, n);
      deck = shuffle(picks.concat(picks));
      matched = deck.map(function () { return false; });
      up = [];
      moves = 0;
      elapsed = 0;
      running = false;
      won = false;
      combo = 0;
      rec = null;
      buildBoard();
      updateStats();
      showWin();
      save();
    }

    function clearPending(repaint) {
      if (!pending) return;
      var p = pending;
      pending = null;
      clearTimeout(p.timer);
      up = up.filter(function (i) { return p.cards.indexOf(i) === -1; });
      p.cards.forEach(function (i) {
        cards[i] && cards[i].classList.remove('miss');
        if (repaint && cards[i]) paintCard(i);
      });
    }

    function flip(i) {
      if (won || i < 0 || i >= deck.length) return;
      if (pending) clearPending(true); // 等待翻回时又点了牌：立刻翻回，再处理这次点击
      if (matched[i] || up.indexOf(i) !== -1) return;

      if (!running) { running = true; lastTick = performance.now(); }
      up.push(i);
      cards[i].classList.remove('just', 'miss');
      paintCard(i);
      sound('flip');

      if (up.length === 2) {
        var a = up[0];
        var b = up[1];
        moves++;
        if (deck[a] === deck[b]) {
          matched[a] = matched[b] = true;
          up = [];
          combo++;
          setTimeout(function () { retrigger(pairsBox, 'bump'); }, Math.min(FLIP_MS, 200));
          [a, b].forEach(function (k) {
            paintCard(k);
            cards[k].classList.remove('done');
            retrigger(cards[k], 'just');
            sparkle(cards[k]);
            setTimeout(function () { if (matched[k]) cards[k].classList.add('done'); }, FLIP_MS + 200);
          });
          setTimeout(function () { sound('match'); }, Math.min(FLIP_MS, 200));
          if (combo >= 2) showCombo();
          announce(POOL[deck[a]][1] + '，配对成功');
          if (pairsDone() === pairsTotal()) finish();
        } else {
          combo = 0;
          cards[a].classList.remove('just');
          retrigger(cards[a], 'miss');
          retrigger(cards[b], 'miss');
          setTimeout(function () { sound('error'); }, Math.min(FLIP_MS, 250));
          pending = { cards: [a, b], timer: setTimeout(function () { clearPending(true); }, MISS_MS + FLIP_MS) };
          announce('不一样');
        }
      }
      updateStats();
      save();
    }

    // 配对成功的星光
    function sparkle(card) {
      if (REDUCED) return;
      var old = card.querySelector('.burst');
      if (old) old.remove();
      var el = document.createElement('span');
      el.className = 'burst';
      el.setAttribute('aria-hidden', 'true');
      el.innerHTML = '<i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>';
      card.appendChild(el);
      setTimeout(function () { el.remove(); }, FLIP_MS + 520);
    }

    function showCombo() {
      if (REDUCED) return;
      var old = stageEl.querySelector('.combo-pop');
      if (old) old.remove();
      var el = document.createElement('span');
      el.className = 'combo-pop';
      el.setAttribute('aria-hidden', 'true');
      el.textContent = '连击 ×' + combo;
      stageEl.appendChild(el);
      setTimeout(function () { el.remove(); }, 950);
    }

    function finish() {
      tick();
      running = false;
      won = true;
      var sec = Math.floor(elapsed / 1000);
      var b = bests[diff] || {};
      rec = { moves: !b.moves || moves < b.moves, time: !b.time && b.time !== 0 || sec < b.time };
      if (rec.moves) b.moves = moves;
      if (rec.time) b.time = sec;
      bests[diff] = b;
      store.set(KEY_BEST, bests);
      updateHomeStat();
      announce('全部配对！' + moves + ' 步');
      setTimeout(function () {
        if (!won) return;
        sound('win');
        showWin();
        var btn = winEl.querySelector('[data-action="new"]');
        if (btn) btn.focus({ preventScroll: true });
      }, FLIP_MS + 380);
    }

    // 从新游戏弹窗选难度：选当前难度 = 重新开一局；选其他难度 = 继续它的存档（没有则新开）
    function pickDiff(d) {
      if (!DIFFS[d]) return;
      window.Site.closeDialog('newgame');
      sound('start');
      if (d === diff) newGame();
      else setDiff(d);
      announce(DIFFS[diff].name + '，' + (moves ? '继续上一局' : '新游戏'));
    }

    function setDiff(d) {
      if (!DIFFS[d] || d === diff) return;
      if (pending) clearPending(true);
      tick();
      save();
      diff = d;
      store.set(KEY_DIFF, diff);
      var s = store.get(stateKey(diff), null);
      if (isValid(s, diff) && !s.won) {
        load(s);
        buildBoard();
        updateStats();
        showWin();
      } else {
        newGame();
      }
    }

    // ---------- 计时 ----------
    function tick() {
      var now = performance.now();
      // 弹窗打开时暂停计时
      if (running && !document.hidden && !document.querySelector('dialog[open]')) {
        elapsed += now - lastTick;
        renderTime(false);
      }
      lastTick = now;
    }
    setInterval(tick, 250);

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        tick();
        save();
      } else {
        lastTick = performance.now();
      }
    });
    window.addEventListener('pagehide', function () { tick(); save(); });

    // ---------- 操作 ----------
    boardEl.addEventListener('click', function (e) {
      var action = e.target.closest('[data-action]');
      if (action) {
        var act = action.getAttribute('data-action');
        if (act === 'new') { sound('start'); newGame(); }
        else if (act === 'diff') openNewGame();
        return;
      }
      var card = e.target.closest('.card');
      if (!card) return;
      flip(+card.getAttribute('data-i'));
    });

    // 方向键在牌之间移动焦点
    boardEl.addEventListener('keydown', function (e) {
      var card = e.target.closest && e.target.closest('.card');
      if (!card) return;
      var cols = DIFFS[diff].cols;
      var i = +card.getAttribute('data-i');
      var j = i;
      if (e.key === 'ArrowLeft') j = i - 1;
      else if (e.key === 'ArrowRight') j = i + 1;
      else if (e.key === 'ArrowUp') j = i - cols;
      else if (e.key === 'ArrowDown') j = i + cols;
      else if (e.key === 'Home') j = 0;
      else if (e.key === 'End') j = cards.length - 1;
      else return;
      e.preventDefault();
      if (j < 0 || j >= cards.length) return;
      card.tabIndex = -1;
      cards[j].tabIndex = 0;
      cards[j].focus();
    });
    boardEl.addEventListener('focusin', function (e) {
      var card = e.target.closest && e.target.closest('.card');
      if (!card) return;
      cards.forEach(function (c) { c.tabIndex = c === card ? 0 : -1; });
    });

    document.getElementById('new-game').addEventListener('click', openNewGame);
    document.getElementById('diff-choices').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-diff]');
      if (b) pickDiff(b.getAttribute('data-diff'));
    });

    var resizeRaf = 0;
    window.addEventListener('resize', function () {
      cancelAnimationFrame(resizeRaf);
      resizeRaf = requestAnimationFrame(layout);
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

    // ---------- 启动 ----------
    updateHomeStat();
    var saved = store.get(stateKey(diff), null);
    if (isValid(saved, diff)) {
      load(saved);
      buildBoard();
      updateStats();
      showWin();
    } else {
      newGame();
    }
  })();
  </script>
</body>
</html>
