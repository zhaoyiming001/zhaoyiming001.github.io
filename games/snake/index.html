<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>贪吃蛇 · 游戏来了</title>
  <meta name="description" content="在线玩贪吃蛇：吃苹果变长，别撞墙也别咬到自己。支持键盘、手机滑动和方向键盘，三档速度，可开启穿墙模式。">
  <meta name="theme-color" content="#f7f2ea">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='%233f9c7f'/%3E%3Cpath d='M7 23h9v-9h8' fill='none' stroke='white' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='23.5' cy='23' r='3.5' fill='%23e0493a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/site.css">
  <script src="../../assets/site.js"></script>
  <style>
    :root {
      --reserve: 360px;
      --stage-max: 480px;
      --board-a: #ede4d5;
      --board-b: #e5dac8;
      --snake: #3f9c7f;
      --snake-dark: #2c7660;
      --apple: #e0493a;
      --leaf: #57a85a;
      --stem: #7a5233;
      --pupil: #2a211b;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --board-a: #2d2621;
        --board-b: #352c26;
        --snake: #5cc2a2;
        --snake-dark: #367f69;
        --apple: #ff6b5c;
        --leaf: #6cbf6f;
        --stem: #b08562;
        --pupil: #1b1714;
      }
    }
    :root[data-theme="dark"] {
      --board-a: #2d2621;
      --board-b: #352c26;
      --snake: #5cc2a2;
      --snake-dark: #367f69;
      --apple: #ff6b5c;
      --leaf: #6cbf6f;
      --stem: #b08562;
      --pupil: #1b1714;
    }
    /* 棋盘边长随屏幕高度收缩，保证手机一屏放下 */
    @supports (height: 100dvh) {
      :root {
        --stage-max: clamp(280px, calc(100dvh - var(--reserve) - env(safe-area-inset-top) - env(safe-area-inset-bottom)), 480px);
      }
    }
    @media (hover: hover) and (pointer: fine) {
      :root { --reserve: 230px; }
      .dpad { display: none !important; }
    }

    body.game-page { touch-action: manipulation; }

    .stats .btns .btn { width: 56px; padding: 0; }
    .stats .btns .btn svg { display: block; width: 22px; height: 22px; }
    #pause .play { display: none; }
    #pause.paused .play { display: block; }
    #pause.paused .pz { display: none; }

    .gcontrols { flex-wrap: nowrap; }
    .wrap-btn { height: 40px; border-radius: 12px; gap: 6px; padding: 0 12px; color: var(--text-dim); }
    .wrap-btn svg { width: 18px; height: 18px; }
    .wrap-btn[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }

    .stage {
      border-radius: 14px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #board {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 14px;
      background: var(--board-a);
      box-shadow: var(--shadow);
    }
    .overlay.ready { background: color-mix(in srgb, var(--bg) 35%, transparent); -webkit-backdrop-filter: none; backdrop-filter: none; animation: none; }
    .overlay.over { animation-delay: 450ms; }
    .overlay .btn.big { height: 52px; padding: 0 30px; font-size: 18px; border-radius: 14px; box-shadow: var(--shadow); }
    .overlay .new-best { color: var(--accent); }

    /* 方向键盘 */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 76px);
      grid-template-rows: repeat(3, 44px);
      gap: 6px;
      justify-content: center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .dpad button {
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 3px 0 var(--line);
      cursor: pointer;
      touch-action: none;
      transition: transform 80ms ease, box-shadow 80ms ease, background-color 80ms ease;
    }
    .dpad button svg { width: 24px; height: 24px; pointer-events: none; }
    .dpad button.on { transform: translateY(3px); box-shadow: 0 0 0 var(--line); background: var(--surface-2); color: var(--accent); }
    .dpad .up { grid-area: 1 / 2; }
    .dpad .left { grid-area: 2 / 1; }
    .dpad .right { grid-area: 2 / 3; }
    .dpad .down { grid-area: 3 / 2; }
  </style>
</head>
<body class="game-page" data-game="snake">
  <header class="gbar">
    <a class="icon-btn" href="../../" aria-label="返回游戏大厅" title="返回游戏大厅">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="gbar-title">贪吃蛇</h1>
    <div class="gbar-actions">
      <button class="icon-btn sound-toggle" type="button" aria-label="关闭声音">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
      </button>
      <button class="icon-btn" type="button" data-open="help" aria-label="玩法说明" title="玩法说明">?</button>
    </div>
  </header>

  <main class="gmain">
    <div class="stats">
      <div class="stat"><span class="stat-label">分数</span><span class="stat-value" id="score">0</span></div>
      <div class="stat"><span class="stat-label">最高</span><span class="stat-value" id="best">0</span></div>
      <div class="btns">
        <button class="btn paused" type="button" id="pause" aria-label="开始" title="暂停 (空格)">
          <svg class="pz" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
          <svg class="play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>
        </button>
      </div>
    </div>

    <div class="gcontrols">
      <div class="seg" id="speed" role="group" aria-label="速度">
        <button type="button" data-speed="slow" aria-pressed="false">慢</button>
        <button type="button" data-speed="mid" aria-pressed="true">中</button>
        <button type="button" data-speed="fast" aria-pressed="false">快</button>
      </div>
      <button class="btn wrap-btn" type="button" id="wrap" aria-pressed="false" title="穿墙模式：从一边出去，从另一边回来">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M17 8l4 4-4 4M3 5v14M21 5v2M21 17v2"/></svg>
        穿墙
      </button>
    </div>

    <div class="stage" id="stage">
      <canvas id="board" aria-label="贪吃蛇棋盘，使用方向键、滑动或下方方向键操作"></canvas>

      <div class="overlay ready" id="ov-ready">
        <div class="row"><button class="btn primary big" type="button" data-action="start">开始</button></div>
      </div>

      <div class="overlay" id="ov-pause" hidden>
        <h2>暂停</h2>
        <div class="row"><button class="btn primary big" type="button" data-action="resume">继续</button></div>
      </div>

      <div class="overlay over" id="ov-over" hidden>
        <h2 id="over-title">游戏结束</h2>
        <p id="over-text"></p>
        <div class="row"><button class="btn primary big" type="button" data-action="restart">再来一局</button></div>
      </div>
    </div>

    <div class="dpad" id="dpad" aria-label="方向键">
      <button type="button" class="up" data-dir="up" aria-label="上"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
      <button type="button" class="left" data-dir="left" aria-label="左"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button type="button" class="right" data-dir="right" aria-label="右"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button type="button" class="down" data-dir="down" aria-label="下"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
  </main>

  <dialog class="sheet" id="help">
    <div class="sheet-head">
      <h2>怎么玩</h2>
      <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <ul class="tips">
        <li><b>🎮</b><span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>WASD</kbd>，或滑动转向。</span></li>
        <li><b>🍎</b><span>吃苹果变长，越长越快。</span></li>
        <li><b>💥</b><span>撞墙或咬到自己就输了。</span></li>
        <li><b>⏸</b><span><kbd>空格</kbd> 或 <kbd>P</kbd> 暂停。</span></li>
      </ul>
      <p style="margin:18px 0 0"><button class="btn block theme-toggle" type="button">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        切换深色 / 浅色
      </button></p>
    </div>
  </dialog>

  <script>
  (function () {
    'use strict';

    var N = 17;
    var SPEEDS = { slow: 160, mid: 120, fast: 85 };
    var KEY_BEST = 'gzly.snake.best';
    var KEY_SPEED = 'gzly.snake.speed';
    var KEY_WRAP = 'gzly.snake.wrap';
    var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    var OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
    var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var store = window.Site.store;
    var sound = window.Site.sound;

    var canvas = document.getElementById('board');
    var ctx = canvas.getContext('2d');
    var stageEl = document.getElementById('stage');
    var scoreEl = document.getElementById('score');
    var bestEl = document.getElementById('best');
    var pauseBtn = document.getElementById('pause');
    var wrapBtn = document.getElementById('wrap');
    var speedSeg = document.getElementById('speed');
    var ovReady = document.getElementById('ov-ready');
    var ovPause = document.getElementById('ov-pause');
    var ovOver = document.getElementById('ov-over');

    var speed = store.get(KEY_SPEED, 'mid');
    if (!SPEEDS[speed]) speed = 'mid';
    var wrap = store.get(KEY_WRAP, false) === true;
    var bestMap = store.get(KEY_BEST, {});
    if (!bestMap || typeof bestMap !== 'object' || Array.isArray(bestMap)) bestMap = {};

    // 游戏状态：ready / playing / paused / over
    var state = 'ready';
    var snake, prev, dir, queue, food, foodBorn, score, eaten, acc, deadAt, won;
    var effects = [];
    var manual = false; // 测试用：关闭自动前进

    window.Site.played('snake');

    function modeKey() { return speed + (wrap ? '_wrap' : ''); }
    function best() { return bestMap[modeKey()] || 0; }
    function interval() { return SPEEDS[speed] * Math.max(0.65, 1 - eaten * 0.012); }

    function reset() {
      var y = Math.floor(N / 2) + 3;
      snake = [{ x: 6, y: y }, { x: 5, y: y }, { x: 4, y: y }];
      prev = snake.slice();
      dir = 'right';
      queue = [];
      score = 0;
      eaten = 0;
      acc = 0;
      won = false;
      deadAt = 0;
      effects = [];
      spawnFood();
      state = 'ready';
      updateUI();
    }

    // 只在空格子里随机放食物
    function spawnFood() {
      var occ = new Uint8Array(N * N);
      for (var i = 0; i < snake.length; i++) occ[snake[i].y * N + snake[i].x] = 1;
      var free = [];
      for (var k = 0; k < N * N; k++) if (!occ[k]) free.push(k);
      if (!free.length) { food = null; return false; }
      var pick = free[Math.floor(Math.random() * free.length)];
      food = { x: pick % N, y: Math.floor(pick / N) };
      foodBorn = performance.now();
      return true;
    }

    function step() {
      if (queue.length) dir = queue.shift();
      var v = DIRS[dir];
      var h = snake[0];
      var nx = h.x + v[0];
      var ny = h.y + v[1];
      if (wrap) {
        nx = (nx + N) % N;
        ny = (ny + N) % N;
      } else if (nx < 0 || ny < 0 || nx >= N || ny >= N) {
        return die();
      }
      var eat = !!food && nx === food.x && ny === food.y;
      // 不吃东西时尾巴会让开，所以不算尾巴
      var len = snake.length - (eat ? 0 : 1);
      for (var i = 0; i < len; i++) {
        if (snake[i].x === nx && snake[i].y === ny) return die();
      }
      prev = snake.slice();
      snake.unshift({ x: nx, y: ny });
      if (!eat) snake.pop();
      if (eat) {
        score += 1;
        eaten += 1;
        effects.push({ x: nx, y: ny, t: performance.now() });
        sound('eat');
        window.Site.vibrate(8);
        if (!spawnFood()) { won = true; return die(); }
        updateUI();
      }
    }

    function die() {
      prev = snake.slice();
      queue = [];
      state = 'over';
      deadAt = performance.now();
      var isNew = score > best();
      if (isNew) {
        bestMap[modeKey()] = score;
        store.set(KEY_BEST, bestMap);
      }
      syncHomeStat();
      if (won) sound('win');
      else { sound('lose'); window.Site.vibrate(40); }
      document.getElementById('over-title').textContent = won ? '满屏通关！' : '游戏结束';
      var t = document.getElementById('over-text');
      t.textContent = isNew ? '新纪录 ' + score + '！' : '得分 ' + score + ' · 最高 ' + best();
      t.className = isNew ? 'new-best' : '';
      updateUI();
    }

    function syncHomeStat() {
      var top = 0;
      for (var k in bestMap) if (typeof bestMap[k] === 'number' && bestMap[k] > top) top = bestMap[k];
      if (top > 0) window.Site.setHomeStat('snake', '最高 ' + top);
    }

    function start() {
      if (state === 'over') reset();
      if (state !== 'ready') return;
      state = 'playing';
      acc = 0;
      sound('start');
      updateUI();
    }

    function pause() {
      if (state !== 'playing') return;
      state = 'paused';
      sound('click');
      updateUI();
    }

    function resume() {
      if (state !== 'paused') return;
      state = 'playing';
      sound('click');
      updateUI();
    }

    function togglePause() {
      if (state === 'playing') pause();
      else if (state === 'paused') resume();
      else start();
    }

    // 转向：最多缓存两步，忽略掉头和同向
    function turn(d) {
      if (state === 'over') return;
      if (state === 'ready') start();
      else if (state === 'paused') resume();
      var last = queue.length ? queue[queue.length - 1] : dir;
      if (d === last || d === OPP[last]) return;
      if (queue.length >= 2) return;
      queue.push(d);
    }

    function updateUI() {
      scoreEl.textContent = score;
      bestEl.textContent = Math.max(best(), state === 'over' ? 0 : score);
      ovReady.hidden = state !== 'ready';
      ovPause.hidden = state !== 'paused';
      ovOver.hidden = state !== 'over';
      var running = state === 'playing';
      pauseBtn.classList.toggle('paused', !running);
      pauseBtn.disabled = state === 'over';
      pauseBtn.setAttribute('aria-label', running ? '暂停' : (state === 'paused' ? '继续' : '开始'));
    }

    // ---------- 绘制 ----------
    var C = {};
    function readColors() {
      var cs = getComputedStyle(document.documentElement);
      ['board-a', 'board-b', 'snake', 'snake-dark', 'apple', 'leaf', 'stem', 'pupil', 'bad'].forEach(function (k) {
        C[k] = cs.getPropertyValue('--' + k).trim();
      });
    }

    function resize() {
      var dpr = window.devicePixelRatio || 1;
      var w = canvas.clientWidth;
      if (!w) return;
      var px = Math.round(w * dpr);
      if (canvas.width !== px) {
        canvas.width = px;
        canvas.height = px;
      }
    }

    function lerp(a, b, k) { return a + (b - a) * k; }

    // 穿墙时把坐标展开到离参考点最近的位置，保证折线连续
    function near(p, ref) {
      var x = p.x, y = p.y;
      if (wrap) {
        if (x - ref.x > 1) x -= N; else if (ref.x - x > 1) x += N;
        if (y - ref.y > 1) y -= N; else if (ref.y - y > 1) y += N;
      }
      return { x: x, y: y };
    }

    function bodyPath(a) {
      var c0 = snake[0];
      var p0 = near(prev[0], c0);
      var pts = [{ x: lerp(p0.x, c0.x, a), y: lerp(p0.y, c0.y, a) }];
      for (var i = 1; i < snake.length; i++) pts.push(near(snake[i], pts[pts.length - 1]));
      if (prev.length === snake.length) {
        var ct = pts[pts.length - 1];
        var pt = near(prev[prev.length - 1], ct);
        pts.push({ x: lerp(pt.x, ct.x, a), y: lerp(pt.y, ct.y, a) });
      }
      return pts;
    }

    function drawApple(t) {
      if (!food) return;
      var age = t - foodBorn;
      var k = REDUCED ? 1 : Math.max(0, Math.min(1, age / 180));
      k = k * (2 - k); // ease-out
      var pulse = REDUCED ? 1 : 1 + 0.05 * Math.sin(t / 240);
      ctx.save();
      ctx.translate(food.x + 0.5, food.y + 0.52);
      ctx.scale(k * pulse, k * pulse);
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.beginPath();
      ctx.ellipse(0, 0.36, 0.28, 0.07, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C.apple;
      ctx.beginPath();
      ctx.arc(-0.1, 0.04, 0.29, 0, Math.PI * 2);
      ctx.arc(0.1, 0.04, 0.29, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.ellipse(-0.16, -0.06, 0.06, 0.1, 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = C.stem;
      ctx.lineWidth = 0.07;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -0.18);
      ctx.quadraticCurveTo(0.01, -0.33, 0.07, -0.4);
      ctx.stroke();
      ctx.fillStyle = C.leaf;
      ctx.beginPath();
      ctx.ellipse(0.2, -0.32, 0.14, 0.065, -0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawSnake(a, t, ox, oy) {
      var pts = bodyPath(a);
      ox += 0.5; // 格子中心
      oy += 0.5;
      var W = 0.74;
      // 从尾巴往前累计长度，用于尾部收细
      var segs = [];
      var dist = 0;
      for (var i = pts.length - 1; i > 0; i--) {
        var p = pts[i], q = pts[i - 1];
        var len = Math.abs(q.x - p.x) + Math.abs(q.y - p.y);
        if (len < 1e-4) continue;
        var parts = dist < 3 ? 4 : 1;
        for (var j = 0; j < parts; j++) {
          var s0 = j / parts, s1 = (j + 1) / parts;
          var mid = dist + len * (s0 + s1) / 2;
          segs.push({
            x0: lerp(p.x, q.x, s0) + ox, y0: lerp(p.y, q.y, s0) + oy,
            x1: lerp(p.x, q.x, s1) + ox, y1: lerp(p.y, q.y, s1) + oy,
            w: W * (0.5 + 0.5 * Math.min(1, mid / 3))
          });
        }
        dist += len;
      }
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      var pass, s;
      for (pass = 0; pass < 2; pass++) {
        ctx.strokeStyle = pass === 0 ? C['snake-dark'] : C.snake;
        for (i = 0; i < segs.length; i++) {
          s = segs[i];
          ctx.lineWidth = pass === 0 ? s.w + 0.1 : s.w;
          ctx.beginPath();
          ctx.moveTo(s.x0, s.y0);
          ctx.lineTo(s.x1, s.y1);
          ctx.stroke();
        }
      }
      // 高光：一条连续折线，避免半透明重叠出斑点
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 0.16;
      ctx.beginPath();
      ctx.moveTo(pts[0].x + ox, pts[0].y + oy - 0.1);
      for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x + ox, pts[i].y + oy - 0.1);
      ctx.stroke();

      // 头
      var H = { x: pts[0].x + ox, y: pts[0].y + oy };
      var v = DIRS[state === 'ready' ? dir : headDir()];
      var dead = state === 'over' && !won;
      ctx.fillStyle = C['snake-dark'];
      ctx.beginPath();
      ctx.arc(H.x, H.y, 0.47, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = dead ? C.bad : C.snake;
      ctx.beginPath();
      ctx.arc(H.x, H.y, 0.42, 0, Math.PI * 2);
      ctx.fill();

      var px = -v[1], py = v[0];
      for (var e = -1; e <= 1; e += 2) {
        var ex = H.x + v[0] * 0.12 + px * 0.2 * e;
        var ey = H.y + v[1] * 0.12 + py * 0.2 * e;
        if (dead) {
          ctx.strokeStyle = C.pupil;
          ctx.lineWidth = 0.06;
          ctx.beginPath();
          ctx.moveTo(ex - 0.07, ey - 0.07); ctx.lineTo(ex + 0.07, ey + 0.07);
          ctx.moveTo(ex + 0.07, ey - 0.07); ctx.lineTo(ex - 0.07, ey + 0.07);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(ex, ey, 0.13, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = C.pupil;
          ctx.beginPath();
          ctx.arc(ex + v[0] * 0.05, ey + v[1] * 0.05, 0.07, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // 头的朝向：取最近一步实际移动的方向
    function headDir() {
      var a = snake[0], b = snake[1];
      var dx = a.x - b.x, dy = a.y - b.y;
      if (dx > 1) dx = -1; else if (dx < -1) dx = 1;
      if (dy > 1) dy = -1; else if (dy < -1) dy = 1;
      if (dx === 1) return 'right';
      if (dx === -1) return 'left';
      if (dy === 1) return 'down';
      return 'up';
    }

    function draw(t) {
      if (!canvas.width) return;
      var s = canvas.width / N;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      var shake = 0;
      if (state === 'over' && !won && !REDUCED) {
        var age = t - deadAt;
        if (age < 320) shake = Math.sin(age / 18) * 0.12 * (1 - age / 320);
      }
      ctx.setTransform(s, 0, 0, s, shake * s, 0);

      ctx.fillStyle = C['board-a'];
      ctx.fillRect(-1, 0, N + 2, N);
      ctx.fillStyle = C['board-b'];
      for (var y = 0; y < N; y++)
        for (var x = (y & 1); x < N; x += 2) ctx.fillRect(x, y, 1, 1);

      drawApple(t);

      // 吃到食物的光圈
      for (var i = effects.length - 1; i >= 0; i--) {
        var p = (t - effects[i].t) / 360;
        if (p >= 1 || REDUCED) { effects.splice(i, 1); continue; }
        ctx.strokeStyle = C.snake;
        ctx.globalAlpha = 1 - p;
        ctx.lineWidth = 0.08;
        ctx.beginPath();
        ctx.arc(effects[i].x + 0.5, effects[i].y + 0.5, 0.35 + p * 0.6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      var a = 1;
      if (state === 'playing' || state === 'paused') a = Math.min(1, acc / interval());
      if (REDUCED) a = 1;
      if (wrap) {
        for (var ox = -N; ox <= N; ox += N)
          for (var oy = -N; oy <= N; oy += N) drawSnake(a, t, ox, oy);
      } else {
        drawSnake(a, t, 0, 0);
      }
    }

    // ---------- 主循环（固定步长） ----------
    var lastT = 0;
    function frame(t) {
      var dt = lastT ? Math.min(t - lastT, 250) : 0;
      lastT = t;
      if (state === 'playing' && !manual) {
        acc += dt;
        var iv = interval();
        while (state === 'playing' && acc >= iv) {
          acc -= iv;
          step();
          iv = interval();
        }
      }
      draw(t);
      requestAnimationFrame(frame);
    }

    // ---------- 输入 ----------
    var KEYMAP = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', s: 'down', a: 'left', d: 'right',
      W: 'up', S: 'down', A: 'left', D: 'right'
    };

    document.addEventListener('keydown', function (e) {
      if (document.querySelector('dialog[open]')) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      var d = KEYMAP[e.key];
      if (d) {
        e.preventDefault();
        turn(d);
        return;
      }
      if (e.key === ' ' || e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        if (e.repeat) return;
        if (state === 'over') { if (e.key === ' ') start(); return; }
        togglePause();
      }
    });

    // 棋盘上滑动：移动够距离就转向，一次手势可连续转多次
    var swipe = null;
    stageEl.addEventListener('pointerdown', function (e) {
      if (e.target.closest('button')) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      swipe = { x: e.clientX, y: e.clientY, id: e.pointerId };
      try { stageEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    stageEl.addEventListener('pointermove', function (e) {
      if (!swipe || e.pointerId !== swipe.id) return;
      var dx = e.clientX - swipe.x;
      var dy = e.clientY - swipe.y;
      var ax = Math.abs(dx), ay = Math.abs(dy);
      if (Math.max(ax, ay) < 18) return;
      turn(ax > ay ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      swipe.x = e.clientX;
      swipe.y = e.clientY;
    });
    function endSwipe() { swipe = null; }
    stageEl.addEventListener('pointerup', endSwipe);
    stageEl.addEventListener('pointercancel', endSwipe);
    stageEl.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

    // 方向键盘：按下即响应
    var dpad = document.getElementById('dpad');
    dpad.addEventListener('pointerdown', function (e) {
      var b = e.target.closest('[data-dir]');
      if (!b) return;
      e.preventDefault();
      b.classList.add('on');
      turn(b.getAttribute('data-dir'));
    });
    function dpadUp(e) {
      var b = e.target.closest && e.target.closest('[data-dir]');
      if (b) b.classList.remove('on');
    }
    dpad.addEventListener('pointerup', dpadUp);
    dpad.addEventListener('pointercancel', dpadUp);
    dpad.addEventListener('pointerout', dpadUp);
    dpad.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
    dpad.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    stageEl.addEventListener('click', function (e) {
      var b = e.target.closest('[data-action]');
      if (!b) return;
      var act = b.getAttribute('data-action');
      if (act === 'start' || act === 'restart') start();
      else if (act === 'resume') resume();
      b.blur();
    });

    pauseBtn.addEventListener('click', function () { togglePause(); pauseBtn.blur(); });

    function syncControls() {
      var btns = speedSeg.querySelectorAll('button');
      for (var i = 0; i < btns.length; i++) {
        btns[i].setAttribute('aria-pressed', btns[i].getAttribute('data-speed') === speed ? 'true' : 'false');
      }
      wrapBtn.setAttribute('aria-pressed', wrap ? 'true' : 'false');
    }

    speedSeg.addEventListener('click', function (e) {
      var b = e.target.closest('[data-speed]');
      if (!b) return;
      b.blur();
      var v = b.getAttribute('data-speed');
      if (v === speed) return;
      speed = v;
      store.set(KEY_SPEED, speed);
      sound('select');
      syncControls();
      reset();
    });

    wrapBtn.addEventListener('click', function () {
      wrapBtn.blur();
      wrap = !wrap;
      store.set(KEY_WRAP, wrap);
      sound('select');
      syncControls();
      reset();
    });

    // 自动暂停：切到后台、打开说明
    document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });
    document.querySelector('[data-open="help"]').addEventListener('click', pause);

    // 主题与尺寸变化
    document.addEventListener('themechange', readColors);
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', readColors);
    else if (mq.addListener) mq.addListener(readColors);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
    window.addEventListener('resize', resize);

    // 测试钩子
    window.__snake = {
      get state() { return state; },
      get snake() { return snake.map(function (c) { return { x: c.x, y: c.y }; }); },
      get food() { return food && { x: food.x, y: food.y }; },
      get dir() { return dir; },
      get queue() { return queue.slice(); },
      get score() { return score; },
      get interval() { return interval(); },
      N: N,
      set manual(v) { manual = !!v; },
      get manual() { return manual; },
      step: function () { if (state === 'playing') step(); },
      turn: turn,
      start: start,
      pause: pause,
      resume: resume,
      setSnake: function (cells, d) { snake = cells.map(function (c) { return { x: c.x, y: c.y }; }); prev = snake.slice(); dir = d || dir; queue = []; },
      setFood: function (x, y) { food = { x: x, y: y }; foodBorn = 0; }
    };

    readColors();
    syncControls();
    reset();
    syncHomeStat();
    resize();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
