<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>贪吃蛇 · 游戏来了</title>
  <meta name="description" content="在线玩贪吃蛇：吃苹果变长，别撞墙也别咬到自己。支持键盘、手机滑动和方向键盘，三档速度，可开启穿墙模式。">
  <meta name="theme-color" content="#fff7d6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='8' fill='%23f5b400' stroke='%232d2a4a' stroke-width='3'/%3E%3Cpath d='M8 23h8v-8h6' fill='none' stroke='%232d2a4a' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M8 23h8v-8h6' fill='none' stroke='%2346c85a' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='22.5' cy='14' r='2' fill='white' stroke='%232d2a4a' stroke-width='1.2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/site.css">
  <script src="../../assets/site.js"></script>
  <style>
    :root {
      /* 顶栏 + 数据条 + 方向键 + 间距 占掉的高度 */
      --reserve: 328px;
      --stage-max: 480px;
      /* 花园草地 */
      --hedge: #6cc94a;
      --grass-a: #c4ee86;
      --grass-b: #b2e370;
      --tuft: #8fcf55;
      --flower: #ffffff;
      /* 小蛇 */
      --snake: #34c35a;
      --snake-belly: #c9f59a;
      --blush: rgba(255, 110, 140, 0.7);
      --tongue: #ff4d6d;
      /* 苹果 */
      --apple: #ff4757;
      --leaf: #5ad13e;
      --stem: #8a5a32;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --hedge: #24502e;
        --grass-a: #2f6a3a;
        --grass-b: #285e33;
        --tuft: #3d7f47;
        --flower: #b9b4e6;
        --snake: #4fdc72;
        --snake-belly: #c4f7a2;
        --apple: #ff5a67;
        --leaf: #6be04e;
        --stem: #b07a4c;
      }
    }
    :root[data-theme="dark"] {
      --hedge: #24502e;
      --grass-a: #2f6a3a;
      --grass-b: #285e33;
      --tuft: #3d7f47;
      --flower: #b9b4e6;
      --snake: #4fdc72;
      --snake-belly: #c4f7a2;
      --apple: #ff5a67;
      --leaf: #6be04e;
      --stem: #b07a4c;
    }
    /* 棋盘边长随屏幕高度收缩，保证手机一屏放下 */
    @supports (height: 100dvh) {
      :root {
        --stage-max: clamp(280px, calc(100dvh - var(--reserve) - env(safe-area-inset-top) - env(safe-area-inset-bottom)), 480px);
      }
    }
    @media (hover: hover) and (pointer: fine) {
      :root { --reserve: 168px; --stage-max: 560px; }
      @supports (height: 100dvh) {
        :root { --stage-max: clamp(280px, calc(100dvh - var(--reserve)), 560px); }
      }
      .dpad { display: none !important; }
    }

    body.game-page { touch-action: manipulation; }

    /* 暂停 / 开始：黄色大按钮 */
    .stats .btns .btn { width: 58px; padding: 0; }
    .stats .btns .btn svg { display: block; width: 24px; height: 24px; }
    #pause {
      background: var(--theme);
      color: var(--theme-ink);
      box-shadow: var(--pop-sm), inset 0 -4px 0 rgba(0, 0, 0, 0.12), inset 0 3px 0 rgba(255, 255, 255, 0.45);
    }
    #pause:active { box-shadow: 0 0 0 var(--ink), inset 0 -4px 0 rgba(0, 0, 0, 0.12); }
    #pause:disabled { box-shadow: var(--pop-sm); }
    #pause .play { display: none; }
    #pause.paused .play { display: block; }
    #pause.paused .pz { display: none; }
    #pause .play { margin-left: 2px; }
    /* 花园棋盘：粗描边的草地画框 */
    .stage {
      padding: 7px;
      border: var(--outline);
      border-radius: 24px;
      background: var(--hedge);
      box-shadow: var(--shadow-lg), inset 0 3px 0 rgba(255, 255, 255, 0.3), inset 0 -4px 0 rgba(0, 0, 0, 0.14);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #board {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      border: 2.5px solid var(--ink);
      border-radius: 12px;
      background: var(--grass-a);
    }
    .overlay { border-radius: 20px; }
    .overlay.over { animation-delay: 450ms; }
    .overlay.over .overlay-card { animation-delay: 550ms; }
    .overlay .btn.big {
      height: 54px;
      min-width: 150px;
      padding: 0 30px;
      border-radius: 18px;
      font-family: var(--font-display);
      font-size: 24px;
      letter-spacing: 0.1em;
      box-shadow: var(--pop), inset 0 -5px 0 rgba(0, 0, 0, 0.12), inset 0 4px 0 rgba(255, 255, 255, 0.45);
    }
    .overlay .btn.big:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink), inset 0 -5px 0 rgba(0, 0, 0, 0.12); }
    .overlay-card .mascot { display: block; width: 66px; height: 44px; margin: -2px 0 -4px; }
    .overlay-card .mascot [stroke="#2d2a4a"] { stroke: var(--ink); }

    /* 开始卡片：小巧地停在棋盘上方，露出小蛇和苹果 */
    .overlay.ready {
      align-items: start;
      padding: 7% 12px 12px;
      background: color-mix(in srgb, var(--bg) 18%, transparent);
    }
    .overlay.ready .overlay-card { gap: 10px; padding: 12px 16px 14px; width: min(236px, 100%); }

    /* 暂停：整块棋盘蒙上一层，一眼看出停住了 */
    .overlay.paused {
      background: color-mix(in srgb, var(--bg) 50%, transparent);
      -webkit-backdrop-filter: blur(1.5px) saturate(.65);
      backdrop-filter: blur(1.5px) saturate(.65);
      animation-delay: 0ms;
    }
    .overlay.paused .overlay-card { gap: 12px; padding: 18px 18px 18px; width: min(220px, 100%); animation-delay: 0ms; animation-duration: 240ms; }
    .overlay.paused .pause-badge {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin-bottom: -2px;
      border: var(--outline);
      border-radius: 50%;
      background: var(--theme-soft);
      color: #2d2a4a;
    }
    .overlay.paused .pause-badge svg { width: 24px; height: 24px; }
    .overlay.paused h2 { font-size: 32px; }

    /* 当前设置小标签：点一下打开新游戏弹窗 */
    .overlay .chip {
      height: 40px;
      gap: 6px;
      padding: 0 12px 0 14px;
      font-size: 14px;
      font-family: inherit;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .overlay .chip:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
    .overlay .chip:focus-visible { outline: 3px solid var(--theme); outline-offset: 3px; }
    .overlay .chip .gear { width: 18px; height: 18px; flex: none; opacity: .75; }
    .overlay .chip .dotsep { opacity: .5; }

    .overlay.over .overlay-card { gap: 12px; padding: 20px 18px 18px; width: min(260px, 100%); }
    .overlay.over .btns { display: grid; justify-items: center; gap: 12px; }
    #over-text { font-variant-numeric: tabular-nums; }

    /* 新游戏弹窗 */
    #newgame .choice small { font-variant-numeric: tabular-nums; }
    #newgame .switch-row { min-height: 58px; }
    #newgame .switch-row > span { display: grid; gap: 1px; }
    .overlay .new-best {
      padding: 2px 14px 3px;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      background: var(--theme);
      color: var(--theme-ink);
      box-shadow: 0 3px 0 var(--ink);
      transform: rotate(-2deg);
    }

    /* 方向键盘：四个街机圆按钮排成十字 */
    .dpad {
      --b: 58px;
      --dy: 48px;
      --dx: 70px;
      position: relative;
      flex: none;
      width: calc(var(--b) + 2 * var(--dx));
      height: calc(var(--b) + 2 * var(--dy) + 4px);
      margin: 0 auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .dpad::before {
      content: "";
      position: absolute;
      left: 50%;
      top: calc(var(--dy) + var(--b) / 2);
      width: 26px;
      height: 26px;
      margin: -13px 0 0 -13px;
      border-radius: 50%;
      border: var(--outline);
      background: var(--theme-2);
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.15), inset 0 3px 0 rgba(255, 255, 255, 0.4);
    }
    .dpad button {
      position: absolute;
      left: var(--dx);
      top: var(--dy);
      width: var(--b);
      height: var(--b);
      display: grid;
      place-items: center;
      padding: 0;
      border: var(--outline);
      border-radius: 50%;
      background: var(--theme);
      color: var(--ink);
      box-shadow: 0 4px 0 var(--ink), inset 0 -5px 0 rgba(0, 0, 0, 0.13), inset 0 4px 0 rgba(255, 255, 255, 0.5);
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 70ms ease, box-shadow 70ms ease, filter 70ms ease;
    }
    .dpad button svg { width: 26px; height: 26px; pointer-events: none; }
    .dpad button.on {
      transform: translateY(4px) scale(0.96);
      box-shadow: 0 0 0 var(--ink), inset 0 -2px 0 rgba(0, 0, 0, 0.13), inset 0 3px 0 rgba(0, 0, 0, 0.12);
      filter: brightness(0.94);
    }
    .dpad .up { top: 0; }
    .dpad .down { top: calc(2 * var(--dy)); }
    .dpad .left { left: 0; }
    .dpad .right { left: calc(2 * var(--dx)); }

    /* 矮屏手机：收紧间距，把空间让给棋盘 */
    @media (max-height: 700px) and (hover: none), (max-height: 700px) and (pointer: coarse) {
      :root { --reserve: 306px; }
      .stage { padding: 5px; border-radius: 22px; }
      .gbar { padding: 10px 0; }
      .dpad { --b: 54px; --dy: 45px; --dx: 65px; }
    }
    @media (max-height: 600px) and (hover: none), (max-height: 600px) and (pointer: coarse) {
      :root { --reserve: 292px; }
      .dpad { --b: 50px; --dy: 41px; --dx: 60px; }
    }
  </style>
</head>
<body class="game-page" data-game="snake">
  <header class="gbar">
    <a class="icon-btn" href="../../" aria-label="返回游戏大厅" title="返回游戏大厅">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="gbar-title">贪吃蛇</h1>
    <div class="gbar-actions">
      <button class="icon-btn sound-toggle" type="button" aria-label="关闭声音">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
      </button>
      <button class="icon-btn" type="button" data-open="help" aria-label="玩法说明" title="玩法说明">?</button>
    </div>
  </header>

  <main class="gmain">
    <div class="stats">
      <div class="stat"><span class="stat-label">分数</span><span class="stat-value" id="score">0</span></div>
      <div class="stat"><span class="stat-label">最高</span><span class="stat-value" id="best">0</span></div>
      <div class="btns">
        <button class="btn paused" type="button" id="pause" aria-label="开始" title="暂停 (空格)">
          <svg class="pz" viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1.6"/><rect x="14" y="4.5" width="4.5" height="15" rx="1.6"/></svg>
          <svg class="play" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>
        </button>
      </div>
    </div>

    <div class="stage" id="stage">
      <canvas id="board" aria-label="贪吃蛇棋盘，使用方向键、滑动或下方方向键操作"></canvas>

      <div class="overlay ready" id="ov-ready">
        <div class="overlay-card">
          <svg class="mascot" viewBox="0 0 74 50" aria-hidden="true">
            <path d="M8 38c10 0 10-14 22-14s12 14 24 14" fill="none" stroke="#2d2a4a" stroke-width="13" stroke-linecap="round"/>
            <path d="M8 38c10 0 10-14 22-14s12 14 24 14" fill="none" stroke="#34c35a" stroke-width="8" stroke-linecap="round"/>
            <circle cx="57" cy="34" r="12" fill="#34c35a" stroke="#2d2a4a" stroke-width="3"/>
            <circle cx="54" cy="31" r="4.2" fill="#fff" stroke="#2d2a4a" stroke-width="2"/>
            <circle cx="63" cy="31" r="4.2" fill="#fff" stroke="#2d2a4a" stroke-width="2"/>
            <circle cx="55.5" cy="31.5" r="2" fill="#2d2a4a"/>
            <circle cx="64.5" cy="31.5" r="2" fill="#2d2a4a"/>
            <path d="M54 39q3 2.5 6 0" fill="none" stroke="#2d2a4a" stroke-width="2" stroke-linecap="round"/>
            <path d="M21 8c3-3 8-3 9 2-3 1-7 1-9-2z" fill="#5ad13e" stroke="#2d2a4a" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="17" cy="16" r="7.5" fill="#ff4757" stroke="#2d2a4a" stroke-width="2.5"/>
            <ellipse cx="14.5" cy="13.5" rx="1.8" ry="2.6" fill="#fff" transform="rotate(30 14.5 13.5)"/>
          </svg>
          <button class="btn primary big" type="button" data-action="start">开始</button>
          <button class="chip mode-chip" type="button" data-open="newgame" aria-label="设置"></button>
        </div>
      </div>

      <div class="overlay paused" id="ov-pause" hidden>
        <div class="overlay-card">
          <span class="pause-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1.6"/><rect x="14" y="4.5" width="4.5" height="15" rx="1.6"/></svg></span>
          <h2>暂停</h2>
          <button class="btn primary big" type="button" data-action="resume">继续</button>
        </div>
      </div>

      <div class="overlay over" id="ov-over" hidden>
        <div class="overlay-card">
          <h2 id="over-title">游戏结束</h2>
          <p id="over-text"></p>
          <div class="btns">
            <button class="btn primary big" type="button" data-action="restart">再来一局</button>
            <button class="chip mode-chip" type="button" data-open="newgame" aria-label="设置"></button>
          </div>
        </div>
      </div>
    </div>

    <div class="dpad" id="dpad" aria-label="方向键">
      <button type="button" class="up" data-dir="up" aria-label="上"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
      <button type="button" class="left" data-dir="left" aria-label="左"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button type="button" class="right" data-dir="right" aria-label="右"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button type="button" class="down" data-dir="down" aria-label="下"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
  </main>

  <dialog class="sheet" id="newgame">
    <div class="sheet-head">
      <h2>新游戏</h2>
      <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <p class="sheet-label">速度</p>
      <div class="choices" id="speed-choices">
        <button class="choice" type="button" data-speed="slow" aria-pressed="false"><span class="choice-icon">🐢</span><span><b>慢</b><small>最高 0</small></span></button>
        <button class="choice" type="button" data-speed="mid" aria-pressed="true"><span class="choice-icon">🐇</span><span><b>中</b><small>最高 0</small></span></button>
        <button class="choice" type="button" data-speed="fast" aria-pressed="false"><span class="choice-icon">🚀</span><span><b>快</b><small>最高 0</small></span></button>
      </div>
      <p class="sheet-label">模式</p>
      <label class="switch-row">
        <span>穿墙<small>从一边出去，另一边回来</small></span>
        <input type="checkbox" class="switch" id="wrap">
      </label>
    </div>
  </dialog>

  <dialog class="sheet" id="help">
    <div class="sheet-head">
      <h2>怎么玩</h2>
      <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <ul class="tips">
        <li><b>🎮</b><span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>WASD</kbd>，或滑动转向。</span></li>
        <li><b>🍎</b><span>吃苹果变长，越长越快。</span></li>
        <li><b>💥</b><span>撞墙或咬到自己就输了。</span></li>
        <li><b>⏸</b><span><kbd>空格</kbd> 或 <kbd>P</kbd> 暂停。</span></li>
      </ul>
      <p style="margin:18px 0 0"><button class="btn block theme-toggle" type="button">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        切换深色 / 浅色
      </button></p>
    </div>
  </dialog>

  <script>
  (function () {
    'use strict';

    var N = 17;
    var SPEEDS = { slow: 160, mid: 120, fast: 85 };
    var KEY_BEST = 'gzly.snake.best';
    var KEY_SPEED = 'gzly.snake.speed';
    var KEY_WRAP = 'gzly.snake.wrap';
    var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    var OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
    var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var store = window.Site.store;
    var sound = window.Site.sound;

    var canvas = document.getElementById('board');
    var ctx = canvas.getContext('2d');
    var stageEl = document.getElementById('stage');
    var scoreEl = document.getElementById('score');
    var bestEl = document.getElementById('best');
    var pauseBtn = document.getElementById('pause');
    var wrapSw = document.getElementById('wrap');
    var speedChoices = document.getElementById('speed-choices');
    var modeChips = document.querySelectorAll('.mode-chip');
    var ovReady = document.getElementById('ov-ready');
    var ovPause = document.getElementById('ov-pause');
    var ovOver = document.getElementById('ov-over');

    var speed = store.get(KEY_SPEED, 'mid');
    if (!SPEEDS[speed]) speed = 'mid';
    var wrap = store.get(KEY_WRAP, false) === true;
    var bestMap = store.get(KEY_BEST, {});
    if (!bestMap || typeof bestMap !== 'object' || Array.isArray(bestMap)) bestMap = {};

    // 游戏状态：ready / playing / paused / over
    var state = 'ready';
    var snake, prev, dir, queue, food, foodBorn, score, eaten, acc, deadAt, won;
    var effects = [];
    var manual = false; // 测试用：关闭自动前进

    window.Site.played('snake');

    function modeKey() { return speed + (wrap ? '_wrap' : ''); }
    function best() { return bestMap[modeKey()] || 0; }
    function interval() { return SPEEDS[speed] * Math.max(0.65, 1 - eaten * 0.012); }

    function reset() {
      var y = Math.floor(N / 2) + 3;
      snake = [{ x: 6, y: y }, { x: 5, y: y }, { x: 4, y: y }];
      prev = snake.slice();
      dir = 'right';
      queue = [];
      score = 0;
      eaten = 0;
      acc = 0;
      won = false;
      deadAt = 0;
      effects = [];
      spawnFood();
      state = 'ready';
      updateUI();
    }

    // 只在空格子里随机放食物
    function spawnFood() {
      var occ = new Uint8Array(N * N);
      for (var i = 0; i < snake.length; i++) occ[snake[i].y * N + snake[i].x] = 1;
      var free = [];
      for (var k = 0; k < N * N; k++) if (!occ[k]) free.push(k);
      if (!free.length) { food = null; return false; }
      var pick = free[Math.floor(Math.random() * free.length)];
      food = { x: pick % N, y: Math.floor(pick / N) };
      foodBorn = performance.now();
      return true;
    }

    function step() {
      if (queue.length) dir = queue.shift();
      var v = DIRS[dir];
      var h = snake[0];
      var nx = h.x + v[0];
      var ny = h.y + v[1];
      if (wrap) {
        nx = (nx + N) % N;
        ny = (ny + N) % N;
      } else if (nx < 0 || ny < 0 || nx >= N || ny >= N) {
        return die();
      }
      var eat = !!food && nx === food.x && ny === food.y;
      // 不吃东西时尾巴会让开，所以不算尾巴
      var len = snake.length - (eat ? 0 : 1);
      for (var i = 0; i < len; i++) {
        if (snake[i].x === nx && snake[i].y === ny) return die();
      }
      prev = snake.slice();
      snake.unshift({ x: nx, y: ny });
      if (!eat) snake.pop();
      if (eat) {
        score += 1;
        eaten += 1;
        effects.push({ x: nx, y: ny, t: performance.now() });
        sound('eat');
        window.Site.vibrate(8);
        if (!spawnFood()) { won = true; return die(); }
        updateUI();
      }
    }

    function die() {
      prev = snake.slice();
      queue = [];
      state = 'over';
      deadAt = performance.now();
      var isNew = score > best();
      if (isNew) {
        bestMap[modeKey()] = score;
        store.set(KEY_BEST, bestMap);
        syncControls();
      }
      syncHomeStat();
      if (won) sound('win');
      else { sound('lose'); window.Site.vibrate(40); }
      document.getElementById('over-title').textContent = won ? '满屏通关！' : '游戏结束';
      var t = document.getElementById('over-text');
      t.textContent = isNew ? '新纪录 ' + score + '！' : '得分 ' + score + ' · 最高 ' + best();
      t.className = isNew ? 'new-best' : '';
      updateUI();
    }

    function syncHomeStat() {
      var top = 0;
      for (var k in bestMap) if (typeof bestMap[k] === 'number' && bestMap[k] > top) top = bestMap[k];
      if (top > 0) window.Site.setHomeStat('snake', '最高 ' + top);
    }

    function start() {
      if (state === 'over') reset();
      if (state !== 'ready') return;
      state = 'playing';
      acc = 0;
      sound('start');
      updateUI();
    }

    function pause() {
      if (state !== 'playing') return;
      state = 'paused';
      sound('click');
      updateUI();
    }

    function resume() {
      if (state !== 'paused') return;
      state = 'playing';
      sound('click');
      updateUI();
    }

    function togglePause() {
      if (state === 'playing') pause();
      else if (state === 'paused') resume();
      else start();
    }

    // 转向：最多缓存两步，忽略掉头和同向
    function turn(d) {
      if (state === 'over') return;
      if (state === 'ready') start();
      else if (state === 'paused') resume();
      var last = queue.length ? queue[queue.length - 1] : dir;
      if (d === last || d === OPP[last]) return;
      if (queue.length >= 2) return;
      queue.push(d);
    }

    function updateUI() {
      scoreEl.textContent = score;
      bestEl.textContent = Math.max(best(), state === 'over' ? 0 : score);
      ovReady.hidden = state !== 'ready';
      ovPause.hidden = state !== 'paused';
      ovOver.hidden = state !== 'over';
      var running = state === 'playing';
      pauseBtn.classList.toggle('paused', !running);
      pauseBtn.disabled = state === 'over';
      pauseBtn.setAttribute('aria-label', running ? '暂停' : (state === 'paused' ? '继续' : '开始'));
    }

    // ---------- 绘制 ----------
    var C = {};
    var TAU = Math.PI * 2;
    var bgCanvas = document.createElement('canvas');
    var bgCtx = bgCanvas.getContext('2d');
    var bgDirty = true;

    function readColors() {
      var cs = getComputedStyle(document.documentElement);
      ['grass-a', 'grass-b', 'tuft', 'flower', 'snake', 'snake-belly', 'blush', 'tongue',
        'apple', 'leaf', 'stem', 'ink', 'theme', 'bad'].forEach(function (k) {
        C[k] = cs.getPropertyValue('--' + k).trim();
      });
      var bs = getComputedStyle(document.body);
      C.theme = bs.getPropertyValue('--theme').trim() || C.theme;
      bgDirty = true;
    }

    function resize() {
      var dpr = window.devicePixelRatio || 1;
      var w = canvas.clientWidth;
      if (!w) return;
      var px = Math.round(w * dpr);
      if (canvas.width !== px) {
        canvas.width = px;
        canvas.height = px;
        bgDirty = true;
      }
    }

    // 草地：两色棋盘格 + 固定位置的小草丛和小花（缓存成一张图，每帧直接贴）
    var DECOR = (function () {
      var seed = 7, out = [];
      function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
      for (var i = 0; i < 22; i++) {
        out.push({ x: Math.floor(rnd() * N), y: Math.floor(rnd() * N), ox: 0.25 + rnd() * 0.5, oy: 0.35 + rnd() * 0.4, f: i % 4 === 0 });
      }
      return out;
    })();

    function buildBg() {
      bgDirty = false;
      var px = canvas.width;
      if (!px) return;
      if (bgCanvas.width !== px) { bgCanvas.width = px; bgCanvas.height = px; }
      var g = bgCtx, s = px / N;
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, px, px);
      g.setTransform(s, 0, 0, s, 0, 0);
      g.fillStyle = C['grass-a'];
      g.fillRect(0, 0, N, N);
      g.fillStyle = C['grass-b'];
      for (var y = 0; y < N; y++)
        for (var x = (y & 1); x < N; x += 2) g.fillRect(x, y, 1, 1);
      g.lineCap = 'round';
      g.lineJoin = 'round';
      for (var i = 0; i < DECOR.length; i++) {
        var d = DECOR[i], cx = d.x + d.ox, cy = d.y + d.oy;
        if (d.f) {
          // 小花
          g.fillStyle = C.flower;
          for (var k = 0; k < 5; k++) {
            var a = k / 5 * TAU;
            g.beginPath();
            g.arc(cx + Math.cos(a) * 0.09, cy + Math.sin(a) * 0.09, 0.07, 0, TAU);
            g.fill();
          }
          g.fillStyle = C.theme;
          g.beginPath();
          g.arc(cx, cy, 0.055, 0, TAU);
          g.fill();
        } else {
          // 小草丛
          g.strokeStyle = C.tuft;
          g.lineWidth = 0.07;
          g.beginPath();
          g.moveTo(cx - 0.13, cy - 0.12); g.quadraticCurveTo(cx - 0.1, cy, cx - 0.04, cy + 0.06);
          g.moveTo(cx, cy - 0.18); g.lineTo(cx, cy + 0.06);
          g.moveTo(cx + 0.13, cy - 0.12); g.quadraticCurveTo(cx + 0.1, cy, cx + 0.04, cy + 0.06);
          g.stroke();
        }
      }
    }

    function lerp(a, b, k) { return a + (b - a) * k; }
    function easeOutBack(k) { var c = 1.9; k -= 1; return 1 + (c + 1) * k * k * k + c * k * k; }

    // 穿墙时把坐标展开到离参考点最近的位置，保证折线连续
    function near(p, ref) {
      var x = p.x, y = p.y;
      if (wrap) {
        if (x - ref.x > 1) x -= N; else if (ref.x - x > 1) x += N;
        if (y - ref.y > 1) y -= N; else if (ref.y - y > 1) y += N;
      }
      return { x: x, y: y };
    }

    function bodyPath(a) {
      var c0 = snake[0];
      var p0 = near(prev[0], c0);
      var pts = [{ x: lerp(p0.x, c0.x, a), y: lerp(p0.y, c0.y, a) }];
      for (var i = 1; i < snake.length; i++) pts.push(near(snake[i], pts[pts.length - 1]));
      if (prev.length === snake.length) {
        var ct = pts[pts.length - 1];
        var pt = near(prev[prev.length - 1], ct);
        pts.push({ x: lerp(pt.x, ct.x, a), y: lerp(pt.y, ct.y, a) });
      }
      return pts;
    }

    // 卡通苹果：描边、高光、果柄和叶子，轻轻弹跳
    function applePath(g) {
      g.beginPath();
      g.moveTo(0, -0.22);
      g.bezierCurveTo(0.16, -0.38, 0.44, -0.3, 0.42, 0.0);
      g.bezierCurveTo(0.4, 0.27, 0.22, 0.4, 0.09, 0.36);
      g.quadraticCurveTo(0, 0.33, -0.09, 0.36);
      g.bezierCurveTo(-0.22, 0.4, -0.4, 0.27, -0.42, 0.0);
      g.bezierCurveTo(-0.44, -0.3, -0.16, -0.38, 0, -0.22);
      g.closePath();
    }

    function drawApple(t) {
      if (!food) return;
      var age = t - foodBorn;
      var k = REDUCED ? 1 : Math.max(0, Math.min(1, age / 320));
      k = REDUCED ? 1 : easeOutBack(k);
      var ph = REDUCED ? 0 : Math.abs(Math.sin(t / 300));
      var lift = ph * 0.09;
      var sq = REDUCED ? 0 : Math.max(0, 0.35 - ph) * 0.12; // 落地时轻微压扁
      ctx.save();
      ctx.translate(food.x + 0.5, food.y + 0.56);
      ctx.scale(k, k);
      // 影子
      ctx.fillStyle = 'rgba(20,40,10,0.22)';
      ctx.beginPath();
      ctx.ellipse(0, 0.36, 0.3 - lift * 0.8, 0.075, 0, 0, TAU);
      ctx.fill();
      ctx.translate(0, -lift);
      ctx.scale(0.92 * (1 + sq), 0.92 * (1 - sq));
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      // 果柄
      ctx.strokeStyle = C.ink;
      ctx.lineWidth = 0.15;
      ctx.beginPath();
      ctx.moveTo(0, -0.2);
      ctx.quadraticCurveTo(0.0, -0.38, 0.08, -0.47);
      ctx.stroke();
      ctx.strokeStyle = C.stem;
      ctx.lineWidth = 0.07;
      ctx.stroke();
      // 叶子
      ctx.beginPath();
      ctx.moveTo(0.05, -0.35);
      ctx.quadraticCurveTo(0.2, -0.56, 0.4, -0.42);
      ctx.quadraticCurveTo(0.24, -0.26, 0.05, -0.35);
      ctx.fillStyle = C.leaf;
      ctx.fill();
      ctx.strokeStyle = C.ink;
      ctx.lineWidth = 0.065;
      ctx.stroke();
      // 果身
      applePath(ctx);
      ctx.fillStyle = C.apple;
      ctx.fill();
      ctx.save();
      ctx.clip();
      ctx.fillStyle = 'rgba(0,0,0,0.13)';
      ctx.beginPath();
      ctx.ellipse(0.12, 0.3, 0.5, 0.2, -0.2, 0, TAU);
      ctx.fill();
      ctx.restore();
      applePath(ctx);
      ctx.strokeStyle = C.ink;
      ctx.lineWidth = 0.085;
      ctx.stroke();
      // 高光
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(-0.2, -0.07, 0.06, 0.12, 0.5, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-0.12, -0.21, 0.035, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    function drawSnake(a, t, ox, oy) {
      var pts = bodyPath(a);
      ox += 0.5; // 格子中心
      oy += 0.5;
      var W = 0.74;
      var OUT = 0.2; // 描边总宽
      // 从尾巴往前累计长度，用于尾部收细
      var segs = [];
      var dist = 0;
      for (var i = pts.length - 1; i > 0; i--) {
        var p = pts[i], q = pts[i - 1];
        var len = Math.abs(q.x - p.x) + Math.abs(q.y - p.y);
        if (len < 1e-4) continue;
        var parts = dist < 3 ? 4 : 1;
        for (var j = 0; j < parts; j++) {
          var s0 = j / parts, s1 = (j + 1) / parts;
          var mid = dist + len * (s0 + s1) / 2;
          segs.push({
            x0: lerp(p.x, q.x, s0) + ox, y0: lerp(p.y, q.y, s0) + oy,
            x1: lerp(p.x, q.x, s1) + ox, y1: lerp(p.y, q.y, s1) + oy,
            w: W * (0.45 + 0.55 * Math.min(1, mid / 3))
          });
        }
        dist += len;
      }
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      var s;
      // 先整条描一遍粗墨线，再盖上绿色身体
      ctx.strokeStyle = C.ink;
      for (i = 0; i < segs.length; i++) {
        s = segs[i];
        ctx.lineWidth = s.w + OUT;
        ctx.beginPath();
        ctx.moveTo(s.x0, s.y0);
        ctx.lineTo(s.x1, s.y1);
        ctx.stroke();
      }
      var H = { x: pts[0].x + ox, y: pts[0].y + oy };
      var HR = 0.48;
      ctx.fillStyle = C.ink;
      ctx.beginPath();
      ctx.arc(H.x, H.y, HR + OUT / 2, 0, TAU);
      ctx.fill();

      // 舌头（在头的下面伸出来）
      var v = DIRS[state === 'ready' ? dir : headDir()];
      var dead = state === 'over' && !won;
      var tk = 0;
      if (dead) tk = 0.7;
      else if (!REDUCED && state !== 'paused') {
        var ph = (t % 2600) / 320;
        if (ph < 1) tk = Math.sin(ph * Math.PI);
      }
      if (tk > 0.05) {
        var px0 = -v[1], py0 = v[0];
        var b0 = 0.4, tip = 0.55 + 0.3 * tk, fk = 0.11 * tk;
        var tx = H.x + v[0] * tip, ty = H.y + v[1] * tip;
        ctx.beginPath();
        ctx.moveTo(H.x + v[0] * b0, H.y + v[1] * b0);
        ctx.lineTo(tx, ty);
        ctx.lineTo(tx + v[0] * fk + px0 * fk * 0.8, ty + v[1] * fk + py0 * fk * 0.8);
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx + v[0] * fk - px0 * fk * 0.8, ty + v[1] * fk - py0 * fk * 0.8);
        ctx.strokeStyle = C.ink;
        ctx.lineWidth = 0.15;
        ctx.stroke();
        ctx.strokeStyle = C.tongue;
        ctx.lineWidth = 0.065;
        ctx.stroke();
      }

      ctx.strokeStyle = C.snake;
      for (i = 0; i < segs.length; i++) {
        s = segs[i];
        ctx.lineWidth = s.w;
        ctx.beginPath();
        ctx.moveTo(s.x0, s.y0);
        ctx.lineTo(s.x1, s.y1);
        ctx.stroke();
      }
      // 身上的浅色圆斑（随身体粗细缩放）
      ctx.fillStyle = C['snake-belly'];
      var acc2 = 0;
      for (i = pts.length - 2; i >= 1; i--) {
        var c = pts[i];
        var nx0 = pts[i + 1];
        acc2 += Math.abs(c.x - nx0.x) + Math.abs(c.y - nx0.y);
        var r = W * (0.45 + 0.55 * Math.min(1, acc2 / 3)) * (i % 2 ? 0.2 : 0.14);
        ctx.beginPath();
        ctx.arc(c.x + ox, c.y + oy, r, 0, TAU);
        ctx.fill();
      }

      // 头
      ctx.fillStyle = C.snake;
      ctx.beginPath();
      ctx.arc(H.x, H.y, HR, 0, TAU);
      ctx.fill();

      var px = -v[1], py = v[0];
      // 腮红
      ctx.fillStyle = C.blush;
      for (var e = -1; e <= 1; e += 2) {
        ctx.beginPath();
        ctx.arc(H.x - v[0] * 0.14 + px * 0.3 * e, H.y - v[1] * 0.14 + py * 0.3 * e, 0.085, 0, TAU);
        ctx.fill();
      }
      for (e = -1; e <= 1; e += 2) {
        var ex = H.x + v[0] * 0.1 + px * 0.21 * e;
        var ey = H.y + v[1] * 0.1 + py * 0.21 * e;
        ctx.lineWidth = 0.055;
        ctx.strokeStyle = C.ink;
        if (dead) {
          ctx.lineWidth = 0.075;
          ctx.beginPath();
          ctx.moveTo(ex - 0.1, ey - 0.1); ctx.lineTo(ex + 0.1, ey + 0.1);
          ctx.moveTo(ex + 0.1, ey - 0.1); ctx.lineTo(ex - 0.1, ey + 0.1);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(ex, ey, 0.185, 0, TAU);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = C.ink;
          ctx.beginPath();
          ctx.arc(ex + v[0] * 0.075, ey + v[1] * 0.075, 0.095, 0, TAU);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(ex + v[0] * 0.075 - 0.035, ey + v[1] * 0.075 - 0.04, 0.032, 0, TAU);
          ctx.fill();
        }
      }
    }

    // 头的朝向：取最近一步实际移动的方向
    function headDir() {
      var a = snake[0], b = snake[1];
      var dx = a.x - b.x, dy = a.y - b.y;
      if (dx > 1) dx = -1; else if (dx < -1) dx = 1;
      if (dy > 1) dy = -1; else if (dy < -1) dy = 1;
      if (dx === 1) return 'right';
      if (dx === -1) return 'left';
      if (dy === 1) return 'down';
      return 'up';
    }

    // 吃到苹果：星星迸开 + “+1” 飘起
    var FX_MS = 560;
    function star(g, x, y, r) {
      g.beginPath();
      for (var i = 0; i < 10; i++) {
        var a = -Math.PI / 2 + i * Math.PI / 5;
        var rr = i % 2 ? r * 0.45 : r;
        if (i) g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        else g.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      g.closePath();
    }

    function drawEffects(t, s) {
      for (var i = effects.length - 1; i >= 0; i--) {
        var fx = effects[i];
        var p = (t - fx.t) / FX_MS;
        if (p >= 1 || REDUCED) { effects.splice(i, 1); continue; }
        var cx = fx.x + 0.5, cy = fx.y + 0.5;
        var out = 1 - Math.pow(1 - p, 3);
        ctx.lineJoin = 'round';
        // 白色冲击圈
        if (p < 0.45) {
          ctx.globalAlpha = 1 - p / 0.45;
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 0.12 * (1 - p / 0.45) + 0.02;
          ctx.beginPath();
          ctx.arc(cx, cy, 0.3 + out * 0.7, 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        // 星星
        var sz = 0.3 * (1 - p * 0.75);
        for (var k = 0; k < 6; k++) {
          var ang = k / 6 * TAU + 0.3 + p * 1.2;
          var d = 0.4 + out * 0.75;
          star(ctx, cx + Math.cos(ang) * d, cy + Math.sin(ang) * d, k % 2 ? sz * 0.75 : sz);
          ctx.fillStyle = k % 2 ? '#fff' : C.theme;
          ctx.fill();
          ctx.strokeStyle = C.ink;
          ctx.lineWidth = 0.06;
          ctx.stroke();
        }
      }
      // “+1” 用像素坐标画，避免小数字号
      if (!effects.length) return;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      for (i = 0; i < effects.length; i++) {
        var q = (t - effects[i].t) / FX_MS;
        var pop = q < 0.25 ? easeOutBack(q / 0.25) : 1;
        var x = (effects[i].x + 0.5) * s;
        var y = (effects[i].y + 0.5 - 0.45 - q * 0.9) * s;
        if (y < s * 0.45) y = s * 0.45;
        x = Math.max(s * 0.7, Math.min(canvas.width - s * 0.7, x));
        ctx.globalAlpha = q < 0.6 ? 1 : 1 - (q - 0.6) / 0.4;
        ctx.font = '700 ' + Math.round(s * 0.8 * pop) + 'px Fredoka, "PingFang SC", system-ui, sans-serif';
        ctx.lineWidth = Math.max(2, s * 0.16);
        ctx.strokeStyle = C.ink;
        ctx.strokeText('+1', x, y);
        ctx.fillStyle = C.theme;
        ctx.fillText('+1', x, y);
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function draw(t) {
      if (!canvas.width) return;
      if (bgDirty) buildBg();
      var s = canvas.width / N;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(bgCanvas, 0, 0);

      var shake = 0;
      if (state === 'over' && !won && !REDUCED) {
        var age = t - deadAt;
        if (age < 360) shake = Math.sin(age / 18) * 0.14 * (1 - age / 360);
      }
      ctx.setTransform(s, 0, 0, s, shake * s, 0);

      drawApple(t);

      var a = 1;
      if (state === 'playing' || state === 'paused') a = Math.min(1, acc / interval());
      if (REDUCED) a = 1;
      if (wrap) {
        for (var ox = -N; ox <= N; ox += N)
          for (var oy = -N; oy <= N; oy += N) drawSnake(a, t, ox, oy);
      } else {
        drawSnake(a, t, 0, 0);
      }

      ctx.setTransform(s, 0, 0, s, 0, 0);
      drawEffects(t, s);
    }

    // ---------- 主循环（固定步长） ----------
    var lastT = 0;
    function frame(t) {
      var dt = lastT ? Math.min(t - lastT, 250) : 0;
      lastT = t;
      if (state === 'playing' && !manual) {
        acc += dt;
        var iv = interval();
        while (state === 'playing' && acc >= iv) {
          acc -= iv;
          step();
          iv = interval();
        }
      }
      draw(t);
      requestAnimationFrame(frame);
    }

    // ---------- 输入 ----------
    var KEYMAP = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', s: 'down', a: 'left', d: 'right',
      W: 'up', S: 'down', A: 'left', D: 'right'
    };

    document.addEventListener('keydown', function (e) {
      if (document.querySelector('dialog[open]')) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      var d = KEYMAP[e.key];
      if (d) {
        e.preventDefault();
        turn(d);
        return;
      }
      if (e.key === ' ' || e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        if (e.repeat) return;
        if (state === 'over') { if (e.key === ' ') start(); return; }
        togglePause();
      }
    });

    // 棋盘上滑动：移动够距离就转向，一次手势可连续转多次
    var swipe = null;
    stageEl.addEventListener('pointerdown', function (e) {
      if (e.target.closest('button')) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      swipe = { x: e.clientX, y: e.clientY, id: e.pointerId };
      try { stageEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    stageEl.addEventListener('pointermove', function (e) {
      if (!swipe || e.pointerId !== swipe.id) return;
      var dx = e.clientX - swipe.x;
      var dy = e.clientY - swipe.y;
      var ax = Math.abs(dx), ay = Math.abs(dy);
      if (Math.max(ax, ay) < 18) return;
      turn(ax > ay ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      swipe.x = e.clientX;
      swipe.y = e.clientY;
    });
    function endSwipe() { swipe = null; }
    stageEl.addEventListener('pointerup', endSwipe);
    stageEl.addEventListener('pointercancel', endSwipe);
    stageEl.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

    // 方向键盘：按下即响应
    var dpad = document.getElementById('dpad');
    dpad.addEventListener('pointerdown', function (e) {
      var b = e.target.closest('[data-dir]');
      if (!b) return;
      e.preventDefault();
      b.classList.add('on');
      turn(b.getAttribute('data-dir'));
    });
    function dpadUp(e) {
      var b = e.target.closest && e.target.closest('[data-dir]');
      if (b) b.classList.remove('on');
    }
    dpad.addEventListener('pointerup', dpadUp);
    dpad.addEventListener('pointercancel', dpadUp);
    dpad.addEventListener('pointerout', dpadUp);
    dpad.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
    dpad.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    stageEl.addEventListener('click', function (e) {
      var b = e.target.closest('[data-action]');
      if (!b) return;
      var act = b.getAttribute('data-action');
      if (act === 'start' || act === 'restart') start();
      else if (act === 'resume') resume();
      b.blur();
    });

    pauseBtn.addEventListener('click', function () { togglePause(); pauseBtn.blur(); });

    // ---------- 新游戏弹窗：速度 + 穿墙 ----------
    var SPEED_NAME = { slow: '慢速', mid: '中速', fast: '快速' };
    var SPEED_ICON = { slow: '🐢', mid: '🐇', fast: '🚀' };
    var GEAR = '<svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';

    function syncControls() {
      var btns = speedChoices.querySelectorAll('[data-speed]');
      for (var i = 0; i < btns.length; i++) {
        var k = btns[i].getAttribute('data-speed');
        btns[i].setAttribute('aria-pressed', k === speed ? 'true' : 'false');
        btns[i].querySelector('small').textContent = '最高 ' + (bestMap[k + (wrap ? '_wrap' : '')] || 0);
      }
      wrapSw.checked = wrap;
      var label = SPEED_NAME[speed] + ' · ' + (wrap ? '穿墙' : '撞墙');
      for (var j = 0; j < modeChips.length; j++) {
        modeChips[j].innerHTML = '<span aria-hidden="true">' + SPEED_ICON[speed] + '</span>' +
          SPEED_NAME[speed] + '<span class="dotsep">·</span>' + (wrap ? '穿墙' : '撞墙') + GEAR;
        modeChips[j].setAttribute('aria-label', '设置：' + label);
        modeChips[j].title = '设置';
      }
    }

    // 选速度：立即生效，回到开始卡片并关闭弹窗
    speedChoices.addEventListener('click', function (e) {
      var b = e.target.closest('[data-speed]');
      if (!b) return;
      speed = b.getAttribute('data-speed');
      store.set(KEY_SPEED, speed);
      sound('select');
      syncControls();
      reset();
      window.Site.closeDialog('newgame');
    });

    // 穿墙开关：立即生效，弹窗保持打开（还能接着选速度）
    wrapSw.addEventListener('change', function () {
      wrap = wrapSw.checked;
      store.set(KEY_WRAP, wrap);
      sound('select');
      syncControls();
      reset();
    });

    // 自动暂停：切到后台、打开说明
    document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });
    document.querySelector('[data-open="help"]').addEventListener('click', pause);

    // 主题与尺寸变化
    document.addEventListener('themechange', readColors);
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', readColors);
    else if (mq.addListener) mq.addListener(readColors);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
    window.addEventListener('resize', resize);

    // 测试钩子
    window.__snake = {
      get state() { return state; },
      get snake() { return snake.map(function (c) { return { x: c.x, y: c.y }; }); },
      get food() { return food && { x: food.x, y: food.y }; },
      get dir() { return dir; },
      get queue() { return queue.slice(); },
      get score() { return score; },
      get interval() { return interval(); },
      N: N,
      set manual(v) { manual = !!v; },
      get manual() { return manual; },
      step: function () { if (state === 'playing') step(); },
      turn: turn,
      start: start,
      pause: pause,
      resume: resume,
      setSnake: function (cells, d) { snake = cells.map(function (c) { return { x: c.x, y: c.y }; }); prev = snake.slice(); dir = d || dir; queue = []; },
      setFood: function (x, y) { food = { x: x, y: y }; foodBorn = 0; }
    };

    readColors();
    syncControls();
    reset();
    syncHomeStat();
    resize();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
