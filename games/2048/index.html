<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>2048 · 游戏来了</title>
  <meta name="description" content="在线玩 2048：滑动合并相同数字，凑出 2048 方块。支持键盘和手机滑动，可撤销，自动保存进度。">
  <meta name="theme-color" content="#f7f2ea">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='6' fill='%23edc22e'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='900' font-size='10' fill='white' text-anchor='middle'%3E2048%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/site.css">
  <script src="../../assets/site.js"></script>
  <style>
    :root {
      --board: #ffb877;
      --cell: #ffe1c2;
      --slide: 110ms;
      /* 棋盘尽量大：宽度受屏宽限制，高度给顶栏 + 数据条留位置 */
      --stage-max: min(540px, max(300px, calc(100vh - 190px)));
    }
    @supports (height: 100dvh) {
      :root { --stage-max: min(540px, max(300px, calc(100dvh - 190px))); }
    }

    /* 宽屏且足够高时整列垂直居中 */
    @media (min-width: 600px) and (min-height: 560px) {
      body.game-page { justify-content: center; }
    }

    /* 数据条：按钮与数据块等高 */
    .stats { align-items: stretch; }
    .stats .btns .btn { height: auto; min-height: 48px; }
    /* 撤销：图标在上、小字在下，各种屏宽都一样，给分数留出宽度 */
    #undo { flex-direction: column; gap: 1px; padding: 0 12px; }
    #undo svg { display: block; flex: none; width: 20px; height: 20px; }
    #undo .lbl { font-size: 12px; line-height: 1.2; letter-spacing: 0.06em; }
    /* 位数多时在窄屏上缩小字号，避免省略号 */
    .stat-value { line-height: 26px; }
    @media (max-width: 380px) { .stat-value { line-height: 22px; } }
    @media (max-width: 420px) { .stat-value.l6 { font-size: 16px; } }
    @media (max-width: 340px) { .stat-value.l5 { font-size: 16px; } .stat-value.l6 { font-size: 13px; } }

    /* 打破最高纪录：最高数据块弹一下 + 光圈 */
    .stat.beat { animation: beat 520ms cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes beat {
      0% { transform: scale(1); box-shadow: var(--pop-sm), 0 0 0 0 color-mix(in srgb, var(--theme-2) 80%, transparent); }
      40% { transform: scale(1.1) rotate(-2deg); box-shadow: var(--pop-sm), 0 0 0 6px color-mix(in srgb, var(--theme-2) 70%, transparent); }
      100% { transform: none; box-shadow: var(--pop-sm), 0 0 0 10px transparent; }
    }

    /* 结果卡里的小徽章 */
    .rec {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 8px 2px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--theme-2);
      color: #2d2a4a;
      font-size: 13px;
      font-weight: 700;
      vertical-align: 1px;
    }
    .overlay p { font-variant-numeric: tabular-nums; }
    /* 确认层：即时出现，不需要结果层的延迟 */
    #confirm, #confirm .overlay-card { animation-delay: 0ms; animation-duration: 220ms; }
    #confirm h2 { font-size: clamp(26px, 7.5vw, 34px); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --board: #5a3a2a; --cell: #6e4a37; }
    }
    :root[data-theme="dark"] { --board: #5a3a2a; --cell: #6e4a37; }

    .score-add {
      position: absolute;
      left: 0;
      right: 0;
      top: 14px;
      font-size: 20px;
      font-weight: 700;
      color: var(--theme);
      -webkit-text-stroke: 1px var(--ink);
      paint-order: stroke fill;
      pointer-events: none;
      animation: float-up 700ms ease-out forwards;
    }
    @keyframes float-up {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to { transform: translateY(-38px) scale(1.15); opacity: 0; }
    }

    /* 棋盘：粗描边的卡通托盘 */
    .board {
      --gap: clamp(8px, 2.6vw, 12px);
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      padding: var(--gap);
      border: var(--outline);
      border-radius: 22px;
      background: var(--board);
      box-shadow: var(--shadow-lg);
      container-type: inline-size;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
    }
    .board:focus-visible { outline: 3px solid var(--theme); outline-offset: 4px; }
    .cells {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: var(--gap);
      width: 100%;
      height: 100%;
    }
    .cells span {
      border-radius: 12px;
      background: var(--cell);
      box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.08);
    }
    .tiles { position: absolute; inset: var(--gap); }

    .tile {
      position: absolute;
      top: 0;
      left: 0;
      width: calc((100% - 3 * var(--gap)) / 4);
      height: calc((100% - 3 * var(--gap)) / 4);
      transform: translate(calc(var(--c) * (100% + var(--gap))), calc(var(--r) * (100% + var(--gap))));
      transition: transform var(--slide) ease-in-out;
      z-index: 1;
    }
    .tile.merged { z-index: 2; }
    .tile-inner {
      --tc: #fff3d6;
      width: 100%;
      height: calc(100% - 4px);
      display: grid;
      place-items: center;
      border: var(--outline);
      border-radius: 12px;
      font-weight: 700;
      font-size: 44px;
      font-size: 12cqw;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      background: var(--tc);
      color: #2d2a4a;
      box-shadow: 0 4px 0 var(--ink), inset 0 -5px 0 rgba(0, 0, 0, 0.12), inset 0 4px 0 rgba(255, 255, 255, 0.45);
    }
    .tile.new .tile-inner { animation: appear 220ms cubic-bezier(.2, 1.5, .4, 1) 60ms backwards; }
    .tile.pop .tile-inner { animation: pop 200ms ease; }
    @keyframes appear {
      from { transform: scale(0) rotate(-12deg); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2) rotate(3deg); }
      100% { transform: scale(1); }
    }

    .d3 .tile-inner { font-size: 36px; font-size: 9.6cqw; }
    .d4 .tile-inner { font-size: 28px; font-size: 7.4cqw; }
    .d5 .tile-inner { font-size: 22px; font-size: 5.8cqw; }
    .d6 .tile-inner { font-size: 18px; font-size: 4.8cqw; }

    /* 每个数字一种糖果色 */
    .v2 .tile-inner { --tc: #fff3d6; }
    .v4 .tile-inner { --tc: #ffe08a; }
    .v8 .tile-inner { --tc: #ffb35c; color: #fff; }
    .v16 .tile-inner { --tc: #ff8a3d; color: #fff; }
    .v32 .tile-inner { --tc: #ff6b6b; color: #fff; }
    .v64 .tile-inner { --tc: #ff4757; color: #fff; }
    .v128 .tile-inner { --tc: #ffd23f; }
    .v256 .tile-inner { --tc: #a3e048; }
    .v512 .tile-inner { --tc: #3fd0a8; color: #fff; }
    .v1024 .tile-inner { --tc: #4dabff; color: #fff; }
    .v2048 .tile-inner { --tc: #a66bff; color: #fff; }
    .vsuper .tile-inner { --tc: #2d2a4a; color: #ffd23f; }
    .v8 .tile-inner, .v16 .tile-inner, .v32 .tile-inner, .v64 .tile-inner,
    .v512 .tile-inner, .v1024 .tile-inner, .v2048 .tile-inner {
      -webkit-text-stroke: 2px #2d2a4a;
      paint-order: stroke fill;
    }

    @media (prefers-reduced-motion: reduce) {
      :root { --slide: 0ms; }
    }
  </style>
</head>
<body class="game-page" data-game="2048">
  <header class="gbar">
    <a class="icon-btn" href="../../" aria-label="返回游戏大厅" title="返回游戏大厅">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="gbar-title">2048</h1>
    <div class="gbar-actions">
      <button class="icon-btn sound-toggle" type="button" aria-label="关闭声音">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
      </button>
      <button class="icon-btn" type="button" data-open="help" aria-label="玩法说明" title="玩法说明">?</button>
    </div>
  </header>

  <main class="gmain">
    <div class="stats">
      <div class="stat" id="score-box"><span class="stat-label">分数</span><span class="stat-value" id="score">0</span></div>
      <div class="stat" id="best-box"><span class="stat-label">最高</span><span class="stat-value" id="best">0</span></div>
      <div class="btns">
        <button class="btn" type="button" id="undo" title="撤销 (Ctrl+Z)" aria-label="撤销">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          <span class="lbl">撤销</span>
        </button>
        <button class="btn primary" type="button" id="new-game">新游戏</button>
      </div>
    </div>

    <div class="stage">
      <div class="board" id="board" tabindex="0" aria-label="2048 棋盘，使用方向键或滑动操作">
        <div class="cells" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="tiles" id="tiles" aria-hidden="true"></div>

        <div class="overlay" id="over" hidden>
          <h2>游戏结束</h2>
          <p id="over-text">得分 0</p>
          <div class="row">
            <button class="btn" type="button" data-action="undo">撤销</button>
            <button class="btn primary" type="button" data-action="new">再来一局</button>
          </div>
        </div>

        <div class="overlay" id="win" hidden>
          <h2>你赢了！</h2>
          <p id="win-text">得分 0</p>
          <div class="row">
            <button class="btn" type="button" data-action="new">再来一局</button>
            <button class="btn primary" type="button" data-action="continue">继续挑战</button>
          </div>
        </div>

        <div class="overlay" id="confirm" hidden>
          <h2>重新开始？</h2>
          <p>当前进度会丢失</p>
          <div class="row">
            <button class="btn" type="button" data-action="cancel">取消</button>
            <button class="btn primary" type="button" data-action="restart">重新开始</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <dialog class="sheet" id="help">
    <div class="sheet-head">
      <h2>怎么玩</h2>
      <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <ul class="tips">
        <li><b>👆</b><span>滑动屏幕或按 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>WASD</kbd>，所有方块一起移动。</span></li>
        <li><b>➕</b><span>相同数字相撞会<strong>合并翻倍</strong>，每步随机出现一个 2 或 4。</span></li>
        <li><b>🏆</b><span>拼出 <strong>2048</strong> 就赢了，还能继续冲更高分。</span></li>
        <li><b>↶</b><span>走错了可以撤销，<kbd>Ctrl</kbd>+<kbd>Z</kbd> 也行。</span></li>
      </ul>
      <p style="margin:18px 0 0"><button class="btn block theme-toggle" type="button">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        切换深色 / 浅色
      </button></p>
    </div>
  </dialog>

  <script>
  (function () {
    'use strict';

    var SIZE = 4;
    var WIN_VALUE = 2048;
    var MAX_HISTORY = 30;
    var SLIDE_MS = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 110;
    var KEY_STATE = 'gzly.2048.state';
    var KEY_BEST = 'gzly.2048.best';
    var store = window.Site.store;
    var sound = window.Site.sound;

    var boardEl = document.getElementById('board');
    var tilesEl = document.getElementById('tiles');
    var scoreEl = document.getElementById('score');
    var scoreBoxEl = document.getElementById('score-box');
    var bestEl = document.getElementById('best');
    var undoBtn = document.getElementById('undo');
    var overEl = document.getElementById('over');
    var winEl = document.getElementById('win');
    var confirmEl = document.getElementById('confirm');
    var bestBoxEl = document.getElementById('best-box');

    // 游戏状态
    var grid;           // grid[r][c] = tile | null
    var score = 0;
    var best = store.get(KEY_BEST, 0) || 0;
    var won = false;          // 是否已经拼出过 2048
    var keepPlaying = false;  // 胜利后选择继续
    var over = false;
    var history = [];
    var nextId = 1;
    var pending = null;       // 滑动动画结束后要执行的收尾
    var prevBest = best;      // 本局开始前的最高分
    var celebrated = false;   // 本局是否已庆祝过破纪录

    window.Site.played('2048');

    function emptyGrid() {
      var g = [];
      for (var r = 0; r < SIZE; r++) {
        g.push([]);
        for (var c = 0; c < SIZE; c++) g[r].push(null);
      }
      return g;
    }

    function eachTile(fn) {
      for (var r = 0; r < SIZE; r++)
        for (var c = 0; c < SIZE; c++)
          if (grid[r][c]) fn(grid[r][c]);
    }

    function emptyCells() {
      var list = [];
      for (var r = 0; r < SIZE; r++)
        for (var c = 0; c < SIZE; c++)
          if (!grid[r][c]) list.push([r, c]);
      return list;
    }

    // ---------- 渲染 ----------
    function valueClass(v) { return v > WIN_VALUE ? 'vsuper' : 'v' + v; }

    function paint(tile) {
      var el = tile.el;
      var digits = String(tile.value).length;
      el.className = 'tile ' + valueClass(tile.value) + (digits >= 3 ? ' d' + Math.min(digits, 6) : '');
      el.firstChild.textContent = tile.value;
    }

    function place(tile) {
      tile.el.style.setProperty('--r', tile.r);
      tile.el.style.setProperty('--c', tile.c);
    }

    function createTile(r, c, value, animate) {
      var el = document.createElement('div');
      var inner = document.createElement('div');
      inner.className = 'tile-inner';
      el.appendChild(inner);
      var tile = { id: nextId++, r: r, c: c, value: value, el: el, merged: false };
      paint(tile);
      place(tile);
      if (animate) el.classList.add('new');
      tilesEl.appendChild(el);
      grid[r][c] = tile;
      return tile;
    }

    function addRandomTile() {
      var cells = emptyCells();
      if (!cells.length) return;
      var pick = cells[Math.floor(Math.random() * cells.length)];
      createTile(pick[0], pick[1], Math.random() < 0.9 ? 2 : 4, true);
    }

    function setNum(el, n) {
      var len = String(n).length;
      el.textContent = n;
      el.classList.toggle('l5', len === 5);
      el.classList.toggle('l6', len >= 6);
    }

    function updateScore(gained) {
      setNum(scoreEl, score);
      if (score > best) {
        best = score;
        store.set(KEY_BEST, best);
      }
      setNum(bestEl, best);
      if (best > 0) window.Site.setHomeStat('2048', '最高 ' + best);
      if (!celebrated && prevBest > 0 && score > prevBest) {
        celebrated = true;
        bestBoxEl.classList.remove('beat');
        void bestBoxEl.offsetWidth;
        bestBoxEl.classList.add('beat');
      }
      if (gained > 0 && SLIDE_MS > 0) {
        var add = document.createElement('span');
        add.className = 'score-add';
        add.textContent = '+' + gained;
        scoreBoxEl.appendChild(add);
        setTimeout(function () { add.remove(); }, 700);
      }
    }

    function updateButtons() {
      undoBtn.disabled = history.length === 0;
    }

    function showOverlays() {
      winEl.hidden = !(won && !keepPlaying && !over);
      overEl.hidden = !over;
      if (over || won) {
        var html = '得分 ' + score + (score > prevBest ? '<span class="rec">新纪录</span>' : '');
        document.getElementById(over ? 'over-text' : 'win-text').innerHTML = html;
      }
    }

    // ---------- 重新开始确认 ----------
    function inProgress() {
      return score > 0 && !over && !(won && !keepPlaying);
    }

    function askNewGame() {
      finishPending();
      if (!inProgress()) { sound('start'); newGame(); return; }
      confirmEl.hidden = false;
      confirmEl.querySelector('[data-action="restart"]').focus({ preventScroll: true });
    }

    function closeConfirm() {
      if (confirmEl.hidden) return;
      confirmEl.hidden = true;
      boardEl.focus({ preventScroll: true });
    }

    // ---------- 存档 ----------
    function cellsSnapshot() {
      var cells = [];
      for (var r = 0; r < SIZE; r++)
        for (var c = 0; c < SIZE; c++)
          cells.push(grid[r][c] ? grid[r][c].value : 0);
      return cells;
    }

    function snapshot() {
      return { cells: cellsSnapshot(), score: score, won: won, keepPlaying: keepPlaying };
    }

    function save() {
      store.set(KEY_STATE, {
        cells: cellsSnapshot(),
        score: score,
        won: won,
        keepPlaying: keepPlaying,
        over: over,
        history: history.slice(-MAX_HISTORY)
      });
    }

    function load(state) {
      tilesEl.textContent = '';
      grid = emptyGrid();
      for (var i = 0; i < SIZE * SIZE; i++) {
        var v = state.cells[i];
        if (v) createTile(Math.floor(i / SIZE), i % SIZE, v, true);
      }
      score = state.score || 0;
      won = !!state.won;
      keepPlaying = !!state.keepPlaying;
      over = !movesAvailable();
    }

    function isValidState(s) {
      return s && Array.isArray(s.cells) && s.cells.length === SIZE * SIZE &&
        s.cells.every(function (v) { return v === 0 || (typeof v === 'number' && v >= 2 && (v & (v - 1)) === 0); });
    }

    // ---------- 规则 ----------
    function movesAvailable() {
      for (var r = 0; r < SIZE; r++) {
        for (var c = 0; c < SIZE; c++) {
          var t = grid[r][c];
          if (!t) return true;
          if (c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].value === t.value) return true;
          if (r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].value === t.value) return true;
        }
      }
      return false;
    }

    var VECTORS = {
      up: [-1, 0],
      down: [1, 0],
      left: [0, -1],
      right: [0, 1]
    };

    function move(dir) {
      finishPending();
      if (over || (won && !keepPlaying) || !confirmEl.hidden) return;

      var dr = VECTORS[dir][0];
      var dc = VECTORS[dir][1];
      var before = snapshot();
      var next = emptyGrid();
      var removed = [];
      var mergedTiles = [];
      var gained = 0;
      var moved = false;

      for (var line = 0; line < SIZE; line++) {
        // 沿移动方向，从最靠前的格子开始处理
        var cells = [];
        for (var i = 0; i < SIZE; i++) {
          var k = (dr === 1 || dc === 1) ? SIZE - 1 - i : i;
          cells.push(dr !== 0 ? [k, line] : [line, k]);
        }

        var slot = 0;
        var last = null;
        for (var j = 0; j < SIZE; j++) {
          var t = grid[cells[j][0]][cells[j][1]];
          if (!t) continue;
          if (last && !last.merged && last.value === t.value) {
            last.value *= 2;
            last.merged = true;
            gained += last.value;
            t.r = last.r;
            t.c = last.c;
            removed.push(t);
            mergedTiles.push(last);
            moved = true;
          } else {
            var pos = cells[slot++];
            if (t.r !== pos[0] || t.c !== pos[1]) moved = true;
            t.r = pos[0];
            t.c = pos[1];
            next[pos[0]][pos[1]] = t;
            last = t;
          }
        }
      }

      if (!moved) return;

      history.push(before);
      if (history.length > MAX_HISTORY) history.shift();

      grid = next;
      score += gained;

      eachTile(function (t) { t.el.classList.remove('new', 'pop'); place(t); });
      removed.forEach(function (t) { t.el.classList.remove('new', 'pop'); place(t); });

      if (mergedTiles.length) {
        var top = 0;
        mergedTiles.forEach(function (t) { top = Math.max(top, t.value); });
        sound('merge', Math.log(top) / Math.LN2);
      } else {
        sound('move');
      }

      updateScore(gained);
      updateButtons();

      pending = {
        run: function () {
          var wasWon = won;
          removed.forEach(function (t) { t.el.remove(); });
          mergedTiles.forEach(function (t) {
            t.merged = false;
            paint(t);
            t.el.classList.add('merged');
            void t.el.offsetWidth; // 重新触发动画
            t.el.classList.add('pop');
            if (t.value >= WIN_VALUE && !won) won = true;
          });
          addRandomTile();
          over = !movesAvailable();
          if (won && !wasWon) sound('win');
          else if (over) sound('lose');
          showOverlays();
          save();
        }
      };
      pending.timer = setTimeout(finishPending, SLIDE_MS);
    }

    function finishPending() {
      if (!pending) return;
      var p = pending;
      pending = null;
      clearTimeout(p.timer);
      p.run();
    }

    // ---------- 操作 ----------
    function newGame() {
      finishPending();
      tilesEl.textContent = '';
      grid = emptyGrid();
      score = 0;
      won = false;
      keepPlaying = false;
      over = false;
      history = [];
      prevBest = best;
      celebrated = false;
      bestBoxEl.classList.remove('beat');
      confirmEl.hidden = true;
      addRandomTile();
      addRandomTile();
      updateScore(0);
      updateButtons();
      showOverlays();
      save();
    }

    function undo() {
      if (!confirmEl.hidden) return;
      finishPending();
      var prev = history.pop();
      if (!prev) return;
      sound('click');
      load(prev);
      updateScore(0);
      updateButtons();
      showOverlays();
      save();
    }

    function continuePlaying() {
      keepPlaying = true;
      showOverlays();
      save();
      boardEl.focus({ preventScroll: true });
    }

    // 键盘
    var KEYMAP = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', s: 'down', a: 'left', d: 'right',
      W: 'up', S: 'down', A: 'left', D: 'right'
    };

    document.addEventListener('keydown', function (e) {
      if (document.querySelector('dialog[open]')) return;
      if (!confirmEl.hidden) {
        if (e.key === 'Escape') { e.preventDefault(); closeConfirm(); }
        else if (KEYMAP[e.key]) e.preventDefault();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        undo();
        return;
      }
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      var dir = KEYMAP[e.key];
      if (!dir) return;
      e.preventDefault();
      move(dir);
    });

    // 触摸 / 鼠标滑动
    var start = null;
    boardEl.addEventListener('pointerdown', function (e) {
      if (e.target.closest('button, .overlay')) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      start = { x: e.clientX, y: e.clientY, id: e.pointerId };
      try { boardEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });

    function endSwipe(e) {
      if (!start || e.pointerId !== start.id) return;
      var dx = e.clientX - start.x;
      var dy = e.clientY - start.y;
      start = null;
      var ax = Math.abs(dx);
      var ay = Math.abs(dy);
      if (Math.max(ax, ay) < 24) return;
      if (ax > ay) move(dx > 0 ? 'right' : 'left');
      else move(dy > 0 ? 'down' : 'up');
    }
    boardEl.addEventListener('pointerup', endSwipe);
    boardEl.addEventListener('pointercancel', function () { start = null; });

    // iOS 旧版本兜底：阻止棋盘上的页面滚动
    boardEl.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

    document.getElementById('new-game').addEventListener('click', askNewGame);
    undoBtn.addEventListener('click', undo);
    boardEl.addEventListener('click', function (e) {
      if (e.target === confirmEl) { closeConfirm(); return; }
      var btn = e.target.closest('[data-action]');
      if (!btn) return;
      var action = btn.getAttribute('data-action');
      if (action === 'new' || action === 'restart') { sound('start'); newGame(); boardEl.focus({ preventScroll: true }); }
      else if (action === 'cancel') closeConfirm();
      else if (action === 'undo') undo();
      else if (action === 'continue') continuePlaying();
    });

    // ---------- 启动 ----------
    var saved = store.get(KEY_STATE, null);
    if (isValidState(saved) && saved.cells.some(Boolean)) {
      history = Array.isArray(saved.history) ? saved.history.filter(isValidState).slice(-MAX_HISTORY) : [];
      load(saved);
      if (score > 0 && score >= best) { prevBest = 0; celebrated = true; }
      updateScore(0);
      updateButtons();
      showOverlays();
    } else {
      newGame();
    }
  })();
  </script>
</body>
</html>
