<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>2048 · 格子乐园</title>
  <meta name="description" content="在线玩 2048：滑动合并相同数字，凑出 2048 方块。支持键盘和手机滑动，可撤销，自动保存进度。">
  <meta name="theme-color" content="#f7f2ea">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='6' fill='%23edc22e'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='900' font-size='10' fill='white' text-anchor='middle'%3E2048%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/site.css">
  <script src="../../assets/site.js"></script>
  <style>
    :root {
      --board: #bbada0;
      --cell: rgba(238, 228, 218, 0.38);
      --tile-ink: #776e65;
      --slide: 110ms;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --board: #3d342d; --cell: #4b4139; }
    }
    :root[data-theme="dark"] { --board: #3d342d; --cell: #4b4139; }

    .game {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: 8px;
    }

    .game-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0 14px;
    }
    .game-title {
      margin: 0;
      font-size: clamp(44px, 13vw, 68px);
      line-height: 1;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .scores { display: flex; gap: 8px; }
    .score-box {
      position: relative;
      min-width: 76px;
      padding: 6px 12px 7px;
      border-radius: 12px;
      background: var(--board);
      color: #fff;
      text-align: center;
    }
    .score-box .label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.78);
      letter-spacing: 0.08em;
    }
    .score-box .value {
      display: block;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }
    .score-add {
      position: absolute;
      left: 0;
      right: 0;
      top: 18px;
      font-size: 20px;
      font-weight: 900;
      color: var(--accent);
      pointer-events: none;
      animation: float-up 700ms ease-out forwards;
    }
    @keyframes float-up {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-40px); opacity: 0; }
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .toolbar p { margin: 0; color: var(--text-dim); font-size: 14px; }
    .toolbar p b { color: var(--text); }
    .toolbar .actions { display: flex; gap: 8px; flex: none; }

    /* 棋盘 */
    .board {
      --gap: clamp(8px, 2.6vw, 14px);
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      padding: var(--gap);
      border-radius: 14px;
      background: var(--board);
      container-type: inline-size;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
    }
    .board:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
    .cells {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: var(--gap);
      width: 100%;
      height: 100%;
    }
    .cells span { border-radius: 8px; background: var(--cell); }
    .tiles { position: absolute; inset: var(--gap); }

    .tile {
      position: absolute;
      top: 0;
      left: 0;
      width: calc((100% - 3 * var(--gap)) / 4);
      height: calc((100% - 3 * var(--gap)) / 4);
      transform: translate(calc(var(--c) * (100% + var(--gap))), calc(var(--r) * (100% + var(--gap))));
      transition: transform var(--slide) ease-in-out;
      z-index: 1;
    }
    .tile.merged { z-index: 2; }
    .tile-inner {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      border-radius: 8px;
      font-weight: 900;
      font-size: 44px;
      font-size: 11cqw;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      background: #eee4da;
      color: var(--tile-ink);
    }
    .tile.new .tile-inner { animation: appear 180ms ease 60ms backwards; }
    .tile.pop .tile-inner { animation: pop 180ms ease; }
    @keyframes appear {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    .d3 .tile-inner { font-size: 36px; font-size: 9cqw; }
    .d4 .tile-inner { font-size: 28px; font-size: 7cqw; }
    .d5 .tile-inner { font-size: 22px; font-size: 5.6cqw; }
    .d6 .tile-inner { font-size: 18px; font-size: 4.6cqw; }

    .v2 .tile-inner { background: #eee4da; }
    .v4 .tile-inner { background: #ede0c8; }
    .v8 .tile-inner { background: #f2b179; color: #fff; }
    .v16 .tile-inner { background: #f59563; color: #fff; }
    .v32 .tile-inner { background: #f67c5f; color: #fff; }
    .v64 .tile-inner { background: #f65e3b; color: #fff; }
    .v128 .tile-inner { background: #edcf72; color: #fff; box-shadow: 0 0 18px 2px rgba(243, 215, 116, 0.35); }
    .v256 .tile-inner { background: #edcc61; color: #fff; box-shadow: 0 0 20px 3px rgba(243, 215, 116, 0.42); }
    .v512 .tile-inner { background: #edc850; color: #fff; box-shadow: 0 0 22px 4px rgba(243, 215, 116, 0.5); }
    .v1024 .tile-inner { background: #edc53f; color: #fff; box-shadow: 0 0 24px 5px rgba(243, 215, 116, 0.56); }
    .v2048 .tile-inner { background: #edc22e; color: #fff; box-shadow: 0 0 28px 6px rgba(243, 215, 116, 0.62); }
    .vsuper .tile-inner { background: #3c3a32; color: #fff; }

    /* 结束 / 胜利浮层 */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-content: center;
      gap: 16px;
      text-align: center;
      border-radius: 14px;
      background: rgba(238, 228, 218, 0.78);
      color: #776e65;
      animation: fade-in 400ms ease 200ms backwards;
    }
    .overlay[hidden] { display: none; }
    .overlay.win { background: rgba(237, 194, 46, 0.82); color: #fff; text-shadow: 0 1px 3px rgba(120, 90, 0, 0.35); }
    .overlay .btn { text-shadow: none; }
    .overlay h2 { margin: 0; font-size: clamp(32px, 10vw, 52px); font-weight: 900; line-height: 1.1; }
    .overlay p { margin: 0; font-size: 16px; font-weight: 700; }
    .overlay .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    .help {
      margin-top: 20px;
      padding: 16px 18px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text-dim);
      font-size: 14px;
    }
    .help h2 { margin: 0 0 6px; font-size: 15px; color: var(--text); }
    .help p { margin: 0 0 6px; }
    .help p:last-child { margin-bottom: 0; }
    kbd {
      display: inline-block;
      min-width: 22px;
      padding: 0 5px;
      border-radius: 6px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    .back { gap: 6px; padding: 0 12px 0 10px; }
    .back svg { width: 18px; height: 18px; }

    @media (max-width: 380px) {
      .score-box { min-width: 64px; padding: 5px 8px 6px; }
      .score-box .value { font-size: 18px; }
      .toolbar p { font-size: 13px; }
      .btn { padding: 0 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      :root { --slide: 0ms; }
      .tile.new .tile-inner, .tile.pop .tile-inner, .overlay, .score-add { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="btn back" href="../../">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        游戏大厅
      </a>
      <div class="nav-actions">
        <button class="icon-btn theme-toggle" type="button" aria-label="切换深色/浅色模式" title="切换深色/浅色模式">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="game">
      <div class="game-head">
        <h1 class="game-title">2048</h1>
        <div class="scores">
          <div class="score-box" id="score-box">
            <span class="label">分数</span>
            <span class="value" id="score">0</span>
          </div>
          <div class="score-box">
            <span class="label">最高</span>
            <span class="value" id="best">0</span>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <p>合并数字，拼出 <b>2048</b>！</p>
        <div class="actions">
          <button class="btn" type="button" id="undo" title="撤销 (Ctrl+Z)">撤销</button>
          <button class="btn primary" type="button" id="new-game">新游戏</button>
        </div>
      </div>

      <div class="board" id="board" tabindex="0" aria-label="2048 棋盘，使用方向键或滑动操作">
        <div class="cells" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="tiles" id="tiles" aria-hidden="true"></div>

        <div class="overlay" id="over" hidden>
          <h2>游戏结束</h2>
          <p id="over-text">没有可以移动的格子了</p>
          <div class="row">
            <button class="btn" type="button" data-action="undo">撤销一步</button>
            <button class="btn primary" type="button" data-action="new">再来一局</button>
          </div>
        </div>

        <div class="overlay win" id="win" hidden>
          <h2>你赢了！</h2>
          <p>成功拼出 2048</p>
          <div class="row">
            <button class="btn primary" type="button" data-action="continue">继续挑战</button>
            <button class="btn" type="button" data-action="new">新游戏</button>
          </div>
        </div>
      </div>

      <section class="help">
        <h2>玩法</h2>
        <p>电脑：使用 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 移动方块，<kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销。手机：在棋盘上滑动。</p>
        <p>两个相同数字的方块相撞时会合并成一个，数值翻倍。每次移动后会随机出现一个新的 2 或 4。拼出 2048 即为胜利，之后还可以继续冲击更高分。</p>
      </section>
    </main>

    <footer class="footer">格子乐园 · 进度自动保存在本机浏览器</footer>
  </div>

  <script>
  (function () {
    'use strict';

    var SIZE = 4;
    var WIN_VALUE = 2048;
    var MAX_HISTORY = 30;
    var SLIDE_MS = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 110;
    var KEY_STATE = 'gzly.2048.state';
    var KEY_BEST = 'gzly.2048.best';
    var store = window.Site.store;

    var boardEl = document.getElementById('board');
    var tilesEl = document.getElementById('tiles');
    var scoreEl = document.getElementById('score');
    var scoreBoxEl = document.getElementById('score-box');
    var bestEl = document.getElementById('best');
    var undoBtn = document.getElementById('undo');
    var overEl = document.getElementById('over');
    var winEl = document.getElementById('win');

    // 游戏状态
    var grid;           // grid[r][c] = tile | null
    var score = 0;
    var best = store.get(KEY_BEST, 0) || 0;
    var won = false;          // 是否已经拼出过 2048
    var keepPlaying = false;  // 胜利后选择继续
    var over = false;
    var history = [];
    var nextId = 1;
    var pending = null;       // 滑动动画结束后要执行的收尾

    function emptyGrid() {
      var g = [];
      for (var r = 0; r < SIZE; r++) {
        g.push([]);
        for (var c = 0; c < SIZE; c++) g[r].push(null);
      }
      return g;
    }

    function eachTile(fn) {
      for (var r = 0; r < SIZE; r++)
        for (var c = 0; c < SIZE; c++)
          if (grid[r][c]) fn(grid[r][c]);
    }

    function emptyCells() {
      var list = [];
      for (var r = 0; r < SIZE; r++)
        for (var c = 0; c < SIZE; c++)
          if (!grid[r][c]) list.push([r, c]);
      return list;
    }

    // ---------- 渲染 ----------
    function valueClass(v) { return v > WIN_VALUE ? 'vsuper' : 'v' + v; }

    function paint(tile) {
      var el = tile.el;
      var digits = String(tile.value).length;
      el.className = 'tile ' + valueClass(tile.value) + (digits >= 3 ? ' d' + Math.min(digits, 6) : '');
      el.firstChild.textContent = tile.value;
    }

    function place(tile) {
      tile.el.style.setProperty('--r', tile.r);
      tile.el.style.setProperty('--c', tile.c);
    }

    function createTile(r, c, value, animate) {
      var el = document.createElement('div');
      var inner = document.createElement('div');
      inner.className = 'tile-inner';
      el.appendChild(inner);
      var tile = { id: nextId++, r: r, c: c, value: value, el: el, merged: false };
      paint(tile);
      place(tile);
      if (animate) el.classList.add('new');
      tilesEl.appendChild(el);
      grid[r][c] = tile;
      return tile;
    }

    function addRandomTile() {
      var cells = emptyCells();
      if (!cells.length) return;
      var pick = cells[Math.floor(Math.random() * cells.length)];
      createTile(pick[0], pick[1], Math.random() < 0.9 ? 2 : 4, true);
    }

    function updateScore(gained) {
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        store.set(KEY_BEST, best);
      }
      bestEl.textContent = best;
      if (gained > 0 && SLIDE_MS > 0) {
        var add = document.createElement('span');
        add.className = 'score-add';
        add.textContent = '+' + gained;
        scoreBoxEl.appendChild(add);
        setTimeout(function () { add.remove(); }, 700);
      }
    }

    function updateButtons() {
      undoBtn.disabled = history.length === 0;
    }

    function showOverlays() {
      winEl.hidden = !(won && !keepPlaying && !over);
      overEl.hidden = !over;
      if (over) {
        document.getElementById('over-text').textContent = '本局得分 ' + score + (score >= best && score > 0 ? '，刷新最高纪录！' : '');
      }
    }

    // ---------- 存档 ----------
    function cellsSnapshot() {
      var cells = [];
      for (var r = 0; r < SIZE; r++)
        for (var c = 0; c < SIZE; c++)
          cells.push(grid[r][c] ? grid[r][c].value : 0);
      return cells;
    }

    function snapshot() {
      return { cells: cellsSnapshot(), score: score, won: won, keepPlaying: keepPlaying };
    }

    function save() {
      store.set(KEY_STATE, {
        cells: cellsSnapshot(),
        score: score,
        won: won,
        keepPlaying: keepPlaying,
        over: over,
        history: history.slice(-MAX_HISTORY)
      });
    }

    function load(state) {
      tilesEl.textContent = '';
      grid = emptyGrid();
      for (var i = 0; i < SIZE * SIZE; i++) {
        var v = state.cells[i];
        if (v) createTile(Math.floor(i / SIZE), i % SIZE, v, true);
      }
      score = state.score || 0;
      won = !!state.won;
      keepPlaying = !!state.keepPlaying;
      over = !movesAvailable();
    }

    function isValidState(s) {
      return s && Array.isArray(s.cells) && s.cells.length === SIZE * SIZE &&
        s.cells.every(function (v) { return v === 0 || (typeof v === 'number' && v >= 2 && (v & (v - 1)) === 0); });
    }

    // ---------- 规则 ----------
    function movesAvailable() {
      for (var r = 0; r < SIZE; r++) {
        for (var c = 0; c < SIZE; c++) {
          var t = grid[r][c];
          if (!t) return true;
          if (c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].value === t.value) return true;
          if (r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].value === t.value) return true;
        }
      }
      return false;
    }

    var VECTORS = {
      up: [-1, 0],
      down: [1, 0],
      left: [0, -1],
      right: [0, 1]
    };

    function move(dir) {
      finishPending();
      if (over || (won && !keepPlaying)) return;

      var dr = VECTORS[dir][0];
      var dc = VECTORS[dir][1];
      var before = snapshot();
      var next = emptyGrid();
      var removed = [];
      var mergedTiles = [];
      var gained = 0;
      var moved = false;

      for (var line = 0; line < SIZE; line++) {
        // 沿移动方向，从最靠前的格子开始处理
        var cells = [];
        for (var i = 0; i < SIZE; i++) {
          var k = (dr === 1 || dc === 1) ? SIZE - 1 - i : i;
          cells.push(dr !== 0 ? [k, line] : [line, k]);
        }

        var slot = 0;
        var last = null;
        for (var j = 0; j < SIZE; j++) {
          var t = grid[cells[j][0]][cells[j][1]];
          if (!t) continue;
          if (last && !last.merged && last.value === t.value) {
            last.value *= 2;
            last.merged = true;
            gained += last.value;
            t.r = last.r;
            t.c = last.c;
            removed.push(t);
            mergedTiles.push(last);
            moved = true;
          } else {
            var pos = cells[slot++];
            if (t.r !== pos[0] || t.c !== pos[1]) moved = true;
            t.r = pos[0];
            t.c = pos[1];
            next[pos[0]][pos[1]] = t;
            last = t;
          }
        }
      }

      if (!moved) return;

      history.push(before);
      if (history.length > MAX_HISTORY) history.shift();

      grid = next;
      score += gained;

      eachTile(function (t) { t.el.classList.remove('new', 'pop'); place(t); });
      removed.forEach(function (t) { t.el.classList.remove('new', 'pop'); place(t); });

      updateScore(gained);
      updateButtons();

      pending = {
        run: function () {
          removed.forEach(function (t) { t.el.remove(); });
          mergedTiles.forEach(function (t) {
            t.merged = false;
            paint(t);
            t.el.classList.add('merged');
            void t.el.offsetWidth; // 重新触发动画
            t.el.classList.add('pop');
            if (t.value >= WIN_VALUE && !won) won = true;
          });
          addRandomTile();
          over = !movesAvailable();
          showOverlays();
          save();
        }
      };
      pending.timer = setTimeout(finishPending, SLIDE_MS);
    }

    function finishPending() {
      if (!pending) return;
      var p = pending;
      pending = null;
      clearTimeout(p.timer);
      p.run();
    }

    // ---------- 操作 ----------
    function newGame() {
      finishPending();
      tilesEl.textContent = '';
      grid = emptyGrid();
      score = 0;
      won = false;
      keepPlaying = false;
      over = false;
      history = [];
      addRandomTile();
      addRandomTile();
      updateScore(0);
      updateButtons();
      showOverlays();
      save();
    }

    function undo() {
      finishPending();
      var prev = history.pop();
      if (!prev) return;
      load(prev);
      updateScore(0);
      updateButtons();
      showOverlays();
      save();
    }

    function continuePlaying() {
      keepPlaying = true;
      showOverlays();
      save();
      boardEl.focus({ preventScroll: true });
    }

    // 键盘
    var KEYMAP = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', s: 'down', a: 'left', d: 'right',
      W: 'up', S: 'down', A: 'left', D: 'right'
    };

    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        undo();
        return;
      }
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      var dir = KEYMAP[e.key];
      if (!dir) return;
      e.preventDefault();
      move(dir);
    });

    // 触摸 / 鼠标滑动
    var start = null;
    boardEl.addEventListener('pointerdown', function (e) {
      if (e.target.closest('button')) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      start = { x: e.clientX, y: e.clientY, id: e.pointerId };
      try { boardEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });

    function endSwipe(e) {
      if (!start || e.pointerId !== start.id) return;
      var dx = e.clientX - start.x;
      var dy = e.clientY - start.y;
      start = null;
      var ax = Math.abs(dx);
      var ay = Math.abs(dy);
      if (Math.max(ax, ay) < 24) return;
      if (ax > ay) move(dx > 0 ? 'right' : 'left');
      else move(dy > 0 ? 'down' : 'up');
    }
    boardEl.addEventListener('pointerup', endSwipe);
    boardEl.addEventListener('pointercancel', function () { start = null; });

    // iOS 旧版本兜底：阻止棋盘上的页面滚动
    boardEl.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

    document.getElementById('new-game').addEventListener('click', newGame);
    undoBtn.addEventListener('click', undo);
    boardEl.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-action]');
      if (!btn) return;
      var action = btn.getAttribute('data-action');
      if (action === 'new') newGame();
      else if (action === 'undo') undo();
      else if (action === 'continue') continuePlaying();
    });

    // ---------- 启动 ----------
    var saved = store.get(KEY_STATE, null);
    if (isValidState(saved) && saved.cells.some(Boolean)) {
      history = Array.isArray(saved.history) ? saved.history.filter(isValidState).slice(-MAX_HISTORY) : [];
      load(saved);
      updateScore(0);
      updateButtons();
      showOverlays();
    } else {
      newGame();
    }
  })();
  </script>
</body>
</html>
