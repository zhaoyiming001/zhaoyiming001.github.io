<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>华容道 · 游戏来了</title>
  <meta name="description" content="在线玩三国华容道：拖动武将和小兵，让曹操从底部出口逃出。15 个经典布局，带提示、撤销，自动保存进度。">
  <meta name="theme-color" content="#f7f2ea">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='6' fill='%239a5f33'/%3E%3Crect x='4' y='4' width='5' height='11' rx='1.5' fill='%232f6f8f'/%3E%3Crect x='10' y='4' width='12' height='11' rx='2' fill='%23c8412e'/%3E%3Crect x='23' y='4' width='5' height='11' rx='1.5' fill='%232f6f8f'/%3E%3Crect x='10' y='16' width='12' height='5' rx='1.5' fill='%232f6f8f'/%3E%3Crect x='4' y='16' width='5' height='11' rx='1.5' fill='%232f6f8f'/%3E%3Crect x='23' y='16' width='5' height='11' rx='1.5' fill='%232f6f8f'/%3E%3Crect x='10' y='22' width='5' height='5' rx='1.5' fill='%23f4e3bf'/%3E%3Crect x='17' y='22' width='5' height='5' rx='1.5' fill='%23f4e3bf'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/site.css">
  <script src="../../assets/site.js"></script>
  <style>
    :root {
      --stage-max: 460px;
      --frame-a: #b0743f;
      --frame-b: #8c5429;
      --tray: #ecd3a5;
      --tray-line: rgba(140, 90, 40, 0.10);
      --cao: #c8412e;
      --cao-ink: #ffe7a8;
      --gen: #2f6f8f;
      --gen-ink: #ffffff;
      --sol: #f6e6c4;
      --sol-ink: #6b4423;
      --exit-ink: #8c5429;
      --step: 120ms;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --frame-a: #5e3c23;
        --frame-b: #452a17;
        --tray: #33271d;
        --tray-line: rgba(255, 220, 170, 0.04);
        --cao: #c4402d;
        --cao-ink: #ffe2a0;
        --gen: #2e6884;
        --sol: #dcc59c;
        --sol-ink: #4a2f18;
        --exit-ink: #b08a63;
      }
    }
    :root[data-theme="dark"] {
      --frame-a: #5e3c23;
      --frame-b: #452a17;
      --tray: #33271d;
      --tray-line: rgba(255, 220, 170, 0.04);
      --cao: #c4402d;
      --cao-ink: #ffe2a0;
      --gen: #2e6884;
      --sol: #dcc59c;
      --sol-ink: #4a2f18;
      --exit-ink: #b08a63;
    }

    .game-page { overflow-x: hidden; }
    .stats .stat.lv { flex: 1.6; }
    .stats .stat.lv .stat-value { font-size: 18px; }

    /* 棋盘：外框 + 木托盘 */
    .stage {
      width: 100%;
      max-width: calc((100vh - 206px) * 0.78);
      max-width: calc((100dvh - 206px) * 0.78);
      margin: 0 auto;
    }
    .board {
      --frame: 11px;
      position: relative;
      padding: var(--frame);
      border-radius: 18px;
      background: linear-gradient(160deg, var(--frame-a), var(--frame-b));
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .tray {
      --cell: 80px;
      --gap: 6px;
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 10px;
      background-color: var(--tray);
      background-image: repeating-linear-gradient(90deg, var(--tray-line) 0 2px, transparent 2px 13px);
      box-shadow: inset 0 2px 6px rgba(60, 30, 10, 0.28);
      touch-action: none;
    }
    /* 底部出口 */
    .exit {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: calc(2 * var(--cell) + var(--gap));
      height: calc(var(--frame) + 2px);
      transform: translateX(-50%);
      background: var(--tray);
      display: grid;
      place-items: center;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.6em;
      text-indent: 0.6em;
      line-height: 1;
      color: var(--exit-ink);
      pointer-events: none;
    }
    .exit::before, .exit::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 3px;
      height: 100%;
      background: var(--frame-b);
      border-radius: 2px 2px 0 0;
    }
    .exit::before { left: -2px; }
    .exit::after { right: -2px; }

    .piece {
      position: absolute;
      left: 0;
      top: 0;
      display: grid;
      place-items: center;
      border-radius: calc(var(--cell) * 0.14);
      font-family: "STKaiti", "KaiTi", "Kaiti SC", "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", serif;
      font-weight: 900;
      line-height: 1.05;
      text-align: center;
      cursor: grab;
      transition: transform var(--step) ease-out, opacity 300ms ease;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.28), inset 0 -3px 0 rgba(0, 0, 0, 0.18), 0 2px 4px rgba(40, 20, 5, 0.3);
      will-change: transform;
      z-index: 1;
    }
    .piece.dragging { transition: none; z-index: 3; cursor: grabbing; filter: brightness(1.06); }
    .piece.cao { background: var(--cao); color: var(--cao-ink); font-size: calc(var(--cell) * 0.46); letter-spacing: 0.04em; text-shadow: 0 1px 2px rgba(80, 10, 0, 0.45); }
    .piece.gen { background: var(--gen); color: var(--gen-ink); font-size: calc(var(--cell) * 0.34); }
    .piece.sol { background: var(--sol); color: var(--sol-ink); font-size: calc(var(--cell) * 0.38); }
    .piece.v span { display: block; width: 1em; }
    .piece.out { opacity: 0; }
    .piece.hint { z-index: 3; animation: hint-glow 700ms ease-in-out infinite alternate; }
    @keyframes hint-glow {
      from { box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.28), 0 0 0 2px var(--accent), 0 0 10px 2px var(--accent); }
      to { box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.28), 0 0 0 3px var(--accent), 0 0 18px 6px var(--accent); }
    }
    .piece.shake { animation: shake 260ms ease; }
    @keyframes shake {
      0%, 100% { translate: 0 0; }
      25% { translate: -3px 0; }
      75% { translate: 3px 0; }
    }

    .stage .overlay { border-radius: 18px; }
    .overlay.win h2 { color: var(--cao); }
    .overlay .sub { font-size: 14px; }

    .gcontrols .btn { flex: 1; padding: 0 8px; min-width: 0; }

    /* 选关 */
    .lv-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .lv-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 6px 8px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease;
    }
    .lv-card:hover { border-color: var(--text-dim); }
    .lv-card:active { transform: scale(0.96); }
    .lv-card.current { border: 2px solid var(--accent); padding: 9px 5px 7px; }
    .lv-card b { font-size: 14px; font-weight: 900; line-height: 1.2; }
    .lv-card small { font-size: 12px; font-weight: 700; color: var(--text-dim); line-height: 1.2; }
    .lv-card .done {
      position: absolute;
      top: 5px;
      right: 6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--good);
      color: #fff;
      font-size: 12px;
      line-height: 20px;
      font-weight: 900;
    }
    .mini {
      position: relative;
      width: 48px;
      aspect-ratio: 4 / 5;
      border-radius: 5px;
      background: var(--tray);
      box-shadow: 0 0 0 3px var(--frame-b);
      margin-top: 3px;
    }
    .mini i {
      position: absolute;
      border-radius: 2px;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.25);
    }
    .mini .cao { background: var(--cao); }
    .mini .gen { background: var(--gen); }
    .mini .sol { background: var(--sol); }

    @media (max-width: 380px) {
      .stats .stat.lv .stat-value { font-size: 16px; }
      .gcontrols .btn svg { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      :root { --step: 0ms; }
    }
  </style>
</head>

  <script>
  /* SOLVER-START */
  // 华容道求解器：广度优先搜索，同一棋子连续移动（可拐弯）算一步。
  // 局面编码：按行扫描，每个棋子左上角或空格记一个五进制数字（0 空 1 兵 2 竖 3 横 4 曹），左右镜像视为同一局面。
  var KlotskiSolver = (function () {
    var TW = [0, 1, 1, 2, 2], TH = [0, 1, 2, 1, 2];
    var DR = [-1, 1, 0, 0], DC = [0, 0, -1, 1];
    var g2 = new Int8Array(20), own = new Int8Array(20);
    var mq = new Int8Array(20), mp = new Int8Array(20), md = new Int8Array(20);
    var POW = [];
    var NSYM = 12;

    // 开放寻址哈希表：存 key+1（0 表示空），值为父局面 key+1
    var HBITS = 17, HCAP = 1 << HBITS, hKeys = null, hVals = null, hSize = 0;
    function hReset() {
      if (!hKeys) { hKeys = new Int32Array(HCAP); hVals = new Int32Array(HCAP); }
      else hKeys.fill(0);
      hSize = 0;
    }
    function hSlot(key) {
      var i = Math.imul(key, -1640531535) >>> (32 - HBITS);
      while (hKeys[i] !== 0 && hKeys[i] !== key + 1) i = (i + 1) & (HCAP - 1);
      return i;
    }
    function hPut(slot, key, val) {
      hKeys[slot] = key + 1;
      hVals[slot] = val + 1;
      if (++hSize > HCAP >> 1) {
        var ok = hKeys, ov = hVals;
        HBITS++; HCAP <<= 1;
        hKeys = new Int32Array(HCAP); hVals = new Int32Array(HCAP);
        for (var j = 0; j < ok.length; j++) if (ok[j]) { var s = hSlot(ok[j] - 1); hKeys[s] = ok[j]; hVals[s] = ov[j]; }
      }
    }
    var Q1 = new Int32Array(1 << 15), Q2 = new Int32Array(1 << 15), nextQ = Q2, qn = 0;
    function qPush(key) {
      if (qn >= nextQ.length) {
        var big = new Int32Array(nextQ.length * 2);
        big.set(nextQ);
        if (nextQ === Q1) Q1 = big; else Q2 = big;
        nextQ = big;
      }
      nextQ[qn++] = key;
    }

    function typeOf(p) { return p.w === 2 ? (p.h === 2 ? 4 : 3) : (p.h === 2 ? 2 : 1); }

    function gridOf(pieces) {
      var g = new Int8Array(20), k, a, b;
      for (k = 0; k < pieces.length; k++) {
        var p = pieces[k];
        for (a = 0; a < p.h; a++) for (b = 0; b < p.w; b++) g[(p.r + a) * 4 + p.c + b] = 5;
        g[p.r * 4 + p.c] = typeOf(p);
      }
      return g;
    }

    function encode(g) {
      var key = 0;
      for (var i = 0; i < 20; i++) if (g[i] !== 5) key = key * 5 + g[i];
      return key;
    }
    function encodeMirror(g) {
      var key = 0;
      for (var r = 0; r < 20; r += 4) {
        for (var c = 3; c >= 0; c--) {
          var v = g[r + c];
          if (v === 0) key = key * 5;
          else if (v === 5) {
            if (c > 0 && (g[r + c - 1] === 3 || g[r + c - 1] === 4)) key = key * 5 + g[r + c - 1];
          } else if (v === 1 || v === 2) key = key * 5 + v;
        }
      }
      return key;
    }
    function canon(g) {
      var a = encode(g), b = encodeMirror(g);
      return a < b ? a : b;
    }
    function decode(key, g) {
      var i, s = 0;
      for (i = 0; i < 20; i++) g[i] = -1;
      for (i = 0; i < 20; i++) {
        if (g[i] !== -1) continue;
        var t = Math.floor(key / POW[s]) % 5;
        s++;
        g[i] = t;
        if (t > 0) for (var a = 0; a < TH[t]; a++) for (var b = 0; b < TW[t]; b++) if (a || b) g[i + a * 4 + b] = 5;
      }
    }
    function setSymbols(n) {
      if (n === NSYM && POW.length) return;
      NSYM = n;
      POW = [];
      for (var i = 0, v = 1; i < n; i++, v *= 5) POW.unshift(v);
    }

    // 枚举局面 g 的所有一步走法，每个结果调用 visit(cell, nk)，返回 true 则停止
    function expand(g, visit) {
      var cell, a, b, cand = 0;
      for (cell = 0; cell < 20; cell++) {
        var tt = g[cell];
        if (tt === 0) own[cell] = -1;
        else if (tt !== 5) for (a = 0; a < TH[tt]; a++) for (b = 0; b < TW[tt]; b++) own[cell + a * 4 + b] = cell;
      }
      for (cell = 0; cell < 20; cell++) {
        if (g[cell] !== 0) continue;
        var er = (cell / 4) | 0, ec = cell % 4;
        if (er > 0 && own[cell - 4] >= 0) cand |= 1 << own[cell - 4];
        if (er < 4 && own[cell + 4] >= 0) cand |= 1 << own[cell + 4];
        if (ec > 0 && own[cell - 1] >= 0) cand |= 1 << own[cell - 1];
        if (ec < 3 && own[cell + 1] >= 0) cand |= 1 << own[cell + 1];
      }
      for (cell = 0; cell < 20; cell++) {
        if (!(cand & (1 << cell))) continue;
        var t = g[cell];
        var w = TW[t], h = TH[t], r0 = (cell / 4) | 0, c0 = cell % 4;
        var visited = 1 << cell, head = 0, tail = 1;
        mq[0] = cell;
        while (head < tail) {
          var pc = mq[head++];
          var pr = (pc / 4) | 0, pcc = pc % 4;
          for (var d = 0; d < 4; d++) {
            var nr = pr + DR[d], nc = pcc + DC[d];
            if (nr < 0 || nc < 0 || nr + h > 5 || nc + w > 4) continue;
            var nk = nr * 4 + nc;
            if (visited & (1 << nk)) continue;
            var ok = true;
            for (a = 0; a < h && ok; a++) for (b = 0; b < w; b++) {
              var rr = nr + a, cc = nc + b;
              if (g[rr * 4 + cc] !== 0 && !(rr >= r0 && rr < r0 + h && cc >= c0 && cc < c0 + w)) { ok = false; break; }
            }
            if (!ok) continue;
            visited |= 1 << nk;
            mq[tail++] = nk;
            mp[nk] = pc;
            md[nk] = d;
            g2.set(g);
            for (a = 0; a < h; a++) for (b = 0; b < w; b++) g2[(r0 + a) * 4 + c0 + b] = 0;
            for (a = 0; a < h; a++) for (b = 0; b < w; b++) g2[(nr + a) * 4 + nc + b] = 5;
            g2[nk] = t;
            if (visit(cell, nk)) return true;
          }
        }
      }
      return false;
    }

    var parentKey = 0, goalKey = -1;
    function visitBfs() {
      var key = canon(g2);
      var slot = hSlot(key);
      if (hKeys[slot] !== 0) return false;
      hPut(slot, key, parentKey);
      if (g2[13] === 4) { goalKey = key; return true; }
      qPush(key);
      return false;
    }

    // 求最优解：返回 { moves, line }，line 为从当前到终局的局面编码序列；无解返回 null
    function solve(pieces) {
      var g = gridOf(pieces), empties = 0;
      for (var i = 0; i < 20; i++) if (g[i] === 0) empties++;
      setSymbols(pieces.length + empties);
      var start = canon(g);
      if (g[13] === 4) return { moves: 0, line: [start] };
      hReset();
      hPut(hSlot(start), start, -1);
      goalKey = -1;
      nextQ = Q2; qn = 0;
      parentKey = start;
      expand(g, visitBfs);
      while (goalKey < 0 && qn) {
        var cur = nextQ, n = qn;
        nextQ = cur === Q1 ? Q2 : Q1;
        qn = 0;
        for (var q = 0; q < n && goalKey < 0; q++) {
          parentKey = cur[q];
          decode(parentKey, g);
          expand(g, visitBfs);
        }
      }
      if (goalKey < 0) return null;
      var line = [], k = goalKey;
      while (k >= 0) { line.push(k); k = hVals[hSlot(k)] - 1; }
      line.reverse();
      return { moves: line.length - 1, line: line, explored: hSize };
    }

    // 找出从当前局面一步到达 target 局面的走法：{ piece 下标, path 方向序列 }
    function moveTo(pieces, target) {
      var g = gridOf(pieces), res = null;
      expand(g, function (cell, nk) {
        if (canon(g2) !== target) return false;
        var path = [], x = nk;
        while (x !== cell) { path.unshift(md[x]); x = mp[x]; }
        for (var k = 0; k < pieces.length; k++) if (pieces[k].r * 4 + pieces[k].c === cell) res = { piece: k, path: path };
        return true;
      });
      return res;
    }

    return {
      solve: solve,
      moveTo: moveTo,
      key: function (pieces) { return canon(gridOf(pieces)); }
    };
  })();
  /* SOLVER-END */

  (function () {
    'use strict';

    // 关卡：C 曹操 G 关羽 Z 张飞 Y 赵云 M 马超 H 黄忠 1-4 兵 . 空；min 为最少步数（BFS 验证）
    var LEVELS = [
      { name: '比翼横空', map: 'GGCC ZZCC YYMM 1.2H 3.4H', min: 28 },
      { name: '捷足先登', map: '1CC2 3CC4 .GG. ZYMH ZYMH', min: 32 },
      { name: '兵临曹营', map: '1CC2 3CC4 ZGGY ZMHY .MH.', min: 34 },
      { name: '一路顺风', map: 'ZCC1 ZCC2 YGGM Y3HM .4H.', min: 39 },
      { name: '雨声淅沥', map: 'ZCC1 ZCC2 YGGM YH.M 3H.4', min: 47 },
      { name: '左右布兵', map: '1CC2 3CC4 ZYMH ZYMH .GG.', min: 54 },
      { name: '一路进军', map: 'ZCC1 ZCC2 YMH3 YMH4 .GG.', min: 58 },
      { name: '齐头并进', map: 'ZCCY ZCCY 1234 MGGH M..H', min: 60 },
      { name: '指挥若定', map: 'ZCCY ZCCY 1GG2 M34H M..H', min: 70 },
      { name: '桃花园中', map: '1CC2 ZCCY ZMHY 3MH4 .GG.', min: 70 },
      { name: '将拥曹营', map: '.CC. ZCCY ZMHY 1MH2 GG34', min: 72 },
      { name: '兵分三路', map: '1CC2 ZCCY ZGGY M34H M..H', min: 72 },
      { name: '横刀立马', map: 'ZCCY ZCCY MGGH M12H 3..4', min: 81 },
      { name: '层层设防', map: 'ZCCY ZCCY 1GG2 3MM4 .HH.', min: 102 },
      { name: '峰回路转', map: '123Z CCYZ CCYM .HHM .4GG', min: 138 }
    ];
    var NAMES = { C: '曹操', G: '关羽', Z: '张飞', Y: '赵云', M: '马超', H: '黄忠' };
    var DR = [-1, 1, 0, 0], DC = [0, 0, -1, 1];
    var KEY_STATE = 'gzly.klotski.state';
    var KEY_REC = 'gzly.klotski.records';
    var STEP_MS = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 120;
    var store = window.Site.store;
    var sound = window.Site.sound;

    var boardEl = document.getElementById('board');
    var trayEl = document.getElementById('tray');
    var nameEl = document.getElementById('lv-name');
    var movesEl = document.getElementById('moves');
    var optEl = document.getElementById('optimal');
    var undoBtn = document.getElementById('undo');
    var hintBtn = document.getElementById('hint');
    var winEl = document.getElementById('win');

    var lv = 0;
    var pieces = [];     // { id, kind, w, h, r, c, el }
    var hist = [];       // [棋子下标, 移动前行, 移动前列]，同一棋子连续移动合并为一步
    var won = false;
    var busy = false;    // 提示动画进行中
    var records = store.get(KEY_REC, {}) || {};
    if (typeof records !== 'object' || Array.isArray(records)) records = {};
    var cell = 80, gap = 6, pitch = 86;
    var hintLine = null;

    window.Site.played('klotski');

    function parseMap(map) {
      var s = map.replace(/\s/g, ''), seen = {}, list = [];
      for (var i = 0; i < 20; i++) {
        var ch = s[i];
        if (ch === '.' || seen[ch]) continue;
        seen[ch] = true;
        var r = (i / 4) | 0, c = i % 4, w = 1, h = 1;
        while (c + w < 4 && s[r * 4 + c + w] === ch) w++;
        while (r + h < 5 && s[(r + h) * 4 + c] === ch) h++;
        var kind = ch === 'C' ? 'cao' : (NAMES[ch] ? 'gen' : 'sol');
        list.push({ id: ch, kind: kind, name: NAMES[ch] || '兵', w: w, h: h, r: r, c: c });
      }
      return list;
    }

    // ---------- 渲染 ----------
    function layout() {
      var W = trayEl.clientWidth;
      if (!W) return;
      gap = Math.max(4, Math.round(W * 0.018));
      cell = (W - 5 * gap) / 4;
      pitch = cell + gap;
      trayEl.style.height = (5 * cell + 6 * gap) + 'px';
      boardEl.style.setProperty('--cell', cell + 'px');
      boardEl.style.setProperty('--gap', gap + 'px');
      trayEl.style.setProperty('--cell', cell + 'px');
      pieces.forEach(function (p) {
        p.el.style.width = (p.w * cell + (p.w - 1) * gap) + 'px';
        p.el.style.height = (p.h * cell + (p.h - 1) * gap) + 'px';
        place(p, 0, 0);
      });
    }

    function place(p, ox, oy) {
      var x = gap + p.c * pitch + (ox || 0);
      var y = gap + p.r * pitch + (oy || 0);
      if (p.out) y += pitch * 1.2;
      p.el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    }

    function build() {
      trayEl.textContent = '';
      pieces.forEach(function (p, i) {
        var el = document.createElement('div');
        el.className = 'piece ' + p.kind + (p.h > p.w ? ' v' : '');
        el.setAttribute('data-i', i);
        if (p.h > p.w) {
          for (var k = 0; k < p.name.length; k++) {
            var sp = document.createElement('span');
            sp.textContent = p.name[k];
            el.appendChild(sp);
          }
        } else {
          el.textContent = p.name;
        }
        p.el = el;
        trayEl.appendChild(el);
      });
      layout();
    }

    function updateUI() {
      var L = LEVELS[lv];
      nameEl.textContent = L.name;
      movesEl.textContent = hist.length;
      optEl.textContent = L.min;
      undoBtn.disabled = won || busy || hist.length === 0;
      hintBtn.disabled = won || busy;
      winEl.hidden = !won;
    }

    // ---------- 存档 ----------
    function save() {
      store.set(KEY_STATE, {
        lv: lv,
        name: LEVELS[lv].name,
        pos: pieces.map(function (p) { return [p.r, p.c]; }),
        hist: hist.slice(-500),
        won: won
      });
    }

    function solvedCount() {
      var n = 0;
      LEVELS.forEach(function (L) { if (records[L.name] && records[L.name].best) n++; });
      return n;
    }
    function updateHomeStat() {
      window.Site.setHomeStat('klotski', '通关 ' + solvedCount() + '/' + LEVELS.length);
    }

    function validPositions(list, pos) {
      if (!Array.isArray(pos) || pos.length !== list.length) return false;
      var occ = [];
      for (var i = 0; i < list.length; i++) {
        var q = pos[i];
        if (!Array.isArray(q) || q.length !== 2) return false;
        var r = q[0], c = q[1], p = list[i];
        if (r !== (r | 0) || c !== (c | 0) || r < 0 || c < 0 || r + p.h > 5 || c + p.w > 4) return false;
        for (var a = 0; a < p.h; a++) for (var b = 0; b < p.w; b++) {
          var k = (r + a) * 4 + c + b;
          if (occ[k]) return false;
          occ[k] = true;
        }
      }
      return true;
    }

    // ---------- 规则 ----------
    function occupiedBy(r, c) {
      for (var i = 0; i < pieces.length; i++) {
        var p = pieces[i];
        if (r >= p.r && r < p.r + p.h && c >= p.c && c < p.c + p.w) return i;
      }
      return -1;
    }

    function canMove(p, d) {
      var nr = p.r + DR[d], nc = p.c + DC[d];
      if (nr < 0 || nc < 0 || nr + p.h > 5 || nc + p.w > 4) return false;
      var self = pieces.indexOf(p);
      for (var a = 0; a < p.h; a++) for (var b = 0; b < p.w; b++) {
        var o = occupiedBy(nr + a, nc + b);
        if (o >= 0 && o !== self) return false;
      }
      return true;
    }

    function step(p, d) {
      var idx = pieces.indexOf(p);
      var last = hist[hist.length - 1];
      var pr = p.r, pc = p.c;
      p.r += DR[d];
      p.c += DC[d];
      if (last && last[0] === idx) {
        if (last[1] === p.r && last[2] === p.c) hist.pop(); // 回到原位，不算步数
      } else {
        hist.push([idx, pr, pc]);
      }
      sound('move');
      updateUI();
      save();
    }

    function isGoal() {
      var cao = pieces.filter(function (p) { return p.kind === 'cao'; })[0];
      return cao && cao.r === 3 && cao.c === 1;
    }

    function checkWin() {
      if (won || !isGoal()) return false;
      won = true;
      endDrag();
      var L = LEVELS[lv];
      var moves = hist.length;
      var rec = records[L.name] || {};
      var prevBest = rec.best || 0;
      var newBest = !prevBest || moves < prevBest;
      if (newBest) rec.best = moves;
      records[L.name] = rec;
      store.set(KEY_REC, records);
      updateHomeStat();
      document.getElementById('win-text').textContent = '用了 ' + moves + ' 步 · 最少 ' + L.min + ' 步';
      document.getElementById('win-sub').textContent = moves <= L.min ? '完美！最少步数通关' : (newBest && prevBest ? '刷新个人最佳' : '个人最佳 ' + rec.best + ' 步');
      document.getElementById('next').hidden = false;
      sound('win');
      save();
      var cao = pieces.filter(function (p) { return p.kind === 'cao'; })[0];
      setTimeout(function () {
        if (!won) return;
        cao.out = true;
        cao.el.classList.add('out');
        place(cao, 0, 0);
      }, STEP_MS + 60);
      setTimeout(function () { if (won) updateUI(); }, STEP_MS + 420);
      undoBtn.disabled = true;
      hintBtn.disabled = true;
      return true;
    }

    // ---------- 关卡 ----------
    function loadLevel(i, saved) {
      endDrag();
      lv = i;
      pieces = parseMap(LEVELS[lv].map);
      hist = [];
      won = false;
      busy = false;
      if (saved) {
        saved.pos.forEach(function (q, k) { pieces[k].r = q[0]; pieces[k].c = q[1]; });
        hist = saved.hist;
        won = !!saved.won && isGoal();
      }
      build();
      if (won) {
        var L = LEVELS[lv], rec = records[L.name] || {};
        document.getElementById('win-text').textContent = '用了 ' + hist.length + ' 步 · 最少 ' + L.min + ' 步';
        document.getElementById('win-sub').textContent = rec.best ? '个人最佳 ' + rec.best + ' 步' : '';
        pieces.forEach(function (p) { if (p.kind === 'cao') { p.out = true; p.el.classList.add('out'); place(p, 0, 0); } });
      }
      updateUI();
      save();
      warmHint();
    }

    // 空闲时预先求解当前局面，让提示秒出（缓存的最优路线对同一关任意局面都可复用）
    var warmTimer = 0;
    function warmHint() {
      var idle = window.requestIdleCallback || function (fn) { return setTimeout(fn, 600); };
      var my = ++warmTimer;
      setTimeout(function () {
        idle(function () {
          if (my !== warmTimer || won || busy || drag) return;
          var key = KlotskiSolver.key(pieces);
          if (hintLine && hintLine.indexOf(key) >= 0) return;
          var res = KlotskiSolver.solve(pieces);
          if (res) hintLine = res.line;
        }, { timeout: 2500 });
      }, 400);
    }

    function undo() {
      if (busy || won) return;
      var last = hist.pop();
      if (!last) return;
      var p = pieces[last[0]];
      p.r = last[1];
      p.c = last[2];
      place(p, 0, 0);
      sound('move');
      updateUI();
      save();
    }

    function reset() {
      sound('start');
      loadLevel(lv);
    }

    // ---------- 提示 ----------
    function nextHintMove() {
      var key = KlotskiSolver.key(pieces);
      var at = hintLine ? hintLine.indexOf(key) : -1;
      if (at < 0 || at >= hintLine.length - 1) {
        var res = KlotskiSolver.solve(pieces);
        if (!res || res.line.length < 2) return null;
        hintLine = res.line;
        at = 0;
      }
      return KlotskiSolver.moveTo(pieces, hintLine[at + 1]);
    }

    function hint() {
      if (busy || won) return;
      endDrag();
      var mv = nextHintMove();
      if (!mv) { sound('error'); return; }
      sound('click');
      busy = true;
      updateUI();
      var p = pieces[mv.piece];
      p.el.classList.add('hint');
      var k = 0;
      function next() {
        if (lvToken !== token) return;
        if (k < mv.path.length) {
          step(p, mv.path[k++]);
          place(p, 0, 0);
          busy = true;
          updateUI();
          setTimeout(next, STEP_MS + 50);
          return;
        }
        p.el.classList.remove('hint');
        busy = false;
        updateUI();
        checkWin();
      }
      var token = lvToken;
      setTimeout(next, 260);
    }
    var lvToken = 0;

    // ---------- 拖动 ----------
    var drag = null;

    function dirsOf(p) {
      var list = [];
      for (var d = 0; d < 4; d++) if (canMove(p, d)) list.push(d);
      return list;
    }

    function endDrag() {
      if (!drag) return;
      var p = drag.p;
      drag = null;
      p.el.classList.remove('dragging');
      place(p, 0, 0);
    }

    trayEl.addEventListener('pointerdown', function (e) {
      if (drag || busy || won) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      var el = e.target.closest('.piece');
      if (!el) return;
      e.preventDefault();
      var p = pieces[+el.getAttribute('data-i')];
      drag = { p: p, id: e.pointerId, ax: e.clientX, ay: e.clientY, sx: e.clientX, sy: e.clientY, steps: 0, moved: false, warned: false };
      try { trayEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      el.classList.add('dragging');
    });

    trayEl.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      var p = drag.p;
      if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 8) drag.moved = true;
      var dx, dy, guard = 0;
      // 逐格跟随手指：超过半格就走一步，每步只沿一个方向
      while (guard++ < 12) {
        dx = e.clientX - drag.ax;
        dy = e.clientY - drag.ay;
        var ax = Math.abs(dx), ay = Math.abs(dy), half = pitch * 0.5;
        if (Math.max(ax, ay) < half) break;
        var main = ax >= ay ? (dx > 0 ? 3 : 2) : (dy > 0 ? 1 : 0);
        var alt = -1;
        if (ax >= ay && ay >= half) alt = dy > 0 ? 1 : 0;
        if (ay > ax && ax >= half) alt = dx > 0 ? 3 : 2;
        var d = canMove(p, main) ? main : (alt >= 0 && canMove(p, alt) ? alt : -1);
        if (d < 0) {
          if (!drag.warned && !drag.steps) { drag.warned = true; sound('error'); }
          break;
        }
        step(p, d);
        drag.steps++;
        drag.ax += DC[d] * pitch;
        drag.ay += DR[d] * pitch;
        if (checkWin()) return;
      }
      // 视觉跟随：可走方向最多跟半格，受阻方向只轻微挪动
      dx = e.clientX - drag.ax;
      dy = e.clientY - drag.ay;
      var ox = 0, oy = 0, lim = pitch * 0.5, nudge = Math.min(4, pitch * 0.05);
      if (Math.abs(dx) >= Math.abs(dy)) {
        var dh = dx > 0 ? 3 : 2;
        ox = Math.max(-lim, Math.min(lim, dx));
        if (!canMove(p, dh)) ox = Math.max(-nudge, Math.min(nudge, dx * 0.1));
      } else {
        var dv = dy > 0 ? 1 : 0;
        oy = Math.max(-lim, Math.min(lim, dy));
        if (!canMove(p, dv)) oy = Math.max(-nudge, Math.min(nudge, dy * 0.1));
      }
      place(p, ox, oy);
    });

    function pointerEnd(e) {
      if (!drag || e.pointerId !== drag.id) return;
      var d = drag;
      endDrag();
      if (!d.moved && !d.steps && e.type === 'pointerup') {
        // 轻点：只有一个可走方向时走一格
        var dirs = dirsOf(d.p);
        if (dirs.length === 1) {
          step(d.p, dirs[0]);
          place(d.p, 0, 0);
          checkWin();
        } else if (!dirs.length) {
          sound('error');
          d.p.el.classList.remove('shake');
          void d.p.el.offsetWidth;
          d.p.el.classList.add('shake');
        }
      }
    }
    trayEl.addEventListener('pointerup', pointerEnd);
    trayEl.addEventListener('pointercancel', pointerEnd);
    trayEl.addEventListener('lostpointercapture', pointerEnd);
    trayEl.addEventListener('animationend', function (e) { e.target.classList.remove('shake'); });
    boardEl.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    boardEl.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    // ---------- 选关 ----------
    function renderLevels() {
      var grid = document.getElementById('lv-grid');
      grid.textContent = '';
      LEVELS.forEach(function (L, i) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'lv-card' + (i === lv ? ' current' : '');
        btn.setAttribute('data-lv', i);
        var mini = document.createElement('div');
        mini.className = 'mini';
        parseMap(L.map).forEach(function (p) {
          var b = document.createElement('i');
          b.className = p.kind;
          b.style.left = (p.c * 25 + 2.5) + '%';
          b.style.top = (p.r * 20 + 2) + '%';
          b.style.width = (p.w * 25 - 5) + '%';
          b.style.height = (p.h * 20 - 4) + '%';
          mini.appendChild(b);
        });
        btn.appendChild(mini);
        var nm = document.createElement('b');
        nm.textContent = L.name;
        btn.appendChild(nm);
        var rec = records[L.name];
        var info = document.createElement('small');
        info.textContent = '最少 ' + L.min + ' 步';
        btn.appendChild(info);
        if (rec && rec.best) {
          var best = document.createElement('small');
          best.textContent = '最佳 ' + rec.best;
          btn.appendChild(best);
          var ok = document.createElement('span');
          ok.className = 'done';
          ok.textContent = '✓';
          btn.appendChild(ok);
        }
        grid.appendChild(btn);
      });
    }

    document.getElementById('pick').addEventListener('click', function () {
      sound('click');
      renderLevels();
      var cur = document.querySelector('.lv-card.current');
      setTimeout(function () { if (cur) cur.scrollIntoView({ block: 'nearest' }); }, 0);
    });
    document.getElementById('lv-grid').addEventListener('click', function (e) {
      var btn = e.target.closest('.lv-card');
      if (!btn) return;
      sound('select');
      lvToken++;
      loadLevel(+btn.getAttribute('data-lv'));
      window.Site.closeDialog('levels');
    });

    undoBtn.addEventListener('click', undo);
    document.getElementById('reset').addEventListener('click', function () { lvToken++; reset(); });
    hintBtn.addEventListener('click', hint);
    document.getElementById('again').addEventListener('click', function () { lvToken++; reset(); });
    document.getElementById('next').addEventListener('click', function () {
      sound('start');
      lvToken++;
      loadLevel((lv + 1) % LEVELS.length);
    });

    document.addEventListener('keydown', function (e) {
      if (document.querySelector('dialog[open]')) return;
      if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        undo();
      }
    });

    if (window.ResizeObserver) new ResizeObserver(layout).observe(trayEl);
    else window.addEventListener('resize', layout);

    // ---------- 启动 ----------
    var saved = store.get(KEY_STATE, null);
    var ok = saved && typeof saved.lv === 'number' && LEVELS[saved.lv] && saved.name === LEVELS[saved.lv].name &&
      validPositions(parseMap(LEVELS[saved.lv].map), saved.pos) && Array.isArray(saved.hist) &&
      saved.hist.every(function (h) { return Array.isArray(h) && h.length === 3 && h[0] >= 0 && h[0] < saved.pos.length; });
    if (ok) loadLevel(saved.lv, saved);
    else loadLevel(0);
    updateHomeStat();

  })();
  </script>
